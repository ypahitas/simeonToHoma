<script id="album-data" type="application/json">{"el": {"intro": ["Έμπνευση μου για τον δίσκον «Το χώμαν» εν κάποιες ερμηνείες κυπριακών παραδοσιακών τραουθκιών που άκουσα που «πραχτικούς», δηλαδή χωρίς τυπικήν μουσικήν εκπαίδευσην, μουσικούς τζ̆αι τραουδιστές[^1]. Στην πλειοψηφία τους εδραστηριοποιηθήκαν στο πρώτο μισό του 20ου αιώνα. Γράφω πιο κάτω στες σημειώσεις για κάθε κομμάτιν του δίσκου ποιοι εν τούτοι τζ̆αι το αρχείο που τους άκουσα. Στες σημειώσεις συμπεριλαβάνω επίσης, όπου εθεώρησα σωστό, σχολιασμόν για το κομμάτιν το ίδιο (π.χ. πόθεν έπιαεν το όνομαν του) τζ̆αι το πως επρόσεγγισα την ερμηνεία, διασκεύη/ανασύνθεση τζ̆αι ενορχήστρωση του.", "Εχτός όμως που μια σύντομη βιογραφία για τον κάθε ένα που τους μουσικούς τζ̆αι  τραουδιστές που εχρησιμοποίησα ως αναφορά, θα βρείτε τζ̆αι κάποιες που τες ιστορίες τους που εμοιραστήκαν μαζί μου οι ίδιοι, αν ήταν εν ζωή, ή οι επιζώντες συγγενείς τους. Στην αρχή, εξεκίνησα να ψάχνω πληροφορίες για την ζωή τούντων βιωματικών μουσικών τζ̆αι τραουδιστών καθαρά για δική μου ενημέρωση. Εθεώρησα ότι αν ήταν να διασκεύασω, ανασυνθέσω ή ερμηνεύσω κάτι με τούντους αθρώπους ως αναφορά, την ερμηνεία ή τον στίχο τους, έπρεπε να μάθω ότι μπόρω για τζ̆είνους. Εγύρεψα τους ίδιους, αν εζούσαν, ή τα παιθκιά, αγγόνια, αδερφοτέχνια τους, αν όι, για να τους κάμω συνέντευξη. Σύνολο εκουβέντιασα με δεκαενιά συνεντευξιαζόμενους σε Λευκωσία, Παραλίμνι, Λιοπέτρι, Αυκόρου, Δερύνεια, Ξυλοφάου, Λεμεσό, Έμπα τζ̆αι Γιόλου. Ενώ εξεκίνησα έχοντας μες τον νου μου συγκεκριμένες ερωτήσεις που έθελα να κάμω, η συνέντευξη συνήθως εκατέληγε σε μιαν όμορφη κουβέντα που έρεε που μόνη της. Έμαθα ιστορίες για την ζωή τούντων μουσικών τζ̆αι τραουδιστών που εδράσαν σε μια καθημερινότητα πολλά διαφορετικήν, απ’ ότι την ξέρει η γενιά μου τουλάχιστον. Επίσης επροσπάθησα να μαζέψω μαρτυρίες που αφορούσαν την τέχνη τους που επρωταγωνιστούσε σε χαρές, χαζ̆ια τζ̆αι ζιαφέθκια αλλά είσ̆εν επίσης ξεχωριστή θέση τζ̆αι στα μαράζ̆ια τζ̆αι τες θλίψεις.", "Εκ πρώτης όψεως κάποιος μπορεί να πει ότι οι ιστορίες που παραθέτω στες σημειώσεις κάθε κομμάθκιού εν έχουν να κάμουν τίποτε με το κομμάτι που παρουσιάζεται. Συγκεντρώνοντας όμως σιγά σιγά τούντες ιστορίες, αντιλήφθηκα ότι εσταμάτησε πλέον η έρευνα μου να εν παρεμφερής στον δίσκο τζ̆αι καθαρά για δίκην μου προσωπική ενημέρωση, αλλά εξεκίνησεν να αποχτά αυτοτελήν σημασίαν τζ̆αι για τον ακροατή του δίσκου. Όπως η ερμηνεία σε ένα παραδοσιακό τραούδιν, ιδίως ενός σύγχρονου μουσικού, ενημερώνεται που τες πληροφορίες, βιογραφικές τζ̆αι μη, που κάτεχει για την αναφορά του έτσι, πιστεύκω, τζ̆αι ο σύγχρονος ακροατής που θα ακούσει τόυντον δίσκον θα τον εννοήσει καλλίττερα θκιεβάζοντας τες ιστορίες που εσυμπεριέλαβα για κάθε κομμάτι. Θα ανοίξει έναν παράθυρο σε μιαν Κύπρο άλλης εποχής με πρωταγωνιστές τους ίδιους τους μουσικούς τζ̆αι τραουδιστές.", "Το μεγάλον στοίχημαν για εμένα τότε γίνεται: αφού ποσ̆επάσει ο αναγνώστης μέσα που τούντο παραθύριν, να αφεθεί σαν ακροατής τζ̆αι να ακούσει τόυντην μουσική όπως την εκαταλάβαμεν εμείς τζ̆αι ηχογραφήσαμε το 2026, με μουσικούς, ως επί το πλείστον, γέννημαν των δεκαετιών του ‘80  τζ̆αι του ‘90. Αν καταφέρουμε να τον συγκινήσουμεν τότε εκαταφέραμεν να παρουσιάσουμε τούντα δεκαεφτά κομμάθκια όι ως μουσικά κειμήλια αλλά ως ζώσαν παράδοση σχετική στο σήμερα.", "Καλήν ακρόαση.", "Συμεών"], "songs": [{"id": "song-1", "title": "Της Σούσας (Αγία Μαρίνα Σκυλλούρας)", "credits": ["Στίχοι & Μουσική: Παραδοσιακό", "Φωνές: Aντώνης Πουλλής (1ο και 4ο δίστιχο), Συμεών Μερκούρης (2ο δίστιχο), Στέλιος Παπαμιχαήλ (3ο δίστιχο)"], "body": [{"type": "p", "text": "Τούτον το τραούδιν ετραούδησεν μου το πρώτην φοράν ο Αντώνης Πουλλής, 83 χρονών, στο σπίτιν του στον προσφυγικόν συνοικισμόν του Αποστόλου Αντρέα στα Λατσ̆ιά. Επισκέφτηκα τον μιαν ημέραν για να του κάμω συνέντευξην για τον παπάν του, τον Τζ̆ιαννήν Πουλλή. Ο Τζ̆ιαννής ήταν ένας που τους πιο γνωστούς τραουδιστές τζ̆αι λαουτάρηες της Αγιάς Μαρίνας της Σ̆σ̆υλλούρας (περισσότερα για τον Τζ̆ιαννήν στην σ. [39]). Ο Αντώνης, επηρεασμένος που το οικογενειακόν του περιβάλλον, έμαθεν να τραουδά τζ̆αι να παίζει στο λαούτον τες μελωδίες τζ̆αι τα τραούθκια του χωρκού του. Έκαμνεν τζ̆αι τζ̆είνος, όπως τον παπάν του, γάμους στην Αγιάν Μαρίναν τζ̆αι στα διπλανά χωρκά."}, {"type": "p", "text": "Κατά την διάρκειαν της συνέντευξης, μετά που μου ετραούδησεν την Φωνήν την Μαρινιωτούν, είπεν μου: «Να σου πω τζ̆’ έναν της σούσας; Ετραουδούσαν το οι κορούες άμαν εκρεμμάζαν τες σούσες την Λαμπρήν». Εφαντάστηκα ότι θα μου ελάλεν το γνωστόν τραούδιν της σούσας («Θεέ μου να ’ρταν οι Λαμπρές»). Ετραούδησεν μου όμως τούτον το τραούδιν. Άμαν μου το ετραούδαν έκαμνεν τζ̆αι μιαν μικρήν παύσην στην πρότελευταίαν συλλαβήν του κάθε ημιστιχίου (π.χ. ρα-ΐ-ι-σει), που μου έκαμνεν εντύπωσην. Στην αρχήν ενόμισα ότι το έκαμνεν για να πάρει αναπνοήν. Όταν ετέλειωσεν, ερώτησα τον αν η παύση του ήταν επιτηδευμένη τζ̆αι κομμάτιν της ερμηνείας. Απάντησεν μου:"}, {"type": "p", "text": "Καλό! Εν’ όπως πάει η σούσα, γιε μου [όπως μου εμίλαν έσουζεν τα σ̆έρκα του δεξιά αριστερά, μιμούμενος την εκκρεμήν κίνησην της σούσας]. Άμαν έφταννεν τέλε̮ια πάνω, εσταμάταν λλίον πριν να πάει ξανά κάτω. Οι κορούες ήταν τέσσερις-τέσσερις πά’ στην σούσαν τζ̆αι για να μεινίσκουν στον ρυθμόν της σούσας άμαν ετραουδούσαν, εσταματούσαν λλίον  [εννοεί την παύσην]."}, {"type": "p", "text": "Έφυα που τζ̆ει̮αμαί τζ̆’ εσιγανοτραούδουν τούντο τραούδιν της σούσας του κυρίου Αντώνη. Μετά που λλίες ημέρες που επήα να τον ξαναδώ, ερώτησα τον αν έθελεν να ’ρτει να το γράψουμεν στο στούντιο. Εσυφφώνησεν τζ̆’ έτσι το πρώτον τζ̆αι το τελευταίον δίστιχον τραουδά το ο ίδιος. Όταν εσκέφτουμουν την σειράν των κομμαθκιών του δίσκου, εθεώρησα ότι η φωνή του κυρίου Αντώνη τζ̆αι το καλωσόρισμαν («Στο σπίτι που καθούμαστιν πέτρα να μεν ραΐσει τζ̆’ ο νοικοτζ̆ύρης του σπιθκιού σ̆ίλια γρόνια να ζήσει») πρέπει να εν’ η πρώτη φωνή που θ’ ακούσει κάποιος άμαν ακούσει τον δίσκο. Ο κύριος Αντώνης για μέναν εν’ η προσωποποίηση του χωμάτος: του βιωματικού μουσικού που πάνω του αθθεί τζ̆αι φκάλει ρίζες η επόμενη γενιά."}, {"type": "source", "text": "Συνέντευξη Αντώνη Πουλλή, 11 Νοεβρίου 2025"}]}, {"id": "song-2", "title": "Ο Σκλάβος", "credits": ["Μουσική: Παραδοσιακή· διασκευή Συμεών Μερκούρη", "Στίχοι: Παραδοσιακοί", "Φωνές: Συμεών Μερκούρης, Στέλιος Παπαμιχαήλ", "Λύρα: Στέλιος Παπαμιχαήλ", "Λαούτο: Συμεών Μερκούρης"], "body": [{"type": "p", "text": "«Ο Σκλάβος» είναι έναν αφηγηματικόν τραούδιν, που ετραούδησεν ο Λευτέρης Οικονόμου (Στέκκος) στον Τζ̆έιμς Νοτόπουλον το 1953 στο Παραλίμνιν. O Eλληνοαμερικανός Tζ̆έιμς Νοτόπουλος το 1952 εξεκίνησεν μιαν λαογραφικήν αποστολήν στην ηπειρωτικήν Ελλάδαν τζ̆αι τα νησ̆ιά της Νάξου, Κρήτης τζ̆αι Κύπρου. Στες 20 του Ιούνη του 1953 έκαμεν αρκετές επιτόπιες ηχογραφήσεις στο Παραλίμνιν, όπου, μεταξύ άλλων, εκατέγραψεν τζ̆αι τον Στέκκον να τραουδά τον «Σκλάβον»."}, {"type": "p", "text": "«Ο Σκλάβος» μιλά για την ιστορίαν ενός νιόπαντρου που εβρέθηκεν σκλάβος στα ξένα τζ̆αι δεν επρόλαβεν να χαρεί την νιόνυφφην του. Επιστρέφει μετά που δώδεκα χρόνια τζ̆αι, με την βοήθεια του πατέρα του (που εν τον αναγνωρίζει), μαθθαίννει ότι η αγαπητιτζ̆ιά του ετοιμάζεται να παντρευτεί άλλον άντραν. Ο πρωταγωνιστής όμως προλαββαίννει να σταματήσει τον γάμον, αφού η αγαπητιτζ̆ιά του ακούει που μακριά τζ̆αι αναγνωρίζει το χλιμίντρισμαν του αλόγου του. Η πλοκή εν’ παρόμοια με το τραούδιν «Ο Μωρόγιαννος» που ετραουθκίετουν την Δευτέραν του γάμου."}, {"type": "p", "text": "Ο Λευτέρης Οικονόμου Στέκκος εγεννήθηκεν στο Παραλίμνιν το 1915, γιος του Δημήτρη Οικονόμου (Στέκκου) τζ̆αι της Ελένης. Επαντρεύτηκεν την Δέσποιναν τζ̆αι έκαμε πέντε παιθκιά: την Ελένην, την Πουλχερίαν, τον Δημήτρην, τον Σολωμόν τζ̆αι τον Γιώργον. Ασχολείτουν με γεωργικές εργασίες στο περβόλιν τζ̆αι τα χωράφκια του στον Πρωταράν, στες περιοχές Βρύση τζ̆αι Λαξ̆ιά, τζ̆αι στο Βαρώσιν, στην περιοχήν Λάξη. Ήταν καλοφωνάρης τζ̆αι επιδίδετουν στα αφηγηματικά τζ̆αι στους μανέδες."}, {"type": "p", "text": "Ο γιος του Σολωμός, σε κουβένταν που εκάμαμεν μαζίν για τον παπάν του, θθυμάται τον στον εσπερινό της Παναγίας (14 Αυγούστου) να τραουδά στην εκκλησία του Αγίου Γεωργίου το μακροσκελές τραούδιν «Της Παναΐας του Τζ̆ύκκου». Θθυμάται τον έντονα να τραουδά τζ̆αι στες δουλειές, όταν έκαμνεν ζευκάριν τζ̆αι αλώνευκεν. Ο Λευτέρης είσ̆εν όμως έφεσην τζ̆αι στο τσ̆άττισμαν τζ̆αι τα αυτοσχέδια ερωτικά, σύμφωνα με τον γιον του. Κύριον του ταίριν στην τραουθκιάν ήταν ο Παύλος Πιττάτζ̆ης, που ήταν τζ̆αι κουμπάρος του (περισσότερα για τον Παύλο Πιττάτζ̆η στην σελ [15]). Λαλεί ο κύριος Σολωμός:"}, {"type": "p", "text": "Eμείς ήμαστεν κοπελλούθκια τζ̆’ εβουρούσαμεν τους ξοπίσω να τους δούμεν στους γάμους τζ̆αι στα παναΰρκα, στες καλύφες της Λαμπρής τζ̆αι το παναύριν τ’ Άη Γιωρκού του Σπόρου."}, {"type": "p", "text": "Μουσικοί που συχνά εσυνοδεύκαν τον Στέκκον στες διασκεδάσεις ήταν ο Γιώργος Κωστή Πογιατζ̆ής τζ̆αι ο Χριστάκης Πιττυρής στο φκιολίν, τζ̆αι ο Νικόλας Μουαΐμης (Μαΐμης), ο Δημοσθένης Ζανέττου (της Μουζούρας) τζ̆αι ο Λευτέρης Μέρτακκας (Λευτεράς) στο λαούτον."}, {"type": "p", "text": "Ο κύριος Σολωμός εδιηγήθηκεν μου το εξής κωμικόν πάλιωμαν του πατέρα του με τον Πιττάτζ̆η:"}, {"type": "p", "text": "Λαλεί του [Πιττάτζ̆η] ο τζ̆ύρης μου:"}, {"type": "verse", "lines": ["«Μες την δική μου την αυλήν", "γεναίκαν έχω ή πουλλίν", "έχω τα μερωμένα", "να φεύκω ’γιώ να μεν φευκεί [sic],", "τζ̆’ αν έρκουμαι που την αυκήν", "να ’ν’ έσσω μου ππεμένα»", "Πάντα ετοιμόλοος ο Πιττάτζ̆ης, απαντά του:", "«Τζ̆είν’ το δικόν σου το πουλλίν εννά ’ν’ χαντόν αλόπως", "για να τ’ αρέσκει το κλουβίν, η κλειωνιά τζ̆’ ο τόπος»", "O Στέκκος ήταν επίσης ικανότατος χορευτής."]}, {"type": "p", "text": "Το τραούδιν «Ο Σκλάβος», όπως το ετραούδησεν ο Στέκκος του Νοτόπουλου, είναι αφηγηματικόν, άρρυθμον τζ̆αι χωρίς όργανα. Η διασκευή μας περιέχει μιαν άρρυθμη εισαγωγή με φωνή τζ̆αι ίσον λύρας κοντά στο αφηγηματικό στυλ. Στη συνέχεια όμως εν σε ρυθμόν συρτού (2/4) με λαούτο τζ̆αι λύρα. Η μελωδία της φωνής (τζ̆αι της λύρας που την συνοδεύκει) εν παραλλαγμένην σε σχέση με την εκτέλεση του Στέκκου. Επροσπαθήσαμεν όμως να κρατήσουμεν κάποια στοιχεία που την ερμηνείαν του Στέκκου, όπως τα γλυτζ̆ιά μελίσματα της φωνής του, αφού ήταν η κύρια αναφορά μας. Εν θα έλεα όμως ότι τούτη η διασκευή μας εν σε αυστηρά κυπριακόν ύφος αλλά έσ̆ει μέσα στοιχεία που άλλες κοντινές σε μας νησ̆ιώτικες μουσικές παραδόσεις."}, {"type": "source", "text": "Συνέντευξη Σολωμού Οικονόμου, 6 Ιουνίου 2026"}]}, {"id": "song-3", "title": "Ο Διενής ψυχομασ̆εί", "credits": ["Στίχοι & Μουσική: Παραδοσιακό", "Φωνή: Συμεών Μερκούρης", "Λαούτο: Στέλιος Παπαμιχαήλ"], "body": [{"type": "p", "text": "Απόσπασμαν που το ακριτικόν τραούδιν «Ο Διενής τζ̆’ ο Χάρος», τραγουδισμένον στην Ποιητάρικην Φωνήν (περισσότερες πληροφορίες για τες Φωνές στην σ. [8]). Τα ακριτικά τραούθκια εν’ μια κατηγορία που τα μακροσκελή αφηγηματικά τραούθκια της Κύπρου, που ήταν αναπόσπαστον κομμάτιν της καθημερινότητας του Κυπραίου μέχρι περίπου το ’60. Γράφει ο Μιχάλης Ττερλικκάς:"}, {"type": "p", "text": "Υπήρχαν οι δραστηριότητες με τες οποίες όι μονον εταιρκάζαν [τα αφηγηματικά τραούθκια], μα ήταν τζ̆αι απαραίτητα για να περνά η ώρα τζ̆αι για να διούν ρυθμόν στην δουλειάν. Τέθκοιες δραστηριότητες ήταν οι δουλειές στα χωράφκια, στο αλώνιν, στο κουπάιν, η βούφα, οι μι̮άλες κρύες νύχτες του σ̆ειμώνα κοντά στην τσιμινιάν, χωρίς ράδιον, τηλεόρασην τζ̆αι διαδίκτυον."}, {"type": "p", "text": "Ο Διενής στην λαϊκήν παράδοσην παρουσιάζεται ως ένας θρυλικός ήρωας με υπερφυσικές δυνάμεις. Σύμφωνα με την φαντασίαν του λαού, ήταν τζ̆είνος που, όπως ετζ̆υνήαν Σαρατζ̆ηνούς, εκούμπησεν το σ̆έριν του πά’ στον βράχον τζ̆αι άφηκεν αποτύπωμαν τα πέντε του δάχτυλα στην κορυφήν. Έτσι έπιασεν το όνομαν της η οροσειρά του Πενταδαχτύλου. Τζ̆είνος ήταν τζ̆αι που επέταξεν την Πέτραν του Ρωμιού κατά των Σαρατζ̆ηνών πειρατών που εθέλαν ν’ αποβιβαστούν στην Κύπρον, για να τους καταστρέψει τα καράφκια τους. Τζ̆είνος ήταν επίσης που επολέμαν τον Χάρον στα μαρμαρένια αλώνια «τρεις νύχτες, τρεις ημέρες». Οι μέχρι τώρα ηχογραφήσεις (επιτόπιες τζ̆αι μη) τούντου αφηγηματικού τραουθκιού αφορούν την μάχην με τον Χάρον, όταν κατεβαίννει ο Χάρος στο παναΰριν τζ̆αι γυρεύκει «τον κάλλιον μας» να τον πολεμήσει τζ̆αι να τον πάρει. Το απόσπασμαν που εθκιάλεξα να τραουδήσω ακολουθεί χρονικά την μάχην του Διενή με τον Χάρον· εν’ η ώρα που ο ήρωας ψυχομασ̆εί."}, {"type": "p", "text": "Το κομμάτιν τούτον άρεσεν μου, γιατί δείχνει τα ανθρωπόμορφα χαρακτηριστικά του ήρωα. Ψυχομασ̆εί στο νεκροκρέβατον του, θέλει οι φίλοι του τζ̆αι οι γείτονες του να εν’ κοντά του τούντες δύσκολες ώρες, θέλει να πει τα αντραγαθήματα του στον κόσμο (την μάχην του με τον Σαρατζ̆ηνόν για παράδειγμαν) τζ̆αι να χτίσει την υστεροφημίαν του. Φυσικά, στο τέλος, εν αποφεύγει τον θάνατον. Ακόμα τζ̆αι ο Διενής, ο υπερήρωας της λαϊκής φαντασίας, εν ιμπορεί ν’ αλλάξει την μοίραν του. Διά μου κουράγιον τούτη η αποδόμηση της υπερφυσικής πτυχής του ήρωα, γι’ αυτόν τζ̆’ εθκιάλεξα το συγκεκριμένον απόσπασμαν του τραουθκιού. Αφού ο Διενής πεθανίσκει σαν ένας κοινός θνητός, άρα τζ̆’ εμείς οι κοινοί θνητοί μπορεί να κρύφκουμεν έναν «Διενήν» μέσα μας. Να έχουμεν την δυνατότηταν να πολεμούμεν στες δοκιμασίες της ζωής μας με «υπερφυσικές», δυνάμεις που μες την καθημερινότηταν μας ξηχάννουμεν ότι έχουμεν."}, {"type": "p", "text": "Στο τραγούδιν όπως το ηχογραφήσαμε χρησιμοποιούνται έξι παραλλαγές της μελωδίας της Ποιτάρικης Φωνής. Το λαούτο κάποτε ακολουθά μελωδικά την φωνή, κάποτε λειτουργά ως ίσον τζ̆αι κάποτε ‘σχολιάζει’ αυτοσχεδιαστικά."}, {"type": "source", "text": "«Παραδοσιακή Μουσική της Κύπρου: Δημιουργία, Διάσωση, Διάδοση, Επανένταξη» (Ιούνιος 2021), Μιχάλης Ττερλικκάς https://mousalyra.com.cy/wp-content/uploads/2023/03/%CE%A0%CE%B1%CF%81%CE%B1%CE%B4%CE%BF%CF%83%CE%B9%CE%B1%CE%BA%CE%AE-%CE%9C%CE%BF%CF%85%CF%83%CE%B9%CE%BA%CE%AE-%CF%84%CE%B7%CF%82-%CE%9A%CF%8D%CF%80%CF%81%CE%BF%CF%85.pdf"}]}, {"id": "song-4", "title": "Φωνή Καταραμένη", "credits": ["Στίχοι & Μουσική: Παραδοσιακό", "Φωνές: Συμεών Μερκούρης (2ο και 4ο δίστιχο), Στέλιος Παπαμιχαήλ (1ο, 3ο και 5ο δίστιχο)", "Λαούτο: Συμεών Μερκούρης", "Λύρα: Στέλιος Παπαμιχαήλ", "Ταμπουτσ̆ά: Κωνσταντίνα Ξενοφώντος"], "body": [{"type": "p", "text": "Η «Φωνή Καταραμένη» εν’ μια που τες φωνές της Κύπρου. «Φωνές» στην κυπριακήν παραδοσιακήν μουσικήν ονομάζουμεν πλέον συγκεκριμένες μελωδίες, πάνω στες οποίες τραουθκιούνται δίστιχα ή ολιγόστιχα. Ο στίχος τους, δηλαδή, υποτάσσεται στην υπάρχουσαν μελωδίαν. Η «Φωνή Καταραμένη» εν’ φωνή της επαρχίας Πάφου, που ηχογραφήθηκεν ανά διαστήματα με διαφορετικές ονομασίες. Ηχογραφήθηκεν που την λαογραφικήν αποστολήν της Ακαδημίας Αθηνών υπό τους Σπυριδάκη και Καρακάση το 1960 σε επιτόπιαν ηχογράφησην στην Γιόλου ως «Φωνή Γιολίτισσα». Μουσικήν επαίζαν οι Αργύρης Σάββα (φκιολίν) τζ̆αι Κυριάκος Παρπέρης ή Βάκανος (λαούτον), τζ̆αι ετραγουδούσαν οι Δημήτρης Φεττάς, Χαράλαμπος Παναγιώτου τζ̆αι Νεόφυτος Χατζ̆ηνικηφόρου. Ακολούθησεν η επιτόπια μουσική αποστολή του Πελοποννησιακού Λαογραφικού Ιδρύματος (1978-85) («ΠΛΙ») υπό τον Φοίβον Ανωγειανάκην, που την εκατέγραψεν με τον τίτλον «Ερωτικά» στο Νιον Χωρκόν. Μουσικοί τότε ήταν οι Χαμπής Θεωρή (φωνή τζ̆αι ταμπουτσ̆ιά) που το Νιο Χωρκό Πόλης  τζ̆αι Χαμπής Λαζάρου που την Γιόλου (μετέπειτα κάτοικος Νιου Χωρκού· φκιολίν). Ο Χρήστος Σίκκης εσυμπεριέλαβεν την το 1998 ως «Φωνήν Πόλης Χρυσοχούς» στην συλλογήν Έλληνες Ακρίτες – Κύπρος (1998). Το 2008 ο Μιχάλης Ττερλικκάς εκατέγραψεν την στην δισκογραφικήν του δουλειάν Κυπραία Φωνή – Καλώς ήρταν οι ξένοι μας, με τον τίτλον «Φωνή Καταραμένη»."}, {"type": "p", "text": "Όσον αφορά την ονομασίαν τούντης φωνής, ο Μιχάλης Ττερλικκάς είπεν μου τα εξής:"}, {"type": "p", "text": "Η μαρτυρία που εσφράγισεν για μέναν το θέμαν της ονομασίας ένι άμαν επήαμεν με τον Πανίκκον τον Χρυσάνθου στην Κινούσαν να έβρουμεν έναν γέρον – τον Ματθαίον Παπαχριστοδούλου που ήταν ψάλτης – που ετραούδαν τούντην φωνήν. Έκαμα του συνέντευξη τζ̆αι ήρτεν η ώρα να τραουδήσουμε. Λαλεί μου, «Ό,τι πεις εσού». «Όι, ολάν, εσού να τραουδήσεις», λαλώ του. Λαλεί μου, «Να σου πω μιαν Καταραμένην»; Τούτη εν’ η μαρτυρία η κάθετη που εν επιδέχεται αμφισβήτησης. Κανένας εν του εσυνάφερεν ονομασίαν. Μόνος του. Τζ̆αι ετραούδησεν μου την. To ερώτημαν μετά εγίνηκεν: «Γιατί Καταραμένη;» Μέχρι που ετραούδησεν μας ο Νεόφυτος Κωσταντίνου [Αργυρού] που την Λετύμπου το 2015 – ο οποίος ήταν χορευτής τζ̆αι φκιολάρης – το εξής δίστιχον: «Τα κόκκαλα μου να γενούν κανιά σαν την ανέμην, εν παραιτώ που λλόου σου, ωρή καταραμένη». Ένας που τους τρόπους που επαίρναν τα ονόματα τους οι φωνές ήταν τζ̆αι ένας χαρακτηριστικός στίχος."}, {"type": "p", "text": "Οι στίχοι του 1ου, 2ου τζ̆αι 3ου  δίστιχου που ηχογραφήσαμεν εν’ παραδοσιακοί, που μιαν ηχογράφησην του Κέντρου Επιστημονικών Ερευνών στες αρχές της δεκαετίας του ’60, που εκφωνεί ο Κώστας Ιωαννίδης τζ̆αι τραουδά ο Αγάπιος Ζάκας που την Πέγειαν. Το 4ον δίστιχον ετραούδησεν το ο Χαμπής Θεωρή στον Μιχάλην Ττερλικκάν (με βάση μαρτυρίαν του ίδιου) τζ̆αι το 5ον δίστιχον εν’ τζ̆είνον που είπεν ο Νεόφυτος Κ Αργυρού που την Λετύμπου, που λύει τζ̆αι το μυστήριον της ονομασίας της φωνής. Όσον αφορά την μουσική, αναφορά μας ήταν οι μελωδικές γραμμές του φκιολάρη Χαμπή Λαζάρου που την ηχογράφηση του ΠΛΙ. Ενορχηστρωτικά, εθκιαλέξα την λύρα αντί το φκιολί γιατί διά στο αυτίν μου μιαν πιο ‘γειωμένη’ μελωδική υφή που πιστέφκω εταίρκασε σε τούντην Φωνήν. Κυριώς επειδή οι φωνές τραουδούν ‘φωναχτά’ τζιαι με ένταση τζ̆αι η λύρα έρκεται στα ενδιάμεσα να γλυκάνει το όλον."}, {"type": "source", "text": "«Oι Κυπριακές Φωνές μέσα στην πορείαν του χρόνου», Μιχάλης Ττερλικκάς https://mousalyra.com.cy/wp-content/uploads/2024/09/%CE%9F%CE%B9-%CE%9A%CF%85%CF%80%CF%81%CE%B9%CE%B1%CE%BA%CE%AD%CF%82-%CE%A6%CF%89%CE%BD%CE%AD%CF%82-%CE%BC%CE%AD%CF%83%CE%B1-%CF%83%CF%84%CE%B7%CE%BD-%CF%80%CE%BF%CF%81%CE%B5%CE%AF%CE%B1%CE%BD-%CF%84%CE%BF%CF%85-%CF%87%CF%81%CF%8C%CE%BD%CE%BF%CF%85.pdf"}, {"type": "source", "text": "Συνέντευξη Μιχάλη Ττερλικκά, 1 Απριλίου 2026"}]}, {"id": "song-5", "title": "Μανές Μπάλος Πρώτος", "credits": ["Στίχοι & Μουσική: Παραδοσιακό", "Φωνή: Συμεών Μερκούρης", "Βιολί: Παύλος Μιχαηλίδης", "Λαούτο: Στέλιος Παπαμιχαήλ"], "body": [{"type": "p", "text": "Ο όρος «μπάλος» στην Ελλάδα συνήθως χρησιμοποιείται για να περιγράψει μικτούς χορούς (άντρας με γυναίκα), σε ρυθμό 2/4. Στην Κύπρον, όμως, ο «μπάλος» είναι τραούδιν, όι χορός που υπάρχει σε θκυο παραλλαγές (πρώτος τζ̆αι δεύτερος). Ο μπάλος μπαίννει μετά τον 4ον καρτζ̆ιλαμάν· λέγεται μάλιστα τζ̆αι 5ος καρτζ̆ιλαμάς (ή αντικρυστός). Είναι σε δρόμον ραστ τζ̆αι έσ̆ει παρόμοιες μελωδικές φράσεις με τον κυκλαδίτικον μπάλον, αλλά σε ρυθμόν 7/8. Παλιά το ζευκάριν εχόρευκεν όσον έπαιζεν το φκιολίν την μελωδίαν. Άμαν ετέλειωννεν η μελωδία, οι χορευτές εσταματούσαν τον χορόν τζ̆αι ένας – ή τζ̆αι οι θκυο, αν ήταν ικανοί – ετραουδούσαν που έναν δίστιχον μακρόσυρτον, τύπου αμανέ. Αν οι χορευτές εν ετραουδούσαν, οι μουσικοί αντικαθιστούσαν τον μπάλον με άλλον τραούδιν ή με έρρυθμον τταξίμιν που έπαιζεν το φκιολίν. Στες μέρες μας σπάνια τραουθκιέται μπάλος μετά που τους καρτζ̆ιλαμάες."}, {"type": "p", "text": "Οι κυπριακοί μπάλοι έχουν μια όμορφην παραδοξότηταν: μια ιδιαίτερα εύθυμην μελωδίαν στο φκιολίν τζ̆αι «ππηδηχτήν» ρυθμικήν αγωγήν, με έναν δίστιχον με συνήθως μελαγχολικόν ερωτικόν ή απαισιόδοξον φιλοσοφικόν ή υπαρξιακόν νόημαν, τζ̆αι την αργήν, μακρόσυρτην, παραπονιάρικην φωνητικήν ερμηνείαν του μανετζ̆ή. Στα φκια μου εν’ ένας μουσικός κλαυσίγελος."}, {"type": "p", "text": "Αναφορά μου για τούτον το κομμάτιν στην φωνήν εν’ η ερμηνεία του Κυριάκου Χριστοφή Λοφίτη, όπως ηχογραφήθηκεν που το ΡΙΚ το 1964, με τους μουσικούς Κώσταν Παπαδόπουλλον (φκιολίν) τζ̆αι Βάσον Πισσούριον (λαούτον). Την σειρά που επαρουσιάσαμε τα μελωδικά θέματα αποφασίσαμεν την που κοινού με τον Παύλο που παίζει φκιολίν σε τούντο κομμάτι."}, {"type": "source", "text": "Γεώργιος Αβέρωφ, Tα δημοτικά τραγούδια και οι λαϊκοί χοροί της Κύπρου (1989)"}]}, {"id": "song-6", "title": "Τα στεφανώματα (Συρτός Παφίτικος)", "credits": ["Μουσική: Παραδοσιακή· διασκευή Συμεών Μερκούρη", "Στίχοι: Παραδοσιακοί· σύμφωνα με την ερμηνεία των Αντώνης Χατζηαχιλλέως (1η και 2η στροφή), Ξενή Πάτσαλου (3η στροφή), Παύλου Πιττάτζ̆η (4η στροφή)", "Φωνή: Στέλιος Παπαμιχαήλ", "Δεύτερες φωνές: Συμεών Μερκούρης, Παύλος Μιχαηλίδης", "Βιολί: Παύλος Μιχαηλίδης", "Λαούτα: Χαράλαμπος Παντελή, Συμεών Μερκούρης"], "body": [{"type": "p", "text": "Ο Θεόδουλος Καλλίνικος εκατέγραψεν στο βιβλίον του Κυπριακή λαϊκή μούσα (1951) τούντο τραούδιν σε βυζαντινήν παρασημαντικήν τζ̆αι δυτικήν μουσικήν σημειογραφίαν, με τον τίτλον «Συρτός Παφίτικος», όπως το άκουσεν το 1935 που τον φκιολάρην Αντώνην Χατζ̆ηαχιλλέως (περισσότερα για τον Καλλίνικον στην σ. [19]). Παρόλον που εν ηχογραφήθηκεν ποττέ, τουλάχιστον εξ όσων γνωρίζω, θεωρώ ότι εν’ έναν θκιαμάντιν της κυπριακής μουσικής. Εχρησιμοποίησα ως βάσην τες μελωδικές γραμμές όπως τες έγραψεν ο Καλλίνικος, αλλά, με την μέθοδον του περιορισμένου αυτοσχεδιασμού, εδιασκεύασα το ελαφρώς όπως  έκαμνεν νόημαν στον δικόν μου νουν. Στους στίχους επρόσθεσα, σε τζ̆είνα που εκατέγραψεν ο Καλλίνικος, θκυο πολλά αγαπημένα ολιγόστιχα στην ίδιαν θεματικήν ενότηταν: του παράφορου πάθους που γεννά παραφροσύνην, όταν χαρτώννουν την αγαπημένην του ποιητή με κάποιον τρίτον."}, {"type": "heading", "text": "Αντώνης Χατζηαχιλλέως"}, {"type": "p", "text": "Η πρώτη τζ̆αι δεύτερη στροφή εν’ οι στίχοι που εκατέγραψεν ο Καλλίνικος που τον Αντώνην Χατζ̆ηαχιλλέως, που ήταν ευρύτερα γνωστός με το παρατσούκλιν «Βλόκκος». Ο Βλόκκος εγεννήθηκεν στην Χλώρακαν το 1907. Ήταν παιδίν πολυμελούς αγροτικής οικογένειας με οχτώ αδέρφκια. Πατέρας του ήταν ο Αχιλλέας τζ̆αι μητέρα του η Παναγιώτα (Παναγιωτού). Επαντρεύτηκεν την Ελένην Πιστέντη το 1927 τζ̆αι έκαμεν εφτά παιθκιά: τέσσερις κόρες τζ̆αι τρεις γιούες. Ένας εξ αυτών ήταν ο επίσης γνωστός φκιολάρης Νικόλας Αντωνίου Βιολάρης. Ο Βλόκκος επήεν σχολείον μέχρι την δευτέραν τάξην του δημοτικού τζ̆αι μετά εδούλευκεν ως χτίστης τζ̆αι μετέπειτα εργολάβος. Στις αρχές του 1960 άννοιξεν τζ̆αι καφενέν για να ενισχύσει τα οικονομικά του τζ̆αι να μεγαλώσει την οικογένειαν του. Φυσικά ήταν τζ̆αι φκιολάρης, που τους πιο γνωστούς της Πάφου την τότε εποχήν. Σύμφωνα με τον γιον του, τον 87χρονον Αντρέαν, επίσης μουσικόν (ντραμς), δάσκαλος του Bλόκκου ήταν ο φκιολάρης Θεόδωρος Δαυίδ, στον οποίον εμαθήτευσεν ενάμιση χρόνον.[^2] Όπως μου είπε ο κύριος Αντρέας, παρότι «πραχτικός», δηλαδή χωρίς τυπικήν μουσικήν εκπαίδευσην:"}, {"type": "p", "text": "Eπάντρεψεν χωρίς υπερβολήν την μισήν Πάφον. O αρφός μου [ο Νικόλας] εσπούδασεν μουσικήν,[^3] τζ̆αι παρότι πολλά καλός, εν είσ̆εν την γλυκάδαν του πατήματος του παπά μου."}, {"type": "p", "text": "Ο κύριος Αντρέας, ως βοηθός του παπά του, θθυμάται τον καφενέν να μετατρέπεται σε ωδείον μεταξύ παραγγελιών:"}, {"type": "p", "text": "Τζ̆ει̮αμαί που ήταν το ουτζ̆άκκιν[^4] – όι με άμμον όμως α, με ξύλα – αφταίνναμεν κάρβουνα τζ̆αι τζ̆ει̮αμαί εψήνναμεν τον καφέν. Είσ̆εν τρεις-τέσσερις μιτσ̆ιούς που την Τζ̆ισόνερκαν τζ̆’ εμάθθαιννεν τους ο τζ̆ύρης μου φκιολίν. Έπαιρνεν τζ̆’ έφερνεν τους καφέδες τζ̆αι στα ενδιάμεσα έδειχνεν τους μαθητές του."}, {"type": "p", "text": "Σύμφωνα με τον κύριον Αντρέαν, ο καφενές του Βλόκκου ήταν τζ̆αι το μέρος όπου συχνά εγίνουνταν διασκεδάσεις:"}, {"type": "p", "text": "Mες τες Σήκωσες εκάλιεν τον θείον μου τον Χριστόδουλον, τον «Πάφιον» [αδερφός του Βλόκκου τζ̆αι γνωστός καραγκιοζοπαίχτης], που ήταν φωνάρα. Έπαιζεν ο πατέρας μου φκιολίν τζ̆αι ετραούδαν τζ̆αι ο άλλος μου ο θείος ο Χαμπής, που εκάθετουν στην Έμπαν […] τζ̆αι έρκετουν ούλλη η Χλώρακα μασκαρεμένη στον καφενέν να διασκεδάσει."}, {"type": "p", "text": "Ο κύριος Αντρέας, σαν μαθητής του δημοτικού τότε, θθυμάται τζ̆αι το παναΰριν του Χτημάτου» (την γιορτήν του Προφήτη Ηλία), που εγίνετουν σύνορα Χλώρακας τζ̆αι Κτήματος. Εστήνναν καλύφην τζ̆αι έπαιζεν ο Βλόκκος, με λαουτάρην τον Χριστάκην που την Άρμου (γνωστός ως «Ρουσσής» ή «Διπλόσ̆ειλος») τζ̆αι με παρόντες ποιητάρηες όπως τον Χαράλαμπον Άζινον, από τους γνωστότερους της Κύπρου τότε, τζ̆αι τον λεγόμενον «Κλειωμένον». Έπαιρνεν τους, όπως εσυνηθίζετουν τότε, τζ̆είνος που έκαμνεν την καλύφην στο παναΰριν."}, {"type": "p", "text": "Άλλος λαουτάρης που έπαιζεν με τον Βλόκκον ήταν ο Αντρέας Νεοφύτου («Κουτσός») που την Κάτω Πάφον. Περιγράφει μου ο κύριος Αντρέας τζ̆αι έναν όμορφον περιστατικόν που έναν γάμον που έκαμεν ο πατέρας του με τον Κουτσόν:"}, {"type": "p", "text": "Eπαντρεύκετουν κάποιος Μιχαλάκης Ομήρου στο χωρκόν μας, γύρω στο ’45. Ήμασταν μωρά με τον αδερφόν μου. Τζ̆αι πάντα επηαίνναμεν τζ̆’ εκαθούμασταν μπροστά  που τον πατέραν μας πο’ ’καμνεν τον γάμον. Τούτος [ο Μιχαλάκης] επαντρεύτηκεν μιαν Ειρηνούλλαν που την Χίον. Εκάμαν τότες στάσην τούτοι στην Κύπρον τζ̆αι που δαμαί να παν Ελλάδαν τζ̆αι ο Μιχαλάκης ερωτεύτην την Ειρηνούλλαν. Ο λαουτάρης ο Αντρέας, όμως, στον γάμον ερωτεύτηκεν μιαν εξαδέρφην της τούτης της Ειρηνούλλας, τζ̆’ ετσ̆άττισεν τούτης της κοπέλας της Κωσταντίαςτην ώραν που εχόρευκεν τζ̆αι λαλεί της:"}, {"type": "verse", "lines": ["«Έναν σεντούτζ̆ιν κάρενον ροδόσταμμαν γεμάτον", "Να σου το λούσω να λουθείς, κορμίν κωσταντινάτον»[^7]"]}, {"type": "source", "text": "Συνέντευξη Αντρέα Χατζ̆ηχιλλέως, 25 Μαΐου 2026"}, {"type": "source", "text": "Νικολέττα Δημητρίου, Ο Κύπριος βιολάρης: Η προφορική ιστορία μιας επαγγελματικής τάξης στον εικοστό αιώνα (2022)"}, {"type": "heading", "text": "Ξενής Πιερέττη (Πάτσαλος)"}, {"type": "p", "text": "Η τέταρτη στροφή εν’ του Ξενή Πιερέττη (Πάτσαλου). Ο Πάτσαλος (1901-84) ήταν ποιητής τζ̆αι τραουδιστής[^8] που το Παραλίμνιν. Εν επήεν καθόλου σχολείον. Που μιτσής ασχολείτουν με γεωργικές εργασίες τζ̆’ έκαμεν τζ̆αι βοσκός. Το «Πάτσαλος» εν’ παρατσούκλιν που εκληρονόμησεν που τον πατέραν του Αντρέαν, επειδή είσ̆εν σημάθκια («πατσάλια») πάνω στο πρόσωπον του. Έτσι έμεινεν του: o Ξενής του Πάτσαλου. Εξεκίνησεν να τραουδά ερωτικά τζ̆αι να τσ̆αττίζει που νεαρήν ηλικίαν σε τραπέζ̆ια, παναΰρκα τζ̆αι ζιαφέθκια, αλλά τζ̆αι στους ποιητικούς διαγωνισμούς του Κατακλυσμού στο Βαρώσιν τζ̆αι την Λάρνακαν."}, {"type": "p", "text": "Το 1978 εξέδωσεν την μοναδικήν του ποιητικήν συλλογήν, με τίτλον Ποιήματα."}, {"type": "p", "text": "Ο Κυριάκος Χατζ̆ηανδρέου (δισέγγονον του Πάτσαλου) είπεν μου μια πολλά συγκινητικήν ιστορίαν με πρωταγωνιστήν τον Πάτσαλον, που του είπεν η 93χρονη Δέσποινα Σάρδαλου («Τσ̆ιακκού») που το Παραλίμνιν. Το περιστατικόν εδιαδραματίστηκεν μπροστά που το σπίτιν της Τσ̆ιακκούς τζ̆αι ήταν η ίδια αυτόπτης μάρτυρας. Ο Ξενής έχασεν την μεγάλην του κόρην, την Μυροφόραν, σε νεαρήν ηλικίαν τζ̆αι σε έναν συναπάντημαν με τον Χρίστον Τσίσ̆σ̆ιον (άλλον τραουδιστήν του Παραλιμνιού) «ενικαλιστήκαν την», είπαν δηλαδή αυτοσχέδια δίστιχα με χαραχτήραν μοιρολογιού, με αφορμήν τον θάνατον της. Λαλεί η Τσ̆ιακκού:"}, {"type": "p", "text": "Ήταν Σήκωση, γιε μου, που σηκώννουσιν το κρέας. Την Σήκωσην του κρέατος εθάψαν την Μυροφόραν. Την Τυρινήν εκάμαν το μνημόσυνον, εις τες εννιά. Στες εννιά που ’κάμαν το μνημόσυνον, εγιώ εσάριζα δαχαμαί [μπροστά που το σπίτιν της]. Η Μαλαματού [η γεναίκα του Ξενή] τζ̆’ ο Ξενής επήραν το μνημόσυνον εις το μνήμαν να μνημονέψουν [η στράτα προς το κοιμητήριον του Άη-Θωμά έρεσσεν μπροστά που το σπίτιν της Τσ̆ιακκούς] […] Έρκετουν  ο Χρίστος του Τσ̆ίσ̆σ̆ιου που την άλλην στράταν […]. Είδεν τον Ξενήν που ’ρκετουν που τζ̆εικάτω με την μαντιλιάν την μαύρην τζ̆αι με το πανέριν. Τζ̆’ η Μαλαματού εκράτεν τον που το σ̆έριν τζ̆’ ενικαλιούνταν."}, {"type": "p", "text": "Λαλεί μου [ο Τσ̆ίσ̆σ̆ιος], «Ίντα ’παθεν ο Ξενής του Πάτσαλου;»."}, {"type": "p", "text": "Λαλώ του, «Eπέθανεν η κόρη του την περασμένην Κυριακήν τζ̆’ εν’ το μνημόσυνον της σήμμερα»."}, {"type": "p", "text": "«H κόρη του;! Ποια;»"}, {"type": "p", "text": "«Η κόρη του η μι̮άλη», λαλώ του."}, {"type": "p", "text": "«H μιάλη;» λαλεί μου, τζ̆’ εσηκώστην ίσ̆ια πάνω ο άθρωπος."}, {"type": "p", "text": "Ε, ο Τσ̆ίσ̆σ̆ιος [ήταν] εις του Λάξη,[^9] ίντα ’ξερεν ίνταμπου ’γίνηκεν. Έφτασεν τζ̆ει̮αμαί κοντά τους, τζ̆’ έκλαιεν ο Ξενής τζ̆αι λαλεί :"}, {"type": "verse", "lines": ["«Ψηλώνω πάνω τζ̆αι χωρώ τζ̆αι λούννουμαι το κλάμαν", "όπως εμέναν Σήκωσες πλάσματα εν εκάμαν»", "Επολοήθην ο Τσ̆ίσ̆σ̆ιος τζ’ αγκάλιασεν τον  τζ̆αι λαλεί του:", "«Να μεν έχεις παράπονον, άσπρη μου περιστέρα[^10]", "τζ̆αι που ’ν ήρτα στους γάμους σου[^11] σημάιν εν το ’ξέρα»", "Λαλεί του τζ̆’ ο Ξένης:", "«Κανέναν εν τζ̆’ εκάλεσα, όσοι το ’κούσαν ήρταν", "τζ̆’ ήρτεν  κκισμέττιν[^12] για να φας που την δικήν της πίττα»[^13]", "Μπαίννω έσσω, εβάωσα τες πόρτες τζ̆αι τα παραθύρκα! Να μεν ’κούσω τίποτε άλλον! Είχεν να πεθάνω! Έκαμα θκυο μέρες τζ̆αι με έτρωα με έπιννα. Τέθκοιαν συγκίνησην! Είμαι τόση γεναίκα εν εία ρε κοπελλούθκια. Εν εία!»"]}, {"type": "source", "text": "Συνέντευξη Κυριάκου Χατζ̆ηνδρέου, 16 Ιουνίου 2025"}, {"type": "source", "text": "Συνέντευξη «Δέσποινα Σάρδαλου – Γυναίκα Πηγή Παράδοσης», Ρίζες της Κύπρου https://www.youtube.com/watch?v=8cDTMrHpr1M"}, {"type": "source", "text": "Κωσταντίνος Γ. Γιαγκουλλής, Οι ποιητάρηδες της Κύπρου. Προλεγόμενα – Βιο-εργογραφία (1878–σήμερα) (2005)"}, {"type": "heading", "text": "Παύλος Πιττάτζ̆ης"}, {"type": "p", "text": "Η τρίτη στροφή εν’ του επίσης Παραλιμνίτη Παύλου Πιττάτζ̆η. Ο Πιττάτζ̆ης εγεννήθηκεν στο Παραλίμνιν στες 28 του Μάρτη του 1926, σε πολλά φτωσ̆ήν πολυμελήν οικογένειαν με εφτά αδέρφκια. Ο πατέρας του, Μιχάλης Πιττάτζ̆ης, επέθανεν γλήορα τζ̆αι η μάνα του, η Μαρία Στρατή («Πιττακού»), έφκαλλεν μαζ̆ιά που εκάμναν τες σαρκές τζ̆’ επούλαν τες στο Βαρώσιν στο παντοπουλείον για να τους αναγιώσει. Ο Πιττάτζ̆ης επήεν σχολείον ως την τρίτην τάξην. Eφκάλαν τον, όμως, γιατί ήταν φτωσ̆ή οικογένεια τζ̆αι έπρεπεν να δουλέψει. Εννιά χρονών έγινεν περβολάρης τζ̆’ εβοηθούσεν την οικογένειαν. Στα 22 του έγινε τουρκόπουλλος[^14] τζ̆αι το 1961 έπιαεν δουλειά ως λιμενεργάτης στο λιμάνιν του Βαρωσ̆ιού. Σύμφωνα με την κόρην του Ελένην, με την οποίαν εκάμαμεν μιαν κουβένταν για τον πατέραν της, ως τραουδιστής ο Πιττάτζ̆ης επηρεάστηκεν που τον τζ̆ύρην του, που ετραούδαν τζ̆αι τζ̆είνος. Ο Πιττάτζ̆ης εδιαγωνίζετουν τζ̆αι σε ποιητικούς διαγωνισμούς, στο Βαρώσιν, στον Κατακλυσμόν, με διακρίσεις στο τσ̆άττισμαν αλλά τζ̆αι στα ερωτικά.  Ήταν επίσης ικανός χορευτής. Η κόρη του Ελένη περιγράφει τον ως γλεντζ̆έν, εύθυμον τζ̆αι «άθρωπον του κόσμου». Λαλεί η ίδια:"}, {"type": "p", "text": "Ο Πιερέττης, ο Ττάκκας, ο Κούβαρος τζ̆αι ο Πριγκόπουλλος [γνωστοίτραουδιστές των Κοτσ̆ινοχωρκών· βλ. σ. [●]] ερκούνταν συχνά στο Παραλίμνιν. Εβρέθουνταν στους καφενέδες με τον πατέραν μου: o καφενές του Πυλιώτη, ο Οδυσσέας, ο καφενές του Παλιομούχταρου. Άσιλα Παραλιμνίτες ήταν ο Πάτσαλος τζ̆αι ο Τσ̆ίσ̆σ̆ιος. Εκάμναμεν το παναΰριν την Λαμπρήν, την ημέραν του Πάσχα. Εστήνναν καλύφες τζ̆αι εκάμναν φαγιά τζ̆αι εδιασκεδάζαν. Φκιολάρηες αθθυμούμαι τον Γιώρκον του Κωστή [Πογιατζ̆ή] τζ̆αι τον Λευτεράν [Λευτέρης Μέρτακκας· λαουτάρης]. Τζ̆’ εσμίασιν ούλλοι. Τζ̆’ αθθυμούμαι επαίρνασιν απού κόψει αγγουράκια, να δείξουν ποιος περβολάρης έκοψεν αγγουράκιν του χωραφκιού. Εχόρευκεν επίσης πολλά. Είσ̆εν δαμαί έναν καφενέν του Πυλιώτη. Εγώ μιτσ̆ιά εποσ̆σ̆έπαζα που το παραθύριν. Μιαν ημέραν  έφκηκεν να χορέψει τζ̆’ άκκασε τζ̆’ εσήκωσεν με τα δόνγκια του έναν τραπέζιν τετράγωνον, γεμάτον με τα κονιάκκια τους τζ̆αι τα φαγιά που ετρώασιν, τζ̆’ όπως ήταν εχόρευκεν το τραπέζι συρτόν!"}, {"type": "p", "text": "Ο Πιττάτζ̆ης εγνώρισεν τον Σεφέρην όταν επισκεφτηκεν την Κύπρον το 1954, σ’ έναν τραπέζιν που έγινεν στο οικογενειακόν κέντρο του Κυριάκου Παραλιμνίτη, όπου εχόρεψεν τζ̆’ ετραούδησεν με την αρφήν του την Κασσιανήν. Φκιολάρης ήταν ο Αντώνης Κίκας τζ̆αι λαουτάρης ο Μιχαήλ Χαμάλης. Ο Σεφέρης γράφει στες σημειώσεις του για τον Πιττάτζ̆η:"}, {"type": "p", "text": "Eρωτικά τραγούδια. Ε ε!... (προανάκρουσμα). Ο νέος ποιητάρης και χορευτής (τουρκόπουλος) [εννοεί τον Πιττάτζ̆η]. Εντύπωση. Ποίηση με μουσική υπόκρουση… Έτσι φαντάζομαι τον Ρωτόκριτο…[^15]"}, {"type": "source", "text": "Συνέντευξη Ελένης Πιττάτζ̆η, 24 Σεπτεμβρίου 2025"}, {"type": "source", "text": "Παύλος Πιττάκης, Ποιήματα (2014)"}]}, {"id": "song-7", "title": "Καρπασιτού του Τζ̆ιαννή (Φωνή Κωμήτισσα)", "credits": ["Στίχοι & Μουσική: Παραδοσιακό", "Φωνή: Συμεών Μερκούρης", "Δεύτερες φωνές: Στέλιος Παπαμιχαήλ, Χαράλαμπος Παντελή", "Ταμπουράς: Χαράλαμπος Παντελή"], "body": [{"type": "p", "text": "Ο Μιχάλης Ττερλικκάς, στον δίσκον του Κυπραία Φωνή – Στ’ αγνάρκα των τζ̆αιρών (2002), ηχογράφησεν τούντην φωνήν ως «Φωνή Κωμήτισσα». Εκάμαμεν μιαν κουβέντα με τον Αντώνην Πουλλήν που την Αγιάν Μαρίναν της Σ̆σ̆υλλούρας, γιον του Τζ̆ιαννή Πουλλή (περισσότερες πληροφορίες για τον Τζ̆ιαννήν στην σ. [39]), στο σπίτιν του.. Άμαν είπαμεν τες κουβέντες μας, εξεκίνησεν να τραουδά. Μετά που μου ετραούδησεν την «Φωνήν την Μαρινιωτούν» (βλ. σ. [●]), ερώτησεν με αν θέλω να μου πει τζ̆αι μιαν «Καρπασιτούν». Επαραξένεψεν με, γιατί η φωνή που μου ετραούδησεν εν ήταν η γνωστή «Καρπασίτισσα Φωνή» όπως την ήξερα, αλλά η «Κωμήτισσα», όπως την έγραψεν ο Ττερλικκάς στον δίσκο, του. Μιλώντας για τούτον με τον κύριον Μιχάλην, είπεν μου ότι εσυνάντησεν παρόμοιαν σύγχυσην όταν εκάμνεν ο ίδιος συνέντευξην του Τζ̆ιαννή:"}, {"type": "p", "text": "Έτσι μου την είπε τζ̆’ εμέναν ο γέρος. Τζ̆’ εγώ, επειδή είμαι που την περιοχήν [Καπούτιν του Μόρφου] […] υπέθεσα ότι έρκετουν που το χωρκόν Καρπάσ̆ια, που ήταν δίπλα που την Αγιάν Μαρίναν. Τυχαία μιαν ημέραν με τον Μιχαλάκην Ηλία – γιον του Νίκου Ηλία, φκιολάρη που την Κώμαν του Γιαλού – εκάμναμεν πρόβαν δαμαί τζ̆’ έπαιξεν μου μιαν μελωδίαν τζ̆’ επαρέπεμψεν με στην Καρπασίτιτζ̆ην που μου είπεν ο Τζ̆ιαννής. Είπεν μου επαίζαν την εις το χωρκόν του. Ήβρα μες το βιβλίον του Σώζου του Τομπόλη[^16] την «Φωνήν Κωμήτισσαν», τζ̆’ έμοιαζεν πολλά με την φωνήν του Τζ̆ιαννή. Με κάποιον τρόπον είσ̆εν δίκαιον δηλαδή [ο Τζ̆ιαννής], διότι εν’ μια φωνή που το Καρπάσιν. Τωρά πώς και γιατί στην Αγιάν Μαρίναν, κάποιος που τούτους [που την Αγιάν Μαρίναν] θα εθήτευσεν στην Καρπασίαν τζ̆’ έμαθεν την τζ̆’ εμάθαν την ούλοι οι χωρκανοί. […] Τζ̆αι όντως εγιώ βρίσκω ότι μοιάζει τζ̆αι με μιαν φωνήν που τραουδά ο Κκεμάλης που την Γαληνόπωρνην [χωρκόν στην περιοχήν Καρπασίας].[^17]"}, {"type": "p", "text": "Ερώτησα τζ̆αι τον Γιώργον Πουλλήν, γιον του Τζ̆ιαννή, αν ήξερεν γιατί την «Κωμήτισσαν» λαλούν την «Καρπασίτισσαν» στην Αγιάν Μαρίναν τζ̆αι είπε μου ότι τον Τζ̆ιαννήν εκαλούσαν τον να κάμνει γάμους στην περιοχή της Καρπασίας. Πιθανόν ο ίδιος ο Τζ̆ιαννής να εμετάφερεν την μελωδίαν στην Αγιάν Μαρίναν. Ο αρφός του, Μιχάλης Πουλλής, θυμάται πως πολλοί χωρκανοί του στην Αγιάν Μαρίναν είχαν οικονομικές οσχέσεις με την περιοχή της Καρπασίας. Έιχαν φορτήγα τζ̆αι εμετέφεραν ασ̆ερον τζ̆αι κόπριν στα χωράφκια/περβόλια των Καρπασιτών. Σύμφωνα με τον Μιχάλη, πιθανόν κάποιος μέσω τούντου εμπορίου να άκουσε την «Κωμήτισσαν» να του άρεσε τζ̆αι να την έφερε στην Αγιάν Μαρίναν. Πάντως η «Κωμήτισσα» ήταν αρκετά διαδεδομένη στην Αγιάν Μαρίναν, όπως μου είπεν ο κύριος Γιώργος, τζ̆’ ετραουδούσαν την πολλοί. Αναφορά μου για τούτην την ηχογράφησην εν’ η ερμηνεία του Τζ̆ιαννή Πουλλή, όπως τον εκατέγραψεν ο γιος του Γιώργος σε μαγνητόφωνον στο Λονδίνον, το 1968."}, {"type": "source", "text": "Συνέντευξη Μιχάλη Ττερλικκά, 1 Απριλίου 2026"}, {"type": "source", "text": "Συνέντευξη Γιώργου Πουλλή, 18 Μαΐου 2026"}, {"type": "source", "text": "Συνέντευξη Μιχάλη Πουλλή, 1 Αυγούστου 2026"}]}, {"id": "song-8", "title": "Η Λενού", "credits": ["Μουσική: Παραδοσιακό· διασκευή Συμεών Μερκούρη", "Οργανικό κομμάτι: Σύνθεση Στέλιου Παπαμιχαήλ", "Στίχοι: Παραδοσιακοί", "Φωνή, λύρα: Στέλιος Παπαμιχαήλ", "Λαούτα: Συμεών Μερκούρης, Στέλιος Παπαμιχαήλ"], "body": [{"type": "p", "text": "«Η Λενού» ή «Η Λενουκκού» είναι παραδοσιακόν τραγούδιν που εκαταγράφηκεν, σε μουσικήν τζ̆αι στίχους, που τον Θεόδουλον Καλλίνικον στο Τρίκωμον το 1940, τζ̆αι εδημοσιεύτηκεν στην συλλογήν του Κυπριακή λαϊκή μούσα (1951). Ηχογράφησεν την με βυζαντινήν χορωδίαν στο ΡΙΚ αρχές της δεκαετίας του ’60, στο πλαίσιον μιας σειράς ηχογραφήσεων με τίτλον «Κυπριακοί χοροί και τραγούδια»."}, {"type": "p", "text": "Ο Θεόδουλος Καλλίνικος εγεννήθηκεν στες 5 Μαΐου 1904 στο Λευκόνοικον Μεσαορίας τζ̆αι επέθανεν σε ηλικίαν 100 χρονών. Το 1921 εμετακόμισεν στην Λευκωσίαν τζ̆’ εμαθήτευσεν για τέσσερα χρόνια στον φημισμένον δάσκαλον βυζαντινής μουσικής  Στυλιανόν Χουρμούζιο.ν Το 1925 ίδρυσεν στο Πραστειόν Μεσαορίας σχολήν βυζαντινής μουσικής. Τον Δεκέβρην του 1929 εδιορίστηκεν δεξιός ψάλτης στον Άγιον Σάββαν στην Λευκωσίαν. Το 1933 επήεν στην Αθήναν, όπου εφοίτησεν στο Εθνικόν Ωδείον. Στην Αθήναν έγραψεν πέντε δίσκους 78 στροφών, με συνολικά δέκα κυπριακά παραδοσιακά τραγούδια, για λογαριασμόν της δισκογραφικής εταιρείας His Master’s Voice (HMV). Εκυκλοφορήσαν το 1934 τζ̆αι, μέχρι το 1939, επουληθήκαν, σύμφωνα με τον ίδιον, 75.000 αντίτυπα. Εχτός που την δισκογραφίαν, ο Καλλίνικος εμάζεψεν που περιοδείες του σε χωρκά της Κύπρου έναν μουσικόν θησαυρόν παραδοσιακών τραουθκιών – περίπου 150 στον αριθμόν. Κάποια που τούτα εξέδωσεν τα στην συλλογήν του Κυπριακή λαϊκή μούσα το 1951 σε βυζαντινήν τζ̆αι δυτικήν σημειογραφίαν. Το 1935 αντικατέστησεν τον δάσκαλον του Στυλιανόν Χουρμούζιον τζ̆’ εδιορίστηκεν πρωτοψάλτης στον καθεδρικόν ναόν Αγίου Ιωάννη στην Λευκωσίαν, θέσην που εκατείχεν μέχρι τον θάνατον του το 2004. Το 1977 εδόθηκεν του που την Εκκλησίαν της Κύπρου ο τιμητικός τίτλος «Άρχων Πρωτοψάλτης της Εκκλησίας της Κύπρου» για την προσφοράν του στην βυζαντινήν μουσικήν τζ̆αι στο δημοτικόν τραγούδιν της Κύπρου. Ετιμήθηκεν επίσης το 1978 που την Ακαδημίαν Αθηνών."}, {"type": "p", "text": "Εδιασκεύασα τούντο κομμάτιν σε ρυθμόν 9/8 ([αντί τον σύνθετο 7/8 τζ̆αι 11/8] ρυθμόν που το έγραψεν στο ΡΙΚ ο Καλλίνικος) τζ̆αι έδωκα έμφασην σε τούντην ρυθμικήν αγωγήν που ένιωθα να υποβόσκει άμαν το ετραούδουν. Εχρησιμοποιήθηκεν λύρα αντί φκιολίν τζ̆αι θκυο λαούτα. Η μελωδία στην λύραν τζ̆αι το μελωδικόν λαούτον είναι επίσης ελαφρώς παραλλαγμένη που την καταγραφήν του Καλλίνικου. Σε μιαν πρόβαν με τον Στέλιον, άμαν του έδειξα το τραγούδιν τζ̆’ επαίξαμεν το λλίον, εσυνέχισεν μετά τα λόγια με έναν οργανικόν σκοπόν που έγραψεν ο ίδιος. Ενθουσιάστηκα άμαν τον άκουσα. Ήταν λες τζ̆αι τούτος ο σκοπός του εγράφτηκεν κατά παραγγελίαν για την «Λενούν». Έτσι υιοθετήθηκεν το οργανικόν του Στέλιου ως κομμάτιν της διασκευής μας. Όπως τζ̆αι με τον «Σκλάβο» η διασκευή μας, παρόλο που εχρησιμοποιήσαμε την ερμηνεία του Καλλίνικου ως πρωτόλεια αναφορά, έσ̆ει έναν ‘αέραν’ που κοντινές σε μας μουσικές παραδόσεις τζ̆αι δεν θα την εχαρακτήριζα αυστηρά κυπριακή."}, {"type": "source", "text": "Εκπομπή «Ραδιοσκόπιο» με τον Κλείτο Ιωαννίδη, ΡΙΚ, 23 Νοεμβρίου 1979"}]}, {"id": "song-9", "title": "Ο Πραματευτής και ο κλέφτης αδελφός", "credits": ["Μουσική: Παραδοσιακό (Διασκευή Συμεών Μερκούρη)", "Στίχοι: Παραδοσιακοί", "Φωνή: Συμεών Μερκούρης, Στέλιος Παπαμιχαήλ", "Λύρα: Στέλιος Παπαμιχαήλ", "Κοντραμπάσο: Δημήτρης Πήχας"], "body": [{"type": "p", "text": "Έναν κλασσικόν παράδειγμαν μακροσκελούς αφηγηματικού τραουθκιού, που ετραουθκιέτουν (μεταξύ άλλων) κατά την διάρκειαν του θερισμού για να διά ρυθμόν στην εργασίαν (περισσότερα για τα αφηγηματικά τραούθκια στην σ. [6●]). Υπάρχουν πολλές παραλλαγές στίχων, αλλά τζ̆αι πολλές μελωδίες της ιστορίας του Πραματευτή. Αναφορά μου εν’ η ερμηνεία του Αντρέα Χρίστου Πιττυρή, όπως τον ηχογράφησεν ο Τζ̆έιμς Νοτόπουλος το 1953 στο Παραλίμνιν (περισσότερα για την λαογραφικήν αποστολήν του Νοτόπουλου στην σ. [4])."}, {"type": "p", "text": "Ο Πιττυρής εγεννήθηκεν στην Αγίαν Νάπαν στες 11 Νοεμβρίου 1916 τζ̆αι επέθανεν σε ηλικίαν 105 χρονών. Μετά επήεν στο Παραλίμνιν, όπου τζ̆αι επαντρεύτηκεν την Ιφιγένειαν Μεζέ τζ̆αι αποχτήσαν οχτώ παιθκιά. Επαγγελματικά ασχολείτουν με γεωργικές εργασίες ως περβολάρης. Που 13 χρονών έκαμνεν μαθήματα βυζαντινής μουσικής τζ̆αι, όταν επήεν στο Παραλίμνιν, έψαλεν στην εκκλησίαν του Αγίου Γεωργίου για ογδόντα χρόνια. Έμαθεν λαούτον σε μάστρον, έναν Μιχάλην στο Βαρώσιν[^19], τζ̆αι έκαμνεν γάμους. Σε μιαν κουβένταν που εκάμαμεν, οι κόρες του, Μαργαρίτα Δημητρουδίου τζ̆αι Ελένη Σ̆ιαλούτα, είπαν μου τα εξής:"}, {"type": "p", "text": "Tου άρεσκεν πολλά η ψαλμουθκιά τζ̆αι το λαούτον. Aθθυμούμαι τον να πιάννει το λαούτον να παίζει τζ̆αι να ψάλλει. Αν είσ̆εν γάμον, έπρεπεν να πάει. Τζ̆αι, λόγω του ότι έπαιζεν λαούτον τζ̆αι ο γιος του ο μεγάλος [ο Χριστάκης Πιττυρής], ήταν φκιολάρης, επααίνναν μαζίν τζ̆αι εκάμναν γάμους επαγγελματικά."}, {"type": "p", "text": "Eχτός που τον γιον του τον Χριστάκην, ο Πιττυρής έπαιζεν λαούτον τζ̆αι με τους φκιολάρηες του χωρκού του Κωσταντήν Νικολάτζ̆ην τζ̆αι Γιώργον Κωστή Πογιατζ̆ήν."}, {"type": "p", "text": "Ο Αντρέας Πιττυρής τραουδά στην ηχογράφησην του Νοτόπουλου χωρίς όργανα. Στην διασκευήν μας, την μελωδία της φωνής πλαισιώννουν την τζ̆αι τοξωτά όργανα (λύρα τζ̆αι κοντραμπάσον). Τούτον σημαίνει ότι επιλέξαμεν να φκούμεν που τον αυστηρά κυπριακό τρόπον που ελέγουνταν τα αφηγηματικά τραούθκια δηλ. χωρίς όργανα. Επίσης εν επιχειρήσαμεν να κόψουμεν που τους στίχους για να λλιάνουμεν την διάρκειαν, διότι έθελαμεν (α) ν’ αποδώσουμεν ολοκληρωμένα την ιστορίαν τζ̆αι (β) να δώκουμεν έμφασην στην μονότονην ρυθμικήν επανάληψην της ίδιας μελωδίας. Εθέλαμεν να παραπέμψει τζ̆είνον που το ακούει στην λειτουργικότηταν τούντου είδους των τραουθκιών: να διούν ρυθμόν, δηλαδή, στο θέρος τζ̆αι να γίνεται η δουλειά καλλύττερα, αλλά τζ̆αι να ποσκολιεί τους αρκάτες που έπρεπεν να κάμνουν μιαν αρκετά επαναληπτικήν τζ̆αι δύσκολην εργασίαν μες την πυράν, για πολλές συνεχόμενες ημέρες ή εφτομάες."}, {"type": "source", "text": "Συνέντευξη Μαργαρίτας Δημητρουδίου τζ̆αι Ελένης Σ̆ιαλούτα, 25 Σεπτεμβρίου 2025"}]}, {"id": "song-10", "title": "Μανές Μπάλος Δεύτερος", "credits": ["Στίχοι & Μουσική: Παραδοσιακό", "Φωνή: Συμεών Μερκούρης", "Βιολί: Παύλος Μιχαηλίδης", "Λαούτο: Στέλιος Παπαμιχαήλ"], "body": [{"type": "p", "text": "Ο «Μανές Μπάλος Δεύτερος» είναι ο δεύτερος  μπάλος στην Κύπρον (περισσότερα για τον ρόλον του μπάλου στην κυπριακήν παραδοσιακήν μουσικήν στην σ. [●]). Αναφορά μου εν’ η ερμηνεία του Χριστόφορου Μαυρή που το Πραστειόν Μεσαορίας, όπως τον ηχογράφησε, ο Τζ̆έιμς Νοτόπουλος τον Ιούνιον του 1953 στο Λευκόνοικον (παραπάνω για την λαογραφικήν αποστολήν του Τζ̆έιμς Νοτόπουλου στην Κύπρον, στην σ. [●]). Στην συγκεκριμένην ηχογράφησην τραγουδά τον «Μπάλο τον δεύτερον» ο Χριστόφορος Μαυρής,[^21] τζ̆αι παίζουν ο Γεώργιος Ψύλλος (φκιολίν) τζ̆αι ο Προκόπης Π. Λαουτάρης (λαούτον)."}, {"type": "p", "text": "Ο Χριστόφορος Μαυρής εγεννήθηκεν το 1905 στο Πραστειόν Μεσαορίας. Στην οικογένειαν του ήταν ο πιο μιτσής. Είσ̆εν θκυο αρφούες, τον Γιώρκον τζ̆αι τον Σολωμήν, τζ̆αι τέσσερις αρφάες, την Αναστασίαν, την Ελένην, την Αντζ̆ελούν τζ̆αι την Κυριακούν. Όταν ήταν σαράντα ημερών, επέθανεν ο παπάς του, Χριστόφορος, τζ̆’ επήρεν τ’ όνομαν του. Ο ίδιος επαντρεύτηκεν σε ηλικίαν 37 χρονών τζ̆’ έκαμεν έντεκα παιθκιά. Εν επήεν καθόλου σχολείον τζ̆’ ασχολήθηκεν που μιτσής με την γεωργίαν. Ενοικίαζεν χωράφκια που έσπερνεν, τζ̆’ είσ̆εν τζ̆’ έναν περβόλιν έξω που την Κοντέαν. Μάλιστα, γύρω στο ’42, εμετακόμισεν στο περβόλιν με την οικογένειαν του. Σε μιαν κουβένταν που εκάμαμεν, ο μικρότερος του γιος, ο Θεόδωρος («Θεωρής»), αθθυμάται τον παπάν του ως ιδιαίτερα εργατικόν τζ̆αι ευρηματικόν. Τούτον επιβεβαίωσεν μου το τζ̆αι ο Αντώνης Τσ̆ιάκκιρος, κοινοτάρχης του Πραστειού, μεγαλύτερος σε ηλικία που τον Θεωρήν τζ̆αι αδερφότεχνος του Μαυρή, που μου είπεν τα εξής:"}, {"type": "p", "text": "Ήταν γεωργός, αλλά έκαμνεν τζ̆αι πράξεις. Ήταν πολυμήχανος. Εβάλλαν παμπάτζ̆ια στην Χαβούζαν, φράγμαν για την Μεσαορίαν που εν είσ̆εν νερά, τζ̆αι, επειδή εν έβρισκεν να του φυτεύκουν, εδημιούργησεν μόνος του τον πρώτον σπορέαν της περιοχής για το παμπάτζ̆ιν. Ήρταν που την Αθηένου να τον αντιγράψουν για να κάμουν τους σπορέες [sic] που υπάρχουν σήμμερα.  Ήταν η φύση του έτσι, πολυτεχνίτης. Έκοφκεν ο νους του πολλά."}, {"type": "p", "text": "Ο Τσ̆ιάκκιρος θθυμάται τον Μαυρήν να πρωταγωνιστεί στους γάμους τζ̆αι τες διασκεδάσεις στο Πραστειόν:"}, {"type": "p", "text": "Στους γάμους αθθυμούμαι τον πολλά. Ήταν πολλά του μανέ, αμανετζ̆ής καλός, τζ̆’ ελάλεν τζ̆αι τσ̆αττιστά. Αθθυμούμαι σ’ έναν γάμον εχόρευκε ο γαμπρός, ο Προδρομάς, τζ̆’ επήρεν γεναίκαν που το Λάπαθος. Τον τζ̆ύρην της νύφης ελαλούσαν τον Άντωναν."}, {"type": "p", "text": "Eίπεν ο γαμπρος [o Προδρομάς]:"}, {"type": "verse", "lines": ["«Eθκιάλεξα τζ̆’ αγάπησα γεναίκαν του Λαπάχου", "τζ̆αι άησ’ τες Πραστίτισσες, ώχχο καλά να πάχουν»", "Tζ̆αι απαντά του ο θκειος μου αμέσως:", "«Να συχχωράς του Άντωνα που ’τουν αναγκασμένος", "’ξα ’ταν να μείνεις, Πρόδρομε, σκάπουλλος ορισμένος»", "Εσυνέχισεν μετά να τον πειράζει [τον γαμπρόν]:", "«Πο’ ούλλους μας ο Πρόδρομος έφαεν παραπάνω", "τζ̆’ επήεν εις τον λυερόν[^22]", "τζ̆’ έφκαλεν το πουλλίν γερόν τζ̆’ είσ̆εν τζ̆αι νύσ̆ια πάνω»", "Παρότι σχετικά μεγάλον χωρκόν το Πραστειόν Μεσαορίας, ο Τσ̆ιάκκιρος εν αθθυμάται να έσ̆ει μουσικούς. Αντ’ αυτού, έρκουνταν που άλλα χωρκά φκιολάρηες για τους γάμους, την Λαμπρήν τζ̆αι το παναΰριν του Αγίου Γεωργίου – το παναΰριν του χωρκού. Θθυμάται, όμως, τον Παναήν Γιωρκή Πάτση, έναν εξαίρετον δεξιοτέχνην στο πιθκιαύλιν, τον οποίον ηχογράφησεν εκτενώς ο Νοτόπουλος το 1953."]}, {"type": "source", "text": ""}, {"type": "source", "text": "Συνέντευξη Θεόδωρου Μαυρή, 22 Δεκεμβρίου 2025"}, {"type": "source", "text": "Συνέντευξη Αντώνη Τσ̆ιάκκιρου, 12 Ιανουαρίου 2026"}]}, {"id": "song-11", "title": "Να σου γοράσω μηχανήν", "credits": ["Μουσική & Στίχοι: Παραδοσιακό", "Φωνές: Συμεών Μερκούρης, Στέλιος Παπαμιχαήλ", "Λύρα: Στέλιος Παπαμιχαήλ", "Λαούτο: Συμεών Μερκούρης"], "body": [{"type": "p", "text": "Έναν που τα πιο γνωστά κυπριακά τραούθκια σε ρυθμόν 9/8. Ηχογράφησεν το ο Γιώργος Σπανός, ψάλτης τζ̆αι ερμηνευτής παραδοσιακών τραουθκιών, στο στούντιο του Κυριάκου Κεραυνού (Keravnophone) στες αρχές της δεκαετίας του ’60. Συνοδεύκει τον η ορχήστρα του Τουρκοκύπριου φκιολάρη Mehmet Ali Vasfi Tatlıyay. Η εισαγωγή τζ̆αι οι μουσικές απαντήσεις ενδιάμεσα των στίχων που εχρησιμοποιήσαμε είναι  παραλλαγές της πρώτης μελωδίας του πρώτου γυναικείου καρτζ̆ιλαμά."}]}, {"id": "song-12", "title": "Φωνή Κοτροφίσιμη", "credits": ["Μουσική: Παραδοσιακό", "Στίχοι: 1η και 2η στροφή: Νικόλας Κούβαρος· 3η, 4η και 5η στροφή: Δημήτρης Ττάκκας· 6η και 7η στροφή: Χρίστος Πριγκόπουλλος", "Φωνές: Συμεών Μερκούρης 1η,3η, 5η και 7η στροφή), Στέλιος Παπαμιχαήλ (2η, 4η και 6η στροφή)", "Βιολί: Εύρος Βοσκαρίδης", "Λαούτο: Στέλιος Παπαμιχαήλ", "Κοντραμπάσο: Δημήτρης Πήχας"], "body": [{"type": "p", "text": "Η φωνή τούτη εν’ φωνή της επαρχίας Αμμοχώστου (παραπάνω για το πώς χρησιμοποιείται ο όρος «φωνή» στην κυπριακήν μουσικήν, βλ. σ. [●]). Ο Χρήστος Σίκκης ηχογράφησεν τούντην φωνήν ως «Η Λιοπετρίτισσα», στον δίσκο, του Κύπρος – Της γης παράδεισος (1993)."}, {"type": "p", "text": "Σύμφωνα με το βιβλίον του Πέτρου Ράφτη Κοτροφίσιμη Λιοπετρίτισσα Φωνή, εν’ η φωνή  που ο Λιοπετρίτης Γεώργιος Κότροφος εχρησιμοποίησεν για να μοιρολοήσει τες κόρες του, Βασιλούν τζ̆αι Κυριακούν, που επνιήκαν στον πνιμόν του 1919 στον Ποταμόν Λιοπετρίου. Την ιστορίαν εδιηγήθηκεν την του κυρίου Πέτρου ο Αντρέας Γρίστακκος, λαϊκός ποιητής τζ̆αι μουσικός (πιθκιαύλιν) της περιοχής, όπως την άκουσεν ο ίδιος που την γιαγιάν του την Θεογνωσίαν Παρασκευά Λευτέρη («Κασαπούν» ή «Φωνιτσούν»), που εγεννήθηκεν το 1898. Στες 9 Ιουνίου 1919, Λιοπετρίτες, Ξυλοφαΐτες τζ̆αι Αυκορίτες εμαζευτήκαν στον Ποταμόν Λιοπετρίου «να κατακλυστούν», κατά το έθιμον. Στο πλαίσιον των εορτασμών, εκάμαν τζ̆αι μιαν βαρκάδαν, που αποδείχτηκεν μοιραία. Τριάντα άτομα επιβιβαστήκαν στην βάρκαν του Παρασκευά Σάββα-Κκελετζ̆ή. Στην είσοδον του ποταμού, στον μόλο, όπου τα νερά εν’ βαθκιά, η βάρκα ανατράπηκεν. Το ατύχημαν έγινεν μάλλον λόγω απότομης αλλαγής βάρους που την μιαν πάνταν της βάρκας στην άλλην. Δεδομένου ότι ελάχιστοι τότε εξέραν κολύμπιν, επνιήκαν 25 που τους 30 επιβάτες – κυρίως γυναικόπαιδα. Θκυο που τα θύματα ήταν οι κόρες του Κότροφου. Άμαν τες εφκάλαν νεκρές στο παραγιάλλιν, ο Κότροφος έκατσεν ανάμεσα τους τζ̆’ είπεν τα εξής, στην μελωδίαν τούντης φωνής:"}, {"type": "p", "text": "Εννά πενιάσω τον παπάν χώμαν να μεν τους βάλει"}, {"type": "p", "text": "γιατ’ εν κάμνω τες κόρες μου της μαύρης γης χαλάλιν"}, {"type": "p", "text": "Nα ’τουν ο Χάρος δίκαιος τζ̆αι να ’καμνεν χαττίρκα"}, {"type": "p", "text": "εν θέννα ’πίνναν οι γονιοί τέθκοια πικρά ποτήρκα"}, {"type": "p", "text": "Να σημειωθεί ότι η ίδια φωνή στο Παραλίμνιν λέγεται «Παραλιμνίτισσα Φωνή» τζ̆αι ως τέθκοιαν την ετραούδησεν το 1976 στο ΡΙΚ ο Κωσταντής Αρτυματάς (Γιώργος Πογιατζ̆ής, φκιολίν, τζ̆αι Δημοσθένης Ζανέττου, λαούτον). Μεταγενέστερες ηχογραφήσεις τούντης φωνής ως «Παραλιμνίτισσας» εγίναν που την Κυριακούν Πελαγία τζ̆αι το μουσικόν σχήμαν «Μεσόγειος» (1995) τζ̆αι την Κυριακούν Μουαΐμη (2009)."}, {"type": "p", "text": "Δαμαί ίσως να δημιουργείται μια σύγχυση ως προς την ονομασίαν, αφού ο όρος «Παραλιμνίτισσα» χρησιμοποιείται για να περιγράψει τζ̆αι μιαν φωνήν αρκετά παρόμοιαν με την «Ίσ̆ιαν Φωνήν».[^23] Ο Τεύκρος Ανθίας γράφει για την «Παραλιμνίτισσαν» πως είναι «η πιο διαδεδομένη κυπριακή “φωνή” […] Μία απ’ αυτές τις παραλλαγές είναι γνωστή ως «η φωνή της ίσιας». Συνεχίζει, όμως, στην περιγραφήν του για την «Λιοπετρίτισσαν» τζ̆αι διαχωρίζει την που την «Παραλιμνίτισσαν», εξηγώντας πως «αν και [η Λιοπετρίτισσα] εβγήκε από το Λιοπέτρι, που γειτονεύει με το Παραλίμνι, δεν έχει τίποτε το κοινό με την Παραλιμνίτισσα».[^24]"}, {"type": "p", "text": "Αφήννοντας, όμως, την ονοματολογίαν στην πάνταν, η μελωδία τούντης φωνής εν’ ιδιαίτερα θρηνητική τζ̆αι πένθιμη. Παρόλον που ετραουδήσαμεν με τον Στέλιον κυρίως ερωτικά δίστιχα/ολιγόστιχα πάνω, εθκιάλεξα τζ̆είνα που εθεώρησα πως έχουν μιαν πιο θλιμμένην, υπαρξιακήν σχεδόν έννοιαν. Το πρώτον δίστιχον τζ̆αι το δεύτερον ολιγόστιχον εν’ του Νικόλα Κούβαρου (Λιοπέτριν), το τρίτον, τέταρτον τζ̆αι πέμπτον ολιγόστιχον εν’ του Δημήτρη Ττάκκα (Λιοπέτριν) τζ̆αι το έχτον τζ̆αι έβδομον του Χρίστου Πριγκόπουλλου (Αυκόρου). Ενορχηστρωτικά, επροσπαθήσαμεν να αποφύγουμεν τα έντονα (τονισμένα) ρυθμικά μοτίβα που υπάρχουν σε άλλες ηχογραφήσεις τούντης φωνής: ο ρυθμός στο λαούτον τζ̆αι στο κοντραμπάσον υπονοείται αλλά εν τονίζεται, για να μεν αφαιρέσει που τον πένθιμο, χαραχτήραν της φωνής. Αναφορά μου δαμαί ήταν ο τρόπος που παίζει λαούτον ο Μίμης Πέτρος Λαουτάρης στην επιτόπιαν ηχογράφησην τούντης φωνής ως «Koτροφίσιμης», που την λαογραφικήν αποστολήν του Πελοποννησιακού Λαογραφικού Ιδρύματος (1978-85). Στην καταγραφήν του ΠΛΙ τραουδούν οι Χρίστος Πριγκόπουλλος τζ̆αι Πιερής Πιερέττης, γνωστός φκιολάρης τζ̆αι τραουδιστής των Κοτσ̆ινοχωρκών που το Φρέναρος. Ο Πιερέττης παίζει επίσης φκιολίν στην συγκεκριμένην ηχογράφησην."}, {"type": "source", "text": "Πέτρος Ράφτης, Κοτροφίσιμη Λιοπετρίτισσα Φωνή – 100 χρόνια Άυλης Πολιτιστικής Κληρονομιάς (2019)"}, {"type": "source", "text": "Μιχάλης Χατζημιχαήλ, Φωνή λαού ευτζ̆ή Θεού: Οι Φωνές της κυπριακής μουσικής παράδοσης (2024)"}, {"type": "source", "text": "Τεύκρος Ανθίας, «Λαϊκά θέματα: Kυπριακή λαογραφία: Oι κυπριακές φωνές», Νέος Δημοκράτης, 20 Νοεμβρίου 1949"}, {"type": "heading", "text": "Νικόλας Κούβαρος"}, {"type": "p", "text": "Το 1ον δίστιχον τζ̆αι το 2ον ολιγόστιχον εν’ του Νικόλα Κούβαρου. Ο Κούβαρος εγεννήθηκεν στο Λιοπέτριν στες 2 Μαΐου 1899. Μέλος πολυμελούς οικογένειας με οχτώ αδέρφκια, ήταν γιος του Λαμπρινού Ψύλλου τζ̆αι αρφότεχνος του Παρασκευά Ψύλλου ή «Τταπάκκου» – τζ̆αι οι θκυο τους λαϊκοί ποιητές. Ο ίδιος απέχτησεν εννιά παιθκιά, τρεις γιούες τζ̆αι έξι κόρες. Ο Λάμπρος Κούβαρος, γιος του Νικόλα Κούβαρου, ήταν τζ̆αι τζ̆είνος λαϊκός ποιητής, που επιδίδετουν στο τσ̆άττισμαν τζ̆αι τα ερωτικά. Το «Κού[β]αρος» ήταν παρατσούκλιν που υιοθέτησεν στην παιδικήν του ηλικίαν. Ο Πέτρος Ράφτης, άγγονας του Νικόλα Κούβαρου τζ̆αι επίσης λαϊκός ποιητής, είπεν μου:"}, {"type": "p", "text": "Εδούλευκεν μισταρκός μωρόν μες τες μάντρες τζ̆’ έγλεπεν κουπάιν, τζ̆αι τζ̆ει̮αμαί που έγλεπεν τες κουέλλες πά’ στον Τράχωναν [περιοχή έξω που το Λιοπέτριν], μες την άννοιξην που βλαστούν οι σπουρτούλλες, εν εφαίνετουν πάνω που τες σπουρτούλλες. Ο κόσμος εθώρεν το κουπάιν τζ̆αι βοσκόν εν εθώρεν. Εθώρεν έναν κουαρούιν που ’πήαιννεν τζ̆’ έρκετουν, τζ̆’ όταν εκατέβην κάτω με το κουπάιν λαλούν του, «Ρε, μα τζ̆είν’ το κουαρούιν εσού ήσουν;». Το κουαρούιν έγινεν Κούαρος. Που μωρόν έπιαεν το παρατσούκλιν τζ̆αι υιοθέτησεν το ως επίθετον."}, {"type": "p", "text": "Εν επήεν σχολείον, αλλά έμαθεν λλία γράμματα που τον καφενέν. Έκαμεν πολλές δουλειές, μεταξύ άλλων μισταρκός, βοσκός, λακκοτρύπης,[^25] πράχτης (μεταπωλητής· εγόραζεν τζ̆’ επούλαν αφκά, πουλιά ή αντάλασσεν τα με άλλα προϊόντα). Έκαμνεν τζ̆αι τον κασάπην τζ̆’ έβαλλεν τζ̆αι οφτόν. Υπηρέτησεν επίσης για οικονομικούς λόγους ως εθελοντής τζ̆αι στους θκυο παγκόσμιους πολέμους ως μουλάρης – υπεύθυνος, δηλαδή, να χειρίζεται μουλάρκα για στρατιωτικές μεταφορές. Τούτον ήταν κάτι που εκάμαν αρκετοί Κυπραίοι στους παγκόσμιους πολέμους, λόγω της εξοικείωσης τους με τούντα ζώα. Ως ποιητάρης, εξέδωσεν τζ̆αι τρεις ποιητικές φυλλάδες,[^26] τες οποίες επούλαν για να φκάλει τα προς το ζην."}, {"type": "p", "text": "Ο Κούβαρος ετσ̆άττιζεν τζ̆’ ελάλεν τζ̆αι ερωτικά τραούθκια. Εδιακρίθηκεν, όμως, ιδιαίτερα στο τσ̆άττισμαν – στην ποιητικήν «μάχην», δηλαδή, εναντίον άλλου τραουδιστή.[^27] Eλάμβανεν μέρος σε ποιητικούς διαγωνισμούς στον Κατακλυσμόν στο Βαρώσιν, τζ̆αι που το 1949 εβραβεύκετουν με πρώτον βραβείον ή έπαινον. Ο κύριος του αντίπαλος, αν τζ̆αι πολλά νεόττερος, γεννημένος το 1918, ήταν ο Δημήτρης Ττάκκας που ήταν τζ̆αι χωρκανός του. Είπεν μου ο κύριος Πέτρος:"}, {"type": "p", "text": "Τζ̆αι μάλιστα τον Ττάκκαν επαραδέχετουν τον – ήταν ο κύριος του αντίπαλος. Πρώτος ο παππούς στο τσ̆άττισμαν με δεύτερον τον Ττάκκαν, τζ̆αι πρώτος ο Ττάκκας στα ερωτικά, δεύτερος ή τρίτος ή ο παππούς. Εθαύμαζεν ο ένας τον άλλον."}, {"type": "p", "text": "Έμεινεν στην ιστορίαν η μάχη τους στον Κατακλυσμόν του Βαρωσ̆ιού το 1969. Ο κύριος Πέτρος επερίγραψεν μου τον ως «έναν αγώναν πυγμαχίας βαρέων βαρών, με τραούθκια έξυπνα τζ̆αι στοχευμένα». Τελικά ο Κούβαρος έπιασεν το πρώτον βραβείον στην συγκεκριμένην μάχην."}, {"type": "p", "text": "Aρκετές ιστορίες για τον Κούβαρον ο κύριος Πέτρος έμαθεν τες που τον ίδιον τον Ττάκκαν. Είπεν μου τα εξής, όπως του τα αφηγήθηκεν ο Ττάκκας, που ήταν μάρτυρας σε πολλές μάχες του Κούβαρου:"}, {"type": "p", "text": "Έρκουνταν οι παλιοί – ειδικά Αυκορίτες – τον Δεκαπεντάουστον τζ̆’ ετζ̆οιμούνταν μες την αυλήν [του Κούβαρου]. Μετά στο παναΰριν είχαν καλύφην τζ̆αι τραουθκιές. Τζ̆ει̮αμαί που ’ν’ η εκκλησ̆ιά η παλιά του Λιοπετριού, η Παναγία η Ελεούσα. Ο Μηνάς [Σ̆εφταλής], ούλοι τούτοι, εκουλιάζαν έσσω του Κούαρου. Ήταν παγκύπρια γνωστός. Εκατεβαίνναν τζ̆αι στο παναΰρι του Αγίου Αναστασ̆ιού στην Περιστερωνοπηγήν [στο Βαρώσιν κοντά], που ήταν ζωοπανήγυρις, τζ̆αι επήαιννεν ο παππούς μου. Τζ̆αι έρκουνταν τραουδιστάες τζ̆αι είχαν τον σημαθκιασμένον. Πά’ στον Κούαρον ούλοι. Κατά τον Ττάκκαν: «Έρκετουν ένας, “έστραφτεν” του τον τζ̆’ επήαιννεν, έρκετουν άλλος,  “έστραφτεν” του τον τζ̆’ επήαιννεν». Τάχα εδίεννεν απαντήσεις αποστομωτικές. Αρώτησα τον Ττάκκαν, «Εφοήθηκες τον παππούν τον Κούαρον καμιάν φοράν;». «Τζ̆αι ποιος δεν εφοάτουν την προστηθκιάν του Κουαρκά;»"}, {"type": "source", "text": "Συνέντευξη Πέτρου Ράφτη, 24 Σεπτεμβρίου 2025"}, {"type": "source", "text": "Πέτρος Μιχάλη Ράφτης, Του παππού μου τα τραούθκια. Νικόλας Λ. Κούβαρος – Αποσπάσματα από τη ζωή και το έργο του (2019)"}, {"type": "source", "text": "Κωσταντίνος Γ. Γιαγκουλλής, Οι ποιητάρηδες της Κύπρου. Προλεγόμενα – Βιο-εργογραφία (1878–σήμερα) (2005)"}, {"type": "heading", "text": "Δημήτρης Ττάκκας"}, {"type": "p", "text": "Τo 3ον, 4ον τζ̆αι 5ον ολιγόστιχον εν’ του Δημήτρη Ττάκκα. Εγεννήθηκεν στο Λιοπέτριν στες 20 Ιουλίου 1918. Τριών μηνών ορφανεύτην που πατέραν, τζ̆αι εννιά χρονών που μάναν. Ανέλαβεν τον τότε η γιαγιά του στην Αγιάνναπαν. Πρώτα ο κόσμος επήαιννεν τζ̆’ εθκιακόναν, αφού εν υπήρχαν ακόμα οι συντάξεις, τζ̆’ έπαιρνεν τον η γιαγιά του μαζίν της στο θκιακονιόν. Η κόρη του, Μαρία Ττάκκα, σε μιαν κουβένταν που εκάμαμεν για τον πατέραν της είπεν μου: «Ο γέρος αντρέπετουν [που εθκιακόναν] τζ̆αι εδίεννεν του που πάνω η κοτζ̆άκαρη [η γιαγιά του] με το χαλίν[^30] της». Αφού ετέλειωσεν θκυο τάξεις του δημοτικού, επήεν μισταρκός στον Λιοπετρίτην Χρίστον Ττάκκαν να γλέπει κουπάθκια.[^31] Ο Χρίστος Ττάκκας ενίωσε τον, αφού ο ίδιος εν είσ̆εν παιθκιά. Λαλεί μου η κυρία Μαρία:"}, {"type": "p", "text": "Πρώτα οι βοσκοί, το καλοτζ̆αίριν που ήταν ζέστη, εφήνναν τα κουπάθκια έξω την νύχταν. Εννιά χρονών ήταν δαπάνω που ’ν’ τα τραχώνια[^32] τζ̆αι αροθύμαν.[^33] Σκέφτου έναν μωρόν μες τα σκοτάθκια..."}, {"type": "p", "text": "Το 1937 ο Χρίστος Ττάκκας επάντρεψεν τον Δημήτρην με την Αννεζούν του Βασιλά που την Γύψου, τζ̆’ εχάρισεν του τριάντα πρόβατα για να συνεχίσει το επάγγελμαν του βοσκού, κάτι που έκαμεν το τέλος της ζωής του. Εκάμασιν εφτά παιθκιά, πέντε κόρες τζ̆αι θκυο γιούες."}, {"type": "p", "text": "Ο Ττάκκας εδιέπρεψε τζ̆αι στο τσ̆άττισμαν τζ̆αι στα ερωτικά. «Επάλιωσεν» τζ̆αι είπεν ερωτικά τραούθκια με τους κορυφαίους τραουδιστές του τζ̆αιρού του σε καφενέες, παναΰρκα τζ̆αι διαγωνισμούς. Λαλεί μου η Μαρία Ττάκκα:"}, {"type": "p", "text": "Είσ̆εν ζιαφέθκια [στο Λιοπέτριν]. Στην εκκλησ̆ιάν την μικρήν που έχουμεν [Παναγία η Ελεούσα]. Άμαν ήμουν μιτσ̆ιά, επάαινα τζ̆’ εθώρουν τους, είχαν το πόστον ούλλοι οι τραουδιστές τζ̆’ επηαίναν τζ̆ει̮αχαμαί. Τζ̆αι χωρκανοί τζ̆αι ξένοι. Ήτουν τζ̆αι ο Στραοχαμπής ο γέρος, τζ̆’ έπαιζεν τους το φκιολίν τζ̆’ εδιασκεδάζαν το μέρες. Κυριακάες συνήθως. Τζ̆αι στον καφενέν του Κέττηρου εμαζεύκουνταν..."}, {"type": "p", "text": "Ο Ττάκκας επρόλαβεν τζ̆αι τους πιο παλιούς των Κοτσ̆ινοχωρκών, γεννημένους περίπου τες αρχές του εικοστού αιώνα, όπως τον Χαμπήν Κολοκάσην («Στραοχαμπήν»), Μηνάν Σ̆εφταλήν, Νικόλαν Κούβαρον, Χρίστον Πριγκόπουλλον, Πέτρον Πεσκέσ̆ην («Καντζ̆ιάραν»), Ξενήν Πάτσαλον, τζ̆’ εκέρδισεν τον σεβασμόν τους (βλ. πιο πάνω την άποψην του Κούβαρου για τον Ττάκκαν)."}, {"type": "p", "text": "O Tτάκκας εδιαγωνίστηκεν επίσης με επιτυχίαν στους ποιητικούς διαγωνισμούς που εγίνουνταν στον Κατακλυσμόν στο Βαρώσιν, στην Αγίαν Νάπαν τζ̆αι στην Λάρνακαν, τζ̆αι εβραβεύτηκεν με πρωτεία τζ̆αι επαίνους αρκετές φορές (πέραν των τριάντα). Είπεν μου η κόρη του:"}, {"type": "p", "text": "Στα ερωτικά ο γέρος εν επιάννετουν. Λαλεί [απαγγέλει μου η ίδια]:"}, {"type": "p", "text": "Μες την δικήν της γειτονιάν"}, {"type": "p", "text": "έσ̆ει μιαν πέτραν ριζιμιάν, λάκα το σκέδιόν της"}, {"type": "p", "text": "τζ̆’ επήα νύχταν τζ̆’ έκατσα"}, {"type": "p", "text": "τζ̆αι με το δάκρυν έγραψα τον μαύρον χωρισμόν της"}, {"type": "p", "text": "τζ̆’ εράισεν τζ̆’ έφκην φωθκιά"}, {"type": "p", "text": "τζ̆αι πώς εμέναν μια καρκιά ν’ αντέξει τον καμόν της;"}, {"type": "p", "text": "Με τούντο τραούδιν εκέρτισεν στα ερωτικά στον Κατακλυσμόν το ’69. […] Η πέτρα υπήρχεν στο χωρκόν. Ήμαστιν μωρά, εβουρούσαμεν τζ̆’ επαίζαμεν πά’ στην πέτραν. Ήτουν το πόστον μας."}, {"type": "p", "text": "O Ττάκκας, ως λαϊκός ποιητής, με την βοήθειαν του Κωσταντίνου Γιαγκουλλή, εξέδωσε έξι ποιητικές συλλογές: Το ξηφώτιν (1978), Στύλλωμαν του μεσομερκού (1978), Τσάκκισμαν της ημερούς (1981), Θάλασσα της Αγιάνναπας (1994), Νερόν τρεχάτον (1998) τζ̆αι Κολυμβήθρα του Σιλωάμ (1999)."}, {"type": "p", "text": "Ο Δημήτρης Ττάκκας απεβίωσεν σε ηλικίαν 87 χρόνων, στες 17 Μαρτίου 2005. Για μέναν τα ερωτικά του Ττάκκα εν’ αξεπέραστα στον λυρισμόν τους. Εχτός που το βάρος της έννοιας του στίχου του, ήταν τζ̆αι ιδιαίτερη η ερμηνεία του άμαν τα ετραούδαν: αργή, καθαρή τζ̆αι επιβλητική. Η ερμηνεία άρπασσεν την προσοχή του κοινού του τζ̆’ επροσέδιδεν νόημαν τζ̆αι έμφασην σε κάθε συλλαβήν του."}, {"type": "source", "text": "Συνέντευξη Mαρίας Ττάκκα, 25 Σεπτεμβρίου 2025"}, {"type": "source", "text": "Δημήτρης Ττάκκας, Κολυμβήθρα του Σιλωάμ (1999)"}, {"type": "source", "text": "Κωσταντίνος Γ. Γιαγκουλλής, Οι ποιητάρηδες της Κύπρου. Προλεγόμενα – Βιο-εργογραφία (1878–σήμερα) (2005)"}, {"type": "heading", "text": "Χρίστος Πριγκόπουλλος"}, {"type": "p", "text": "Το 6ον τζ̆αι 7ον ολιγόστιχον εν’ του Χρίστου Πριγκόπουλλου («Ππούφη»). Εγεννήθηκεν στ’ Αυκόρου στες 22 Δεκεμβρίου 1903 σε φτωχήν, πολυμελήν οικογένεια. Ο άγγονας του, Γιώργος Πριγκόπουλλος, με τον οποίον εκάμαμεν μιαν κουβένταν για τον παππούν του, είπεν μου:"}, {"type": "p", "text": "Όταν εμεγάλωσεν, αποφάσισεν ο γέρος να πάει μοναχός εις το Σταυροβούνιν. Επήεν για πέντ’-έξι μήνες, εν του άρεσεν τζ̆’ εκατέβηκε κάτω. Ήρτεν κάτων έκαμεν την οικογένειαν του, έντεκα παιθκιά."}, {"type": "p", "text": "Η πρώτη του γεναίκα, η Ελένη, επέθανεν εις την γένναν του πρώτου του παιθκιού. Μάλιστα ο κύριος Γιώργος είπεν μου τούντην συγκλονιστικήν ιστορία για το θαφκειόν της:"}, {"type": "p", "text": "H πρώτη του γεναίκα [του Πριγκόπουλλου] εγέννησεν το μωρόν ζωντανόν, αλλά επέθανεν τζ̆είνη. Όπως μου είπαν τζ̆αι μέναν πιο παλιοί, όταν την εφκάλλασιν που την εκκλησίαν για το κοιμητήριον, ετραούδαν της ούλλον τον δρόμον, μιλούμεν για δρόμον μισήν ώραν. Όταν ήταν να την κατεβάσουν στον λούκκον, είπεν της το τελευταίον τραούδιν:"}, {"type": "p", "text": "Σήκου, Ελένη, τζ̆’ έννα μπω στον τάφον τον δικόν σου"}, {"type": "p", "text": "λάχτα να πάεις στο χωρκόν τζ̆αι κλαίει το μωρόν σου"}, {"type": "p", "text": "Ήταν πολυτεχνίτης.  Λαλεί ο κύριος Γιώργος:"}, {"type": "p", "text": "Eνιώθηκεν μες την αρκατιτζ̆ήν. Σκολείον δεν επήεν ποττέ του. Έμαθεν λλία γράμματα που τον παπάν του χωρκού. Πολλά λλία γράμματα. Επρόσεχεν τους αγρούς, γιατί είσ̆εν πάρα πολλά κοπάθκια. Είσ̆εν έναν άλογον τζ̆αι ήταν ο τουρκόπουλλος τ’ Αυκόρου [τζ̆αι] για σαράντα χρόνια έψαλλεν τζ̆αι στην εκκλησίαν. Έκαμνεν κυνήγιν με τα ξώβερκα τζ̆’ επλούμιζεν τζ̆αι κολοκούθκια. Εσχεδίαζε τα με το σουγλίν. Εδούλευκεν πολλήν αρκατιτζ̆ήν εις το θέρος. Εν του ’πολλοάρεσκεν η μισταρκοσύνη, να πηαίννει μισταρκός του νιου τζ̆αι τ’άλλου, γι’ αυτόν έφκηκεν τουρκόπουλλος, έκαμνεν δουλειές δικές του για να ζήσει την οικογένειαν του. Ετανούσαμεν του στα βερκά για να πιάννει πουλιά. Ο παππούς έζησεν με τους μελισσοφάους, με τ’ αμπελοπούλια, με τα τρυόνια."}, {"type": "p", "text": "Eκατάγετουν που ποιητικήν οικογένειαν. Ο ίδιος έγραψεν του Κωσταντίνου Γιαγκουλλή: «Η τραουθκιά είναι έμφυτη [...] ετραούδαν ο πάππος μου, ο θείος μου ο Μηνάς ο Σεφταλής, αήττητος τραουδιστής στου διαγωνισμούς, ετραούδαν η μάνα μου, η αδερφή του Μηνά […]». O κύριος Γιώργος θέτει το πιο λακωνικά: «Είσ̆εν το το ρατσικόν του, το γαίμαν του μέσα.»"}, {"type": "p", "text": "O Πριγκόπουλλος επιδόθηκεν τζ̆αι στο τσ̆άττισμαν τζ̆αι στα ερωτικά τραούθκια. Εδιακρίθηκεν αρκετές φορές σε ποιητικούς διαγωνισμούς στην Τζ̆ερύνειαν, στην Λάρνακα τζ̆αι στο Βαρώσιν. Ετραούδαν, όμως, τζ̆αι στο χωρκόν: στους καφενέες, στο παναΰριν των Αποστόλων Πέτρου και Παύλου στην εκκλησίαν του χωρκού, τζ̆αι Δευτέραν της Λαμπρής."}, {"type": "p", "text": "Είπεν μου ο κύριος Γιώργος, όσον αφορά την παρέαν του στην τραουθκιάν:"}, {"type": "p", "text": "Οι καλύττεροι του οι παρέες ήταν ο Πιερέττης τζ̆αι ο Πέτρος ο Μίμης [γνωστοί μουσικοί της περιοχής των Κοτσ̆ινοχωρκών]. Εγύρευκεν τον ο Πιερέττης, γιατί εν είσ̆εν αυτοκίνητον τζ̆αι έρκετουν τζ̆’ έπιαννεν τον. Ο παρέας του άσιλα. Ετραούδησεν όμως με πολλούς, με τον Πάτσαλον, με τον Ττάκκαν, με τον Στραοχαμπήν, τον Γιάρρον [Δημήτρης Γιαλλούρης], τον Πρόσφυγαν [Κυριάκος Μουλάρης]. Άμαν ετραουδούσαν μες τους καφενέες, εβουρούσαμεν οι μιτσ̆ιοί να φκούμεν πά’ σε καμιάν πέτραν, κανέναν σιμιντίριν να τους δούμεν."}, {"type": "p", "text": "Ο κύριος Γιώργος θθυμάται έντονα τον παππούν του ως γλεντζ̆έν, στο ζιαφέττιν τζ̆αι στην διασκέδασην. Λαλεί ο ίδιος:"}, {"type": "p", "text": "Το μεράκκιν του άσιλα ήταν η διασκέδαση. Άμαν εκαχούνταν [με την παρέαν του] στο ποτόν τζ̆αι στην διασκέδασην, μπορεί να έκαμνεν τζ̆αι θκυο μέρες να πάει έσσω του. Είσ̆εν ο καθένας κοντά του την λαμιτζ̆άναν του με κουνιάκκιν ή κρασίν. Εδιασκεδάζαν μερόνυχτα. Ήρτεν έσσω μιαν μέραν [που μιαν διασκέδασην], έκαμεν το μπάνιον του, εξ̆ουρίστηκεν τζ̆’ έππεσεν. Εσηκώστηκεν ύστερα που θκυο-τρεις ημέρες."}, {"type": "p", "text": "Λαλεί της γεναίκας του, «Ρα Δεσποινού, εν εξ̆ουρίστηκα να ππέσω, έμεινα αξ̆ούριστος»."}, {"type": "p", "text": "[Λαλεί του τζ̆είνη] «Ρε Ττοφή, εν’ τρεις ημέρες που τζ̆οιμάσαι»."}, {"type": "p", "text": "Φαντάσου πόσον ποτόν είσ̆εν πάνω του τζ̆αι πόσην ξαγρυπνίαν."}, {"type": "p", "text": "Άλλην ημέραν πάλε, έσφαξεν ένα μισοσ̆οίριν τζ̆’ έκατσεν με τους παρέες του τζ̆’ επίννασιν. Το πρωίν που εξύπνησεν η γιαγιά μου, λαλεί της  «Δεσποινούν έλειψεν τον φαΐν»."}, {"type": "p", "text": "Απαντά του: «Ττοφή, εφάετε τον σ̆οίρον»."}, {"type": "p", "text": "Λαλεί της, «Τζ̆είν’ το πετεινάριν ίντα γυρίζει μες την αυλήν; Σφάξε το!»"}, {"type": "p", "text": "Εκάθουνταν μερόνυχτα λαλώ σου!"}, {"type": "source", "text": "Συνέντευξη Γιώργου Πριγκόπουλλου, 24 Σεπτεμβρίου 2025 και 22 Μαΐου 2026"}, {"type": "source", "text": "Κωσταντίνος Γ. Γιαγκουλλής, Οι ποιητάρηδες της Κύπρου. Προλεγόμενα – Βιο-εργογραφία (1878–σήμερα) (2005)"}]}, {"id": "song-13", "title": "Κάτω στη Ρόδον", "credits": ["Μουσική: Ανασύνθεση παραδοσιακών μελωδιών· διασκευή Συμεών Μερκούρη", "Οργανικό κομμάτι: Σύνθεση Συμεών Μερκούρη", "Στίχοι: Παραδοσιακοί", "Φωνή: Νικολέττα Δημητρίου", "Δεύτερες φωνές: Συμεών Μερκούρης, Στέλιος Παπαμιχαήλ", "Λύρα: Xριστίνα Πολυκάρπου", "Λαούτο: Συμεών Μερκούρης", "Ταμπουράς: Χαράλαμπος Παντελή"], "body": [{"type": "p", "text": "Toύτον το τραγούδιν, με διαφορετικές μελωδίες τζ̆αι στίχους, είναι ευρέως γνωστόν στον ελλαδικόν χώρον. Ήρτεν, όμως, τζ̆αι στην Κύπρον τζ̆αι ενσωματώθηκεν στην παραδοσιακήν της μουσικήν. Πρώτην φοράν άκουσα το σε μιαν ανέκδοτην ηχογράφησην που μου έβαλεν ο Θεόδωρος Μαυρής, να το λαλεί ο πατέρας του, Χριστόφορος Μαυρής που το Πραστειόν Μεσαορίας, όπως τον έγραψεν ο ίδιος σε μαγνητόφωνον (παραπάνω πληροφορίες για τον Χριστόφορο Μαυρή στην σ. [●]). Άρεσεν μου πολλά η ερμηνεία του Μαυρή τζ̆’ εμέγαλωσεν η περιέργεια μου για τούντο τραούδιν. Ετηλεφώνησα του Μιχάλη Ττερλικκά τζ̆αι, άμαν του εχάραξα την μελωδίαν, ερώτησα τον αν εξανάκουσεν τούντο τραούδιν. Είπεν μου ότι με μιαν παραλλαγμένην μελωδίαν ετραούδησεν του το ο Χαράλαμπος Δημοσθένους που την Κοντέαν, ως επωδόν[^35] σε έναν μανέν σαπαΐ (σαμπάχ), που του έπαιξεν στο πιθκιαύλιν. Ψάχνοντας περαιτέρω, ήβρα μιαν επιτόπιαν ηχογράφησην που εκάμαν οι Σπυριδάκης τζ̆αι Καρακάσης στην λαογραφικήν τους αποστολήν στην Κύπρον το 1960, με τον τίτλον «Πέρα στην άμμον στην ροδονήσιν». Τραουδά η Αντιγόνη Χαραλάμπους, 64 χρονών τότε, που την Τσάδαν της Πάφου. Η μελωδία που τραουδά η Χαραλάμπους είναι επίσης διαφορετική σε σχέσην με την εκτέλεσην του Μαυρή. Σε μιαν κουβένταν που εκάμαμεν με τον Μιχάλην Ττερλικκάν, ερώτησα τον αν μπορούμεν να πούμεν ότι τούντο κομμάτιν μπορεί να θεωρηθεί κυπριακόν. Απάντησεν μου:"}, {"type": "p", "text": "Μπορούμεν να πούμεν ότι […] που την στιγμήν που εμπεδώθηκεν τζ̆’εδιαδόθηκεν από το Πρασκειόν ως την Τσάδαν – με τες παραλλαγές της φυσικά – εντάχθηκεν μέσα στην παραδοσιακήν μουσικήν της Κύπρου. Πολλά τραούθκια ήρταν έτσι στην Κύπρον τζ̆αι δεν τα αντιγράψαν οι τότε μουσικοί, αλλά τα αφομοιώσαν το καθέναν με το κυπριακόν ύφος τζ̆αι συχνά με δικούς τους στίχους. Για να είναι καταγραμμένον τζ̆αι στο Πρασκειόν, τζ̆αι στην Κοντέαν, τζ̆αι στην Πάφον, σημαίνει ότι σε κάποιαν εποχήν επήρεν μιαν έχτασην."}, {"type": "p", "text": "Όταν τον ερώτησα τον τρόπον που εμεταφέρουνταν τούντα τραούθκια που την Ελλάδαν στην Κύπρον, είπεν μου:"}, {"type": "p", "text": "Τζ̆αι πριν την μικρασιατικήν καταστροφήν [τζ̆αι τα προσφυγικά ρεύματα που ακολουθήσαν], υπήρχαν πολλά στενές επαφές μεταξύ Κύπρου τζ̆αι Μικράς Ασίας. […] Όπως σήμερα έρκεται έναν σχήμαν που την Ελλάδαν τζ̆αι εν φέρνει ούλλους τους μουσικούς του – φέρνει, ας πούμεν, τρεις που τους βασικούς τζ̆αι βρίσκει τζ̆αι κάποιους που την Κύπρον – έρκουνταν κοππανίες που την Μικράν Ασίαν, οι οποίες επαίζασιν τότε στα καπαρέ [τα τότε κοσμικά κέντρα]. Εφέρναν, λοιπόν, τους βασικούς μουσικούς τζ̆’ επιάνναν τζ̆αι κάποιους Κυπραίους. Έναν παράδειγμαν εν’ ο μακαρίτης ο Αβέρωφ,[^36] που έπαιξεν με τούτους. […] Έπαίζαν, λοιπόν, τζ̆αι οι Κυπραίοι οι  μουσικοί επιάναν κάποια κομμάθκια που τους Ανατολίτες. Άμα, λοιπόν, επαίζαν τα καλοτζ̆αίρκα στους γάμους τζ̆αι στα παναΰρκα, επαίζαν τζ̆αι τούτα τα μικρασιάτικα σε παραλλαγμένην μορφήν σε στίχους τζ̆αι μουσικήν, για να ακούουνται τούντα πράματα με ευχαρίστησην στο αυτίν του Κυπραίου. Αφομοιώνναν τα κομμάθκια, εν τα αντιγράφαν. Τζ̆αι έτσι εμεταφέραν τα σιγά-σιγά στον λαόν."}, {"type": "p", "text": "Ο άλλος τρόπος ήταν το γραμμόφωνον – οι πιο πολλοί καφενέδες είχαν γραμμόφωνον. Ο μακαρίτης ο Μιχάλης ο Πούλλος, που έπαιζεν λαούτον, που την Αγκαστίναν, είπεν μου το ξεκάθαρα: «Επήαιννα στον καφενέν ν’ ακούσω κομμάθκια, για να πάω έσσω να τα φκάλω πά’ στο λαούτον». Εμάθθαιννεν τα τζ̆αι ο Πούλλος τζ̆αι ο Γιαννής τζ̆αι ο Κωστής, οι οποίοι επαίζαν στους γάμους. Τζ̆’ έτσι πάλε, μέσω των γάμων, εμεταφέρουνταν στο ευρύν κοινόν. Με τούντον τρόπον εμεταφέρουνταν κάποιες μελωδίες τζ̆’ εταιρκάζαν συχνά τζ̆αι άλλους στίχους."}, {"type": "p", "text": "Έτσι εικάζω πως, με τον έναν ή τον άλλον τρόπον που μου επερίγραψεν ο κύριος Μιχάλης (ή τζ̆αι τους θκυο μαζίν),  το «Κάτω στην Ρόδον» έφτασεν τζ̆αι στην Κύπρον τζ̆αι αφομοιώθηκεν στην κυπριακήν μουσικήν."}, {"type": "p", "text": "Αναφορά για την ανασύνθεσην μου τούντου κομμαθκιού εν’ οι τρεις εκτελέσεις που ήβρα τζ̆αι άκουσα. Στο τέλος των στίχων έβαλα έναν οργανικόν σκοπόν που έγραψα τζ̆αι πιστεύκω ταιρκάζει με το ηχόχρωμαν του κομμαθκιού."}, {"type": "p", "text": "Να σημειώθει δαμαί ότι ο Χαράλαμπος Παντελή που παίζει ταμπουράν σε τούντο τραούδιν επαρέπεμψεν με (μετά που εγράψαμεν στο στούντιο) σε μιαν ηχογράφησην του Σαββάκη Λάμπρου που λέγεται «Έπαρ’ τον, κόρη, τον γέρον άντραν». Εν’ σε 9/8 τζ̆αι έσ̆ει τρία δίστιχα παρόμοια με τζ̆είνα της παραλλαγής του Χριστόφορου Μαυρή. Αντί «Τούρκος», ο Λάμπρου χρησιμοποιεί την λέξην «γέρος». Στην ηχογράφησην του Λάμπρου τραγουδά ο Κυριάκος Μαππούρας."}, {"type": "source", "text": "Συνέντευξη Μιχάλη Ττερλικκά, 1 Απριλίου 2026"}, {"type": "p", "text": "Μιχάλης Ττερλικκάς, «Παραδοσιακά Τραγούδια της Κύπρου με προέλευση τη Μικρά Ασία» https://mousalyra.com.cy/wp-content/uploads/2023/02/%CE%A0%CE%B1%CF%81%CE%B1%CE%B4%CE%BF%CF%83%CE%B9%CE%B1%CE%BA%CE%AC-%CF%84%CF%81%CE%B1%CE%B3%CE%BF%CF%8D%CE%B4%CE%B9%CE%B1-%CF%84%CE%B7%CF%82-%CE%9A%CF%8D%CF%80%CF%81%CE%BF%CF%85-%CE%BC%CE%B5-%CF%80%CF%81%CE%BF%CE%AD%CE%BB%CE%B5%CF%85%CF%83%CE%B7-%CF%84%CE%B7-%CE%9C%CE%B9%CE%BA%CF%81%CE%AC-%CE%91%CF%83%CE%AF%CE%B1.pdf"}]}, {"id": "song-14", "title": "Φωνή Μαρινιωτού", "credits": ["Στίχοι & Μουσική: Παραδοσιακό", "Φωνές: Μιχάλης (Μισ̆ιέλλης) Πουλλής (1η και 3η στροφή), Συμεών Μερκούρης (2η και 4η στροφή)", "Ταμπουράς: Χαράλαμπος Παντελή"], "body": [{"type": "p", "text": "Η «Μαρινιωτού» εν’ Φωνή (παραπάνω για το πώς χρησιμοποιείται ο όρος «φωνή» στην κυπριακήν μουσικήν στην σ. [●]) με προέλευσην το χωρκόν της Αγίας Μαρίνας της Σκυλλούρας. Ένας που τους πιο γνωστούς ερμηνευτές τούντης φωνής ήταν ο Τζ̆ιαννής Πουλλής. Εγεννήθηκεν τον Σεπτέμβρην του 1914 στην Αγιάν Μαρίναν, δεύτερος που εφτά παιθκιά. Επήεν σχολείον ως την δευτέραν τάξην, τζ̆αι μετά εστείλαν τον δουλειάν στα χωράφκια. Ήταν γεωργός τζ̆αι κτηνοτρόφος στο επάγγελμαν. Έμαθεν, όμως, μόνος του να τραουδά τζ̆αι να παίζει λαούτον, τζ̆’ έκαμνεν γάμους στο χωρκόν του αλλά τζ̆αι σε γειτονικά χωρκά. Το ταίριν του στους γάμους ήταν ο χωρκανός του, τυφλός φκιολάρης Βραχίμης Σιτσ̆ιάνης. Ο γιος του Αντώνης Πουλλής, 83 χρονών, είπεν μου τα εξής:"}, {"type": "p", "text": "Τες Κυριακάες έπαιρνεν το λαούτον στον καφενέν, εβάλλαν οφτά τζ̆’ εκάμναν ζιαφέθκια. Εχόρευκεν θέμας ο τζ̆ύρης μου πολλά. Τζ̆αι έσσω μας εκάμναμεν ζιαφέθκια. Έπαιζεν το μόνος του το λαούτον, ετραούδαν τζ̆αι εδιασκεδάζαν. Ο αρφός του ο Πίσσας ετραούδαν – έξερεν πολλά τραούθκια. Ο γέρος ελάλεν τζ̆αι μανέδες, ελάλεν τζ̆αι την «Καρπασιτούν».[^37] Άμα ετραούδαν ο Τζ̆ιαννής τ’ Αντώνη, οι γεναίτζ̆ες εππελλανίσκαν πάνω του. Ήταν μερακλής πολλά. Έφκαιννεν πά’ στο παλκόνιν τζ̆αι εκάμπανιαζεν την για ν’ ανεφάνει η κορού του – ήταν το σύνθημαν."}, {"type": "p", "text": "Αναφορά για την ερμηνείαν μου ήταν μια ανέκδοτη ηχογράφηση του Τζ̆ιαννή του 1968 στο Λονδίνον. Εν’ ιδιαίτερα γλυτζ̆ιά η ερμηνεία του, με περίτεχνα μελίσματα στην φωνήν. Άμαν ερώτησα για τούντην ηχογράφησην, ο γιος του Γιώργος Πουλλής, 80 χρονών, είπεν μου ότι ο παπάς του εβρέθην στο Λονδίνον όταν επήεν να κάμει μιαν θεραπείαν για το μμάτιν του, που ετραυμάτισεν κατά την διάρκειαν γεωργικών εργασιών. Στο σπίτιν του γιου του που τον εφιλοξέναν, έπαιξεν μπουζούκκιν τζ̆’ ετραούδησεν την «Μαρινιωτούν», τζ̆αι ο  κύριος Γιώργος ηχογράφησεν τον πά’ σ’ έναν μαγνητόφωνον. Ο Τζ̆ιαννής, μετά την τουρκικήν εισβολήν του ’74, εγκαταστάθηκεν ως πρόσφυγας στον Κοτσ̆ιάτην, ως τον θάνατον του το 1997."}, {"type": "p", "text": "Μιαν ημέραν που επήαμεν να επισκεφτούμεν τον κύριον Αντώνην με τον Στέλιον, έτυχε να ’ν’ τζ̆ει̮αμαί ο αρφός του ο Μισ̆ιέλλης Πουλλής. Ετραούδησεν μας την «Μαρινιωτούν», τζ̆’ εγώ τζ̆αι ο Στέλιος είδαμεν ο ένας τον άλλον χωρίς να πούμεν τίποτε. Εσκέφτηκαμεν το ίδιον πράμαν: η φωνή του Μισ̆ιέλλη έπρεπεν να γραφτεί. Τραουδά λοιπόν την 1ην τζ̆αι την 3ην στροφήν."}, {"type": "source", "text": "Συνέντευξη Αντώνη Πουλλή, 11 Νοεμβρίου 2025"}, {"type": "source", "text": "Συνέντευξη Γιώργου Πουλλή, 18 Μαΐου 2026"}]}, {"id": "song-15", "title": "Τραούδιν του Ραάρη", "credits": ["Μουσική & Στίχοι: Παραδοσιακό", "Φωνές: Συμεών Μερκούρης, Στέλιος Παπαμιχαήλ"], "body": [{"type": "p", "text": "Αφηγηματικόν τραούδιν. Τα αφηγηματικά τραούθκια κάποτε ήταν αναπόσπαστον κομμάτιν της καθημερινότητας του Κυπραίου. Εσυνοδεύκαν τες διάφορες χειρωνακτικές εργασίες (π.χ. στα χωράφκια, θέρος κ.λπ.) για να διούν ρυθμόν στην δουλειάν, αλλά τζ̆αι για να περνά τζ̆αι η ώρα. Μάλιστα το συγκεκριμένον εκατάγραφηκεν τζ̆αι ως «Άσμα Θερισμού».[^38]"}, {"type": "p", "text": "Αναφορά μου εν’ η ερμηνεία θκυο τραουδιστών που την Γιόλου: του Νεόφυτου Χατζ̆ηνικηφόρου («Σ̆ίσ̆ης») τζ̆αι του Κώστα Ευθυμίου («Καραφκιάς»). Εκαταγράψαν τους οι Σπυριδάκης τζ̆αι Καρακάσης κατά την διάρκειαν της λαογραφικής τους αποστολής στην Κύπρον το 1960, σε επιτόπιαν ηχογράφησην στην Γιόλου. Στην αρχήν της ηχογράφησης, ο Σπυριδάκης, μετά την εκφώνησην του τίτλου τζ̆αι των συντελεστών, εξηγεί πως το «Τραούδιν του Ραάρη» το ετραουδούσαν όταν εθερίζαν. Για την θέσην των διάφορων θεριστών στην δουλειάν, γράφει η Νικολέττα Δημητρίου:"}, {"type": "p", "text": "Ο καλλύττερος θεριστής – ο μάστρος της δουλειάς – ήταν ο πρωταρκάτης. Τούτος ήταν πρώτος εις την σειράν τους θεριστάες τζ̆’ άννοιεν αντάτζ̆ιν – δηλαδή άννοιεν γραμμήν τζ̆’ εχώριζεν τους τομείς που έπρεπεν να θεριστούν. Δίπλα που τον πρωταρκάτην εστέκετουν ο κκιαγιάς, δηλαδή ο δεύτερος κατά σειράν εργάτης. Μετά εστέκουνταν οι υπόλοιποι εργάτες τζ̆αι τέλει̮α τελευταίος εμείνισκεν ο ραάρης ή λαάρης – ο ουραδάρης, δηλαδή, τούτος που εκράτεν την ουράν. Αν κάποιος άφηννεν γραμμήν αθέριστην, επεριπαίζαν τον τζ̆’ ελαλούσαν ότι άφηννεν κουρίν ή βάκλαν. Τα πιο πολλά αστεία, όμως, εγινίσκουνταν εις βάρος του ραάρη, αφού, ως ο τελευταίος, τζ̆είνος έπρεπεν να ’σ̆ει την έννοιαν ότι ούλλα μπροστά του ήταν να θεριστούν όπως έπρεπεν."}, {"type": "heading", "text": "Νεόφυτος Χατζ̆ηνικηφόρου («Σ̆ίσ̆ης»)"}, {"type": "p", "text": "Eγεννήθηκεν στην Θελέτραν γύρω στο 1902. Επαντρεύτηκεν την Γιολίτισσνα Παναγιωτούν Χατζ̆ηγιάννη, με την οποίαν απέχτησεν θκυο παιθκιά. Ήταν καλοφωνάρης τζ̆αι γνωστός τραουδιστής της περιοχής. Έπαιζεν επίσης ταμπουτσ̆άν. Ασχολείτουν με γεωργικές εργασίες τζ̆’ επήαιννεν επί πληρωμή μισταρκός να θερίζει τζ̆αι να οργώννει. Σύμφωνα με τον Χριστάκην Παπανικολάου, κοινοτάρχην  της Γιόλου, αλλά τζ̆αι σύμφωνα με μαρτυρίες πιο παλιών του, ο Σ̆ίσ̆ης ήταν ιδιαίτερα αγαπητός στην κοινότηταν τζ̆’ επρωταγωνιστούσεν στες διάφορες διασκεδάσεις. Σύμφωνα με τον πατέρα Kλεόπα Στυλιανού, άγγοναν του Σ̆ίσ̆η, ήταν γλεντζ̆ές τζ̆’ ετραούδαν στο σπίτιν, στην ύπαιθρον όταν έφκαιννεν να θερίσει, στους γάμους τζ̆αι στα παναΰρκα. Ο π. Κλεόπας αθθυμάται τον παππούν του να τραουδά στο παναΰριν που εγίνετουν στην εκκλησίαν της Αγίας Ειρήνης στην Γιόλου την ημέραν της Λαμπρής, στο οποίον εστήνναν καλύφες με φκιολάρηες. Αθθυμάται τον επίσης στο παναΰριν των Αγίων Αναργύρων στο μοναστήριν των αγίων, κοντά στο χωρκόν Μηλιού, που εμεταφέρθηκεν πιο μετά στην περιοχήν Κρομμύν. Μουσικοί του συντρόφοι ήταν συνήθως οι θκυο οικογένειες φκιολάρηων της Γιόλου: ο Σάββας Σάββα («Σαγλάμης»), οι γιούες του Αργύρης τζ̆αι Κυριάκος («Βάκανος»· λαούτον), ο Λάζαρος Iωακείμ τζ̆αι ο γιος του Χαμπής Λαζάρου (αργότερα Νιον Χωρκόν)."}, {"type": "heading", "text": "Κώστας Ευθυμίου («Καραφκιάς»)"}, {"type": "p", "text": "Εγεννήθηκεν στην Γιόλου στες 20 Απριλίου 1906, γιος του Ευθύμιου Γιαννή τζ̆αι της Βαρβαρούς Νικόλα. Ήταν ο μεγαλύτερος γιος πολυμελούς οικογένειας με τέσσερα αδέρφκια: την Κυριακούν, τον Δημήτρην, τον Πρόδρομον τζ̆αι τον Ιωάννην. Επαντρεύτηκεν την Θεοπίστην Χατζ̆ηευσταθίου που το Στρουμπίν τζ̆αι έκαμεν τρεις κόρες: την Μυροφόραν, την Σταυρούλλαν τζ̆αι την Κυριακούν. Όσον ήταν στην Γιόλου, ασχολείτουν με γεωργικές εργασίες. Σύμφωνα με την αδερφότεχνην του, Νεοφύταν Ευθυμίου, γύρω στο ’65 ο Καραφκιάς εμετακόμισεν στο Ζακάτζ̆ιν της Λεμεσού, όπου εργάστηκεν ως νυχτοφύλακας τζ̆αι ως βοηθός χτίστη. Ο Καραφκιάς ήταν καλοφωνάρης τζ̆αι ικανός χορευτής."}, {"type": "p", "text": "Η ερμηνεία των Χατζ̆ηνικηφόρου τζ̆αι Ευθυμίου, όπως τους εκαταγράψαν οι Σπυριδάκης τζ̆αι Καρακάσης το 1960, εν’ ημιτελής, αφού η ηχογράφηση κόφκεται στην μέσην του τραουθκιού. Εσυμπλήρωσα τους στίχους που τες καταγραφές που εκάμαν ο Αθανάσιος Σακελλάριος[^40] τζ̆αι ο Γ. Χ. Παπαχαραλάμπους.[^41]. Η ηχογράφηση του 1960 εν’ επίσης μουσικά ενδιαφέρουσα. Οι Χατζ̆ηνικηφόρου τζ̆αι Ευθυμίου τραουδούν έναν ντουέττον  χωρίς όργανα. Ο Καραφκιάς τραουδά πρώτος τον δεκαπεντασύλλαβον στίχον, σταθερός σε έναν ρυθμόν που επιβάλλει ο ίδιος με τες ίδιες παύσεις τζ̆αι τα ίδια γυρίσματα στην φωνήν. Ο Χατζ̆ηνικηφόρου επαναλαμβάνει τον στίχον, αλλά σε άλλην μελωδίαν με πιο «κλαψ̆ιάρικον» ύφος, «παίζει» με τον χρόνον τζ̆αι κάμνει αρκετά μελίσματα. Δύο φωνές (ντουέττον) να τραουδούν έναν στίχον σε επανάληψην με διαφορετικόν τρόπον ο καθένας εν’ αρκετά πρωτοποριακόν σε σχέσην με το τι ξέρουμεν για το π’ως ερμηνεύκουνταν τα κυπριακά τραούθκια όταν ετραγούδαν παραπάνω που ένας. Το γιατί το έκαμεν ο Χατζ̆ηνικηφόρου εν’ πιο δύσκολον να το απαντήσουμεν. Μπορεί να έθελεν να ξεχωρίσει η ερμηνεία του, μπορεί να είσ̆εν την ικανότηταν σε αντίθεσην με τον μουσικόν του σύντροφον, μπορεί έτσι να το έμαθεν. Ό,τι τζ̆αι να πούμεν εν’ εικασία. Το σημαντικόν εν’ ότι ο ένας τραουδιστής εν δεσμεύεται που τον τρόπον του άλλου, τζ̆αι δημιουργούν έναν ζωντανόν μουσικόν διάλογον. Φυσικά εν’ σημαντικόν να τονίσουμεν ότι στην συγκεκριμένην περίπτωσην ο ρυθμός εν επιβάλλετουν που όργανα, άρα επιτρέπετουν στον κάθε τραουδιστήν να το πάρει πάνω του τζ̆αι να εκτελέσει την μελωδίαν με τον τρόπον του."}, {"type": "source", "text": "Συνέντευξη Χριστάκη Παπανικολάου , 28 Δεκεμβρίου 2025"}, {"type": "source", "text": "Συνέντευξη με τον π. Κλεόπα Στυλιανού, 25 Μαΐου 2026"}, {"type": "source", "text": "Συνέντευξη με τη Νεοφύτα Ευθυμίου, 25 Μαΐου 2026"}, {"type": "source", "text": "Νικολέττα Δημητρίου, «Τραγούδια και ιστορίες του Θέρους», σημειώσεις συναυλίας στο Δημοτικό Μουσείο Χαρακτικής Χαμπή, 4 Ιουλίου 2026"}]}, {"id": "song-16", "title": "Φωνή Παφίτισσα", "credits": ["Μουσική: Παραδοσιακή", "Στίχοι: Παραδοσιακοί", "Φωνή: Συμεών Μερκούρης", "Βιολί: Παύλος Μιχαηλίδης", "Λαούτο: Στέλιος Παπαμιχαήλ"], "body": [{"type": "p", "text": "Μια που τες πιο γνωστές φωνές της Κύπρου, που προέρχεται που την επαρχίαν Πάφου (παραπάνω για το πώς χρησιμοποιείται ο όρος «φωνή» στην κυπριακήν μουσικήν στην σ. [●]). Αναφορά μου για τούντην φωνήν εν’ η ερμηνεία του Παναγιώτη («Παναής») Παναγιώτου που την Έμπαν, τωρά 94 χρονών. Ο Παναγιώτου εγεννήθηκεν στα Πετρίθκια της Έμπας στην Πάφον, στες 5 Φεβρουαρίου 1932. Επήεν σχολείον ως την τρίτην τάξη. Μετά εφκάλαν τον για να βοηθά την οικογένειαν, αφού ο ίδιος ορφανεύτηκεν που πατέραν που θκυο χρονών. Η πρώτη του δουλειά ήταν στο αλακάτιν[^42] τζ̆αι στα χωράφκια. Μετά επήεν σε μάστρον τζ̆’ έμαθεν να στρατουρά, δηλαδή να κάμνει τζ̆αι να σάζει στρατούρκα.[^43] Όπως μου έιπεν ο ίδιος σε μια κουβένταν που εκάμαμεν:"}, {"type": "p", "text": "[...] επήαιννα, έφερνα το στρατούριν του χτηνού που το Χάνιν τζ̆’ έραφκα το. Ο μάστρος του γάρου εδίεννεν μας κανέναν-θκυο πακκίρες. Για λλόου μου τότε ήταν πολλά λεφτά."}, {"type": "p", "text": "Αφού, όμως, με τον τζ̆αιρόν η χρήση των ζώων στες εργασίες αντικατα
