στάθηκεν που μηχανήματα, έμαθεν στον ίδιον μάστρον να βάλλει ψάθες πά’ στα δώματα. Ήταν επίσης λακκοτρύπης τζ̆αι ψάλτης για 55 χρόνια στην εκκλησίαν της Παναγίας της Θεοσκέπαστης στην Κάτω Πάφον. Με τούντα επάγγελματα τζ̆αι τες γεωργικές εργασίες που εν εγκατέλειψεν ποττέ, «oρθοπόδησεν», όπως μου έιπεν: «Εν έξερα γράμματα πολλά τέλος πάντων, αλλά μες την ζωήν τα πάντα έξερα»."}, {"type": "p", "text": "Όταν τον ερώτησα πώς τζ̆αι ασχολήθηκεν με το τραγούδιν, είπε μου:"}, {"type": "p", "text": "Η μανία μου ήταν να τζ̆οιμούμαι, να ξυπνώ τζ̆αι να τραουδώ. Ήταν η μανία μου. Επήαιννα στον καφενέν το δείλις τζ̆αι έσυρνα την [την φωνήν του] πάνω που το χωρκόν στο πάνω σκαλίν. «Άκου τον πελλο-Παναήν», ελαλούσασιν. Εγιώ το θκιολίν μου."}, {"type": "p", "text": "Συγεγκριμένα για την «Παφίτισσαν Φωνήν»:"}, {"type": "p", "text": "Τες φωνές άκουσα τες που την μάναν μου. Τζ̆αι άρεσκεν μου ν’ ακούω. Εν τζ̆αι είχαμεν κανέναν να μας βοηθήσει. Ήμουν μιτσής, πόσον ήμουν, τζ̆αι εκάμνασιν τότε του Κατακλυσμού στην θάλασσαν [λιμάνι Κάτω Πάφου], τζ̆ει κάτω, τζ̆αι άκουσα κάποιον Φίλιππον που την Γαλαταρκάν να τραουδά την «Παφίτιτζ̆ην». Επαρπάτουνμ ετζ̆οιμούμουν η έννοια μου ήταν να μάθω τούτην την φωνήν."}, {"type": "p", "text": "Ο Παναγιώτου επρωταγωνιστούσεν τζ̆αι στα ζιαφέθκια στον «καφενέν του Πετριθκιώτη του θκιολάρη στο Χτήμαν»:[^45]"}, {"type": "p", "text": "Κάθε νύχτα. Κονιακκούιν, τραουθκιά. Επήαιννα στον καφενέν του Πετριθκιώτη του θκιολάρη. Εκάμαμεν το χόιν μας. Επερνούσαμεν ωραία. Έπαιζεν τζ̆είνος τζ̆αι ετραούδουν εγιώ. Ζωή χαρισάμενη. Eσυναούμαστον, ο ένας έφερνεν το έναν, ο άλλος το άλλον τζ̆αι εκάμναμε μεζούιν. Πο’ ούλλα είχαμεν."}, {"type": "p", "text": "Μεταξύ άλλων, το 1973 ο Παναγιώτου εμφανίστηκεν στην εκπομπήν Μουσική και χοροί της Κύπρου του ΡΙΚ, που επαρουσίαζεν ο Ανδρέας Στυλιανού, τζ̆’ ετραούδησεν την «Παφίτισσαν» με μουσικούς τον Γεώργιον Αβέρωφ (φκιολίν) τζ̆αι τον Χριστόδουλον Πίπην (λαούτον). Επίσης εσυμμετείχεν ως τραουδιστής στην παραγωγήν του ΟΘΑΚ[^46] Αγάπες τζ̆αι καμοί (1967), σε σκηνοθεσίαν του Γιώργου Φιλή."}, {"type": "p", "text": "Η ερμηνεία του Παναγιώτου στην «Παφίτισσαν», η διάρκεια της αναπνοής του τζ̆αι τα γυρίσματα του εν’ ιδιαίτερα τζ̆αι αρκετά ξεχωριστά που άλλες ερμηνείες τούντης φωνής. Τούτη ήταν τζ̆αι η αναφορά μου τζ̆αι επροσπάθησα όσον εμπόρουν να κρατήσω τούντα στοιχεία. Να πω πως άμαν έψαχνα να ’βρω αρχειακόν υλικόν για τον Παναγιώτου, ήβρα την εκπομπήν Μουσική και χοροί της Κύπρου του ’73, στην οποίαν εμφανίζεται ο Παναγιώτου τζ̆αι τραουδά, στην «Παφίτισσαν Φωνήν», το δίστιχον «Οι βρύσες εξεράνασιν τζ̆αι τα πουλιά ’διψάσαν, τζ̆αι ήπιαν που τ’ αμμάθκια μου δάκρυα τζ̆’ εξεδιψάσαν». Όταν τελειώννει την συγκινητικήν του ερμηνείαν ο Παναγιώτου, διαδέχεται τον στους αντρικούς καρτζ̆ιλαμάες με το χορευτικόν του συγκρότημαν «ΣΟΥΣΤΑ» ο παπάς μου."}, {"type": "source", "text": "Συνέντευξη Παναγιώτη Παναγιώτου, 13 Ιουλίου 2025"}]}, {"id": "song-17", "title": "Τρεις καλοήροι κρητικοί", "credits": ["Στίχοι & Μουσική: Παραδοσιακό", "Φωνή: Συμεών Μερκούρης", "Λύρα: Στέλιος Παπαμιχαήλ"], "body": [{"type": "p", "text": "Παραδοσιακόν αφηγηματικόν τραγούδιν, που εταξίδεψεν σε ούλλην σχεδόν την Ελλάδαν με αρκετές παραλλαγές σε στίχον τζ̆αι μουσικήν. Παραλλαγές υπάρχουν σε Μικράν Ασίαν, Κρήτην, Κάρπαθονν, Κάλυμνο, Τήλον τζ̆αι Κύπρον, καθώς τζ̆αι σε αρκετές περιοχές της ηπειρωτικής Ελλάδαςν όπως Πελοπόννησον τζ̆αι Θράκην."}, {"type": "p", "text": "Αναφορά μου στην φωνήν εν’ η ερμηνεία του Θεόδουλου Καλλίνικου (παραπάνω για τον Καλλίνικο, στην σ. [●]), όπως ηχογραφήθηκεν στο ΡΙΚ στες αρχές της δεκαετίας του ’60, στο πλαίσιον μιας σειράς ηχογραφήσεων με τίτλον Κυπριακοί χοροί και τραγούδια."}, {"type": "p", "text": "2"}]}]}, "en": {"intro": ["My inspiration for the album \"To Homan\" came from interpretations of Cypriot traditional songs I heard performed by \"practical\" musicians and singers — that is, without formal musical training — most of whom were active in the first half of the 20th century. In the notes for each track below, I explain who these performers were and where I found the recordings I used as my reference. Where I felt it was useful, I have also included commentary on the piece itself (for instance, where its title comes from) and on how I approached its interpretation, arrangement/recomposition and orchestration.", "Beyond a short biography of each of the musicians and singers I used as a reference, you will also find some of the stories they shared with me themselves, if they were alive, or their surviving relatives shared. At first, I began researching the lives of these musicians and singers purely for my own understanding. I felt that if I was going to arrange, recompose or interpret something using these people, their performance or their verses as my reference, I needed to learn what I could about them. I sought out the performers themselves, where they were still living, or their children, grandchildren or fellow musicians, where they were not, in order to interview them. In total I spoke with nineteen interviewees in Nicosia, Paralimni, Liopetri, Avgorou, Deryneia, Xylofagou, Limassol, Empa and Yiolou. Although I began each interview with specific questions in mind, the conversation usually turned into a warm exchange that flowed on its own. I learned about the lives of these musicians and singers, who lived through a daily reality very different from the one my generation knows, at least. I also tried to gather testimonies about their art, which took centre stage at celebrations, festivities and feasts, but which also held a distinct place in grief and sorrow.", "At first glance, one might say that the stories I set out in the notes for each track have nothing to do with the piece being presented. But as I gradually gathered these stories, I realised that my research had stopped being merely adjacent to the album and purely for my own information, and had begun to take on a meaning of its own for the album's listener too. Just as the interpretation of a traditional song — especially by a contemporary musician — is informed by whatever information, biographical or otherwise, one has about one's reference, so too, I believe, will today's listener understand this album better by reading the stories I have included for each track. It will open a window onto a Cyprus of another era, with the musicians and singers themselves as its protagonists.", "The great wager for me, then, becomes this: once the reader has stepped through that window, to let themselves become a listener and hear this music the way we understood it and recorded it in 2026, with musicians who are, for the most part, children of the 1980s and '90s. If we manage to move the listener, then we will have succeeded in presenting these seventeen pieces not as musical relics, but as a living tradition relevant to today.", "Enjoy the listening.", "Simon"], "songs": [{"title": "Sousa's Song (Agia Marina Skyllouras)", "credits": ["Lyrics & Music: Traditional", "Voices: Antonis Poullis (1st & 4th couplet), Simon Mercouris (2nd couplet), Stelios Papamichael (3rd couplet)"], "body": [{"type": "p", "text": "I first heard this song from Antonis Poullis, 83 years old, at his home in the Apostolos Andreas refugee settlement in Latsia. I visited him one day to interview him about his father, Yiannis Poullis, one of the best-known singers and laouto players of Agia Marina Skyllouras (more on Yiannis on p. [39]). Antonis, shaped by his family environment, learned to sing and to play his village's melodies and songs on the laouto, and like his father, played at weddings in Agia Marina and the neighbouring villages."}, {"type": "p", "text": "During the interview, after he sang me the “Marina Voice,” he said: “Shall I tell you a Sousa song too? The girls used to sing it when they hung the swings at Easter.” I imagined he would sing the well-known Sousa song (“My God, if only Easter would come”). Instead, he sang me this one. As he sang, he made a small pause before the second-to-last syllable of each half-line, which caught my attention. At first I thought it was simply to catch his breath. When he finished, I asked whether the pause was deliberate, a part of the performance itself. He answered:"}, {"type": "verse", "lines": ["“That's right! That's how a swing moves, son [as he spoke he swayed his shoulders side to side, mimicking the pendulum motion of a swing]. When it reached the very top, it paused a little before swinging back down. The girls stood four to a swing, and to keep time with the swing's rhythm as they sang, they paused a little too [meaning the pause].”"]}, {"type": "p", "text": "I left him that day quietly humming Mr. Antonis's Sousa song to myself. A few days later, when I went to see him again, I asked if he would like to come and record it in the studio. He agreed, and so the first and last couplet are sung by him. When I was thinking through the running order of the album, I felt that Mr. Antonis's voice, with its welcome (“May no stone crack in the house we sit in, and may its owner live a thousand years”), should be the very first voice a listener hears. For me, Mr. Antonis is the embodiment of “the soil” itself: the living, practical musician on whom the next generation takes root and grows."}], "sources": ["Interview with Antonis Poullis, 11 November 2025"]}, {"title": "The Slave", "credits": ["Music: Traditional; arranged by Simon Mercouris", "Lyrics: Traditional", "Voices: Simon Mercouris, Stelios Papamichael", "Lyra: Stelios Papamichael", "Laouto: Simon Mercouris"], "body": [{"type": "p", "text": "“The Slave” is a narrative song, sung by Lefteris Oikonomou (“Stekkos”) for James Notopoulos in Paralimni in 1953. The Greek-American James Notopoulos began a folklore expedition in 1952 across mainland Greece and the islands of Naxos, Crete and Cyprus. On 20 June 1953 he made a series of field recordings in Paralimni, among which, amid others, he recorded Stekkos singing “The Slave.”"}, {"type": "p", "text": "“The Slave” tells the story of a newly married man taken into slavery abroad, who never gets the chance to enjoy his young bride. He returns after twelve years and, with the help of his father (who does not recognise him), learns that his beloved is about to marry another man. He manages, however, to stop the wedding in time, as his beloved, hearing from afar, recognises the neighing of his horse. The plot resembles the song “O Morogiannos,” which used to be sung on Easter Monday."}, {"type": "p", "text": "Lefteris Oikonomou Stekkos was born in Paralimni in 1915, son of Dimitris Oikonomou (Stekkos) and Eleni. He married Despina and had five children: Eleni, Poulcheria, Dimitris, Solomos and Yiorgos. He worked the land in his orchard and fields at Protaras, in the Vrysi and Laxia areas, and in Varosi, in the Laxi area. He had a fine voice and excelled at narrative songs and manedes."}, {"type": "p", "text": "His son Solomos, in a conversation we had about his father, remembers him singing the lengthy song “Of Our Lady of Kykkos” at the vespers of the Assumption (14 August) in the church of Ayios Georgios. He remembers him singing intensely at work too, when ploughing or threshing. According to his son, Lefteris also had a gift for tsattisma — extemporised sparring verse — and for improvised love couplets. His main sparring partner was Pavlos Pittatzis, who was also his best man (more on Pavlos on p. [15]). Mr. Solomos says:"}, {"type": "verse", "lines": ["“We were children and used to run after them to watch, at weddings and village festivals, at the Easter shelters and the feast of St. George of the Sowing.”"]}, {"type": "p", "text": "Musicians who often accompanied Stekkos at festivities were Yiorgos Kosti Poyiatzis and Christakis Pittyris on the violin, and Nikolas Mouaimis (Maimis), Dimosthenis Zanettou (of Mouzoura) and Lefteris Mertakkas (Lefteras) on the laouto."}, {"type": "p", "text": "Mr. Solomos told me the following comic sparring exchange between his father and Pittatzis. His father said to him:"}, {"type": "verse", "lines": ["“In my own yard / I keep a wife — or is it a bird? / I keep it tame / so that when I go out it won't fly off, / and when I come home from the field / I'll find it there, penned in.”"]}, {"type": "p", "text": "Ever quick-witted, Pittatzis answered:"}, {"type": "verse", "lines": ["“That bird of yours will fly off regardless — / so that it may enjoy the cage, the roost and the place.”"]}, {"type": "p", "text": "Stekkos was also a highly capable dancer."}, {"type": "p", "text": "The song “The Slave,” as Stekkos sang it for Notopoulos, is narrative, free of fixed rhythm, and unaccompanied. Our arrangement opens with a free-metre introduction of voice and a sustained drone on the lyra, close to that narrative style. It then moves into a syrtos rhythm (2/4) with laouto and lyra. The vocal melody, and the lyra that follows it, is a variation on Stekkos's performance; we tried, however, to preserve certain elements of his interpretation, such as the sweet ornamentation of his voice, since his was our main reference. I would not say our arrangement is in a strictly Cypriot style, though — it carries elements of other island musical traditions close to our own."}], "sources": ["Interview with Solomos Oikonomou, 6 June 2026"]}, {"title": "Digenis Breathes His Last", "credits": ["Lyrics & Music: Traditional", "Voice: Simon Mercouris", "Laouto: Stelios Papamichael"], "body": [{"type": "p", "text": "An excerpt from the akritic song “Digenis and Death,” sung in the Poetari (Bard's) Voice (more on the Voices on p. [8]). Akritic songs are a category of the long narrative songs of Cyprus that were an inseparable part of Cypriot daily life until roughly the 1960s. Michalis Tterlikkas writes:"}, {"type": "p", "text": "“There were activities that these narrative songs did not merely accompany, but for which they were actually necessary, both to pass the time and to give rhythm to the work. Such activities were work in the fields, on the threshing floor, at the harvest, night-watching over crops, and the long cold winter nights by the hearth, without radio, television or the internet.”"}, {"type": "p", "text": "In popular tradition, Digenis appears as a legendary hero with superhuman powers. According to popular imagination, it was he who, chasing off Saracens, pressed his hand upon a rock and left the imprint of his five fingers on its summit — which is how the Pentadaktylos (“Five-Fingered”) mountain range got its name. It was he, too, who hurled the Rock of Aphrodite at Saracen pirates trying to land on Cyprus, to destroy their ships. And it was he who wrestled Death itself on marble threshing floors for “three nights, three days.” The field and studio recordings of this narrative song made so far all concern that battle with Death, when Death comes down to the village fair seeking “our best man” to wrestle and take. The excerpt I chose to sing follows the story chronologically after that battle — the moment when the hero is breathing his last."}, {"type": "p", "text": "I was drawn to this particular passage because it shows the hero's human side. He is dying in his bed, he wants his friends and neighbours near him in these hard hours, he wants to tell the world of his feats (his battle with the Saracen, for instance) and build his legacy. But of course, in the end, he cannot escape death. Even Digenis, folk imagination's superhero, cannot alter his fate. I find courage in this deconstruction of the hero's superhuman side — which is why I chose this particular excerpt of the song. If Digenis dies like any ordinary mortal, then perhaps we ordinary mortals too may hide a “Digenis” within us: the capacity to fight through life's trials with “superhuman” powers we forget, in our daily lives, that we possess."}, {"type": "p", "text": "As we recorded it, the song uses six variations of the Poetari Voice melody. The laouto sometimes follows the voice melodically, sometimes acts as a drone, and sometimes ‘comments’ improvisationally."}], "sources": ["“Traditional Music of Cyprus: Creation, Preservation, Dissemination, Reintegration” (June 2021), Michalis Tterlikkas, mousalyra.com.cy"]}, {"title": "Cursed Voice", "credits": ["Lyrics & Music: Traditional", "Voices: Simon Mercouris (2nd & 4th couplet), Stelios Papamichael (1st, 3rd & 5th couplet)", "Laouto: Simon Mercouris", "Lyra: Stelios Papamichael", "Tambourine: Konstantina Xenofontos"], "body": [{"type": "p", "text": "“Cursed Voice” is one of the “Voices” of Cyprus. In Cypriot traditional music, “Voices” are what we now call specific melodies onto which improvised couplets or short verses are sung — the words are subordinate to a pre-existing melody. “Cursed Voice” is a Voice from the Paphos district that has been recorded at different times under different names. It was recorded by the Academy of Athens folklore expedition under Spyridakis and Karakasis in 1960, in a field recording at Yiolou, as “Yiolitissa Voice.” The musicians were Argyris Savva (violin) and Kyriakos Parperis, or Vakanos (laouto), and the singers were Dimitris Fettas, Charalambos Panayiotou and Neofytos Chatzinikiforou. This was followed by the field expedition of the Peloponnesian Folklore Foundation (1978–85) under Foivos Anoyianakis, which recorded it under the title “Erotika” in Nio Chorko. The musicians then were Chambis Theori (voice and tambourine) of Nio Chorko Polis and Chambis Lazarou of Yiolou (later a resident of Nio Chorko; violin). Christos Sikkis included it in 1998 as “Voice of Polis Chrysochous” in the collection Greek Akrites – Cyprus (1998). In 2008 Michalis Tterlikkas recorded it on his album Cypriot Voice – Welcome, Our Strangers, under the title “Cursed Voice.”"}, {"type": "p", "text": "On the question of the name of this Voice, Michalis Tterlikkas told me the following:"}, {"type": "p", "text": "“The testimony that settled the naming question for me came when I went with Panikkos Chrysanthou to Kinousa to find an old man — Matthaios Papachristodoulou, who had been a chanter — who used to sing this Voice. I interviewed him and then it came time for him to sing. He said to me, ‘Whatever you like.’ ‘No, you sing,’ I said. He said, ‘Shall I give you a Cursed one?’ That is the decisive testimony that admits no doubt. No one had suggested a name to him. He said it on his own. And then he sang it for me. The question then became: ‘Why Cursed?’ Until Neofytos Konstantinou [Argyrou] of Letympou sang us, in 2015 — he was a dancer and violinist — the following couplet: ‘May my bones become distaff-thread like a spindle; I will not give you up, you cursed one.’ One of the ways these Voices got their names was through a single characteristic line.”"}, {"type": "p", "text": "The lyrics of the 1st, 2nd and 3rd couplets we recorded are traditional, taken from a Centre for Scientific Research recording of the early 1960s, narrated by Kostas Ioannidis and sung by Agapios Zakas of Pegeia. The 4th couplet was sung by Chambis Theori to Michalis Tterlikkas (according to his own account), and the 5th is the one spoken by Neofytos K. Argyrou of Letympou, which also solves the mystery of the Voice's name. As for the music, our reference was the melodic lines of the violinist Chambis Lazarou in the Peloponnesian Folklore Foundation recording. Orchestrally, I chose the lyra instead of the violin, because to my ear it gives a more ‘grounded’ melodic texture that I felt suited this Voice — mainly because these Voices are sung loudly and with intensity, and the lyra comes in between to sweeten the whole."}], "sources": ["“The Cypriot Voices Through the Course of Time,” Michalis Tterlikkas, mousalyra.com.cy", "Interview with Michalis Tterlikkas, 1 April 2026"]}, {"title": "Manes Balos, First", "credits": ["Lyrics & Music: Traditional", "Voice: Simon Mercouris", "Violin: Pavlos Michaelides", "Laouto: Stelios Papamichael"], "body": [{"type": "p", "text": "The term “balos” in Greece is usually used to describe a mixed dance (man with woman), in 2/4 time. In Cyprus, however, the “balos” is a song, not a dance, and exists in two variants (first and second). The balos comes after the fourth kartzilamas, and is in fact sometimes called the fifth kartzilamas (or antikrystos, “face-to-face” dance). It is in the rast mode and has melodic phrases similar to the Cycladic balos, but in 7/8 time. In the old days, the couple would dance for as long as the violin played the melody. When the melody ended, the dancers would stop, and one — or both, if they were skilled — would sing a long, slow, mane-like couplet. If the dancers could not sing, the musicians would replace the balos with another song, or with a rhythmic taximi played on the violin. Nowadays, a balos is rarely sung after the kartzilamas dances."}, {"type": "p", "text": "Cypriot balos songs share a lovely paradox: a particularly cheerful melody on the violin and a ‘bouncy’ rhythmic feel, paired with a couplet whose meaning is usually a melancholy love lament, or a pessimistic philosophical or existential thought, together with the slow, drawn-out, plaintive vocal delivery of the mane singer. To my ears, it is a musical laughter through tears."}, {"type": "p", "text": "My reference for this piece, vocally, is the performance of Kyriakos Christofi Lofitis, as recorded by Cyprus Radio (RIK) in 1964, with musicians Kostas Papadopoullos (violin) and Vasos Pissourios (laouto). The order in which we present the melodic themes was decided together with Pavlos, who plays violin on this piece."}], "sources": ["Georgios Averof, The Folk Songs and Dances of Cyprus (1989)"]}, {"title": "The Wedding Crowning (Paphian Syrtos)", "credits": ["Music: Traditional; arranged by Simon Mercouris", "Lyrics: Traditional; following the performances of Antonis Chatziachilleos (1st & 2nd verse), Xenis Patsalos (3rd verse), Pavlos Pittatzis (4th verse)", "Voice: Stelios Papamichael", "Second voices: Simon Mercouris, Pavlos Michaelides", "Violin: Pavlos Michaelides", "Laoutos: Charalambos Panteli, Simon Mercouris"], "body": [{"type": "p", "text": "Theodoulos Kallinikos recorded this song in his book Cypriot Folk Muse (1951), in Byzantine and Western musical notation, under the title “Paphian Syrtos,” as he heard it in 1935 from the violinist Antonis Chatziachilleos (more on Kallinikos on p. [19]). Although it was, as far as I know, never recorded, I consider it a diamond of Cypriot music. I used Kallinikos's melodic lines as a base, but, applying limited improvisation, arranged it slightly to suit my own sense of the piece. To the lyrics Kallinikos recorded, I added two much-loved short verses on the same theme: the theme of a passion so fierce it breeds madness, when the poet's beloved is stolen away by a third party."}, {"type": "heading", "text": "Antonis Chatziachilleos"}, {"type": "p", "text": "The first and second verses are the lyrics Kallinikos recorded from Antonis Chatziachilleos, more widely known by his nickname “Vlokkos.” Vlokkos was born in Chlorakas in 1907, a child of a large farming family with eight siblings; his father was Achilleas and his mother Panayiota (Panayiotou). He married Eleni Pistenti in 1927 and had seven children, four daughters and three sons — one of whom was the also well-known violinist Nikolas Antoniou Violaris. Vlokkos went to school only as far as the second grade of primary school, and afterwards worked as a builder and later as a contractor. In the early 1960s he also opened a coffee-house to boost the family's income. He was, of course, also a violinist, one of the best known in Paphos at the time. According to his son, the 87-year-old Andreas, himself a musician (drums), Vlokkos's teacher was the violinist Theodoros David, with whom he studied for a year and a half, despite being ‘practical’, i.e. without formal training. As Mr. Andreas told me, despite this:"}, {"type": "verse", "lines": ["“He married off, without exaggeration, half of Paphos. My brother [Nikolas] studied music formally, and although he was very good, he never had the sweetness of my father's bowing.”"]}, {"type": "p", "text": "Mr. Andreas, who helped his father in the coffee-house, remembers it turning into a music school between orders:"}, {"type": "verse", "lines": ["“There, where the hearth was — not with charcoal though, with wood — we would light coals and brew the coffee there. There were three or four little boys from Kissonerga my father was teaching violin. He'd take and bring the coffees, and in between he'd show his pupils how to play.”"]}, {"type": "p", "text": "According to Mr. Andreas, Vlokkos's coffee-house was also often the venue for festivities:"}, {"type": "verse", "lines": ["“At Easter he'd invite my uncle Christodoulos, ‘the Paphian’ [Vlokkos's brother and well-known shadow-puppeteer], who had a great voice. My father played violin, he sang, and my other uncle Chambis, who lived in Empa, sang too [...] and the whole of Chlorakas would come in fancy dress to the coffee-house to make merry.”"]}, {"type": "p", "text": "Mr. Andreas, then a primary school pupil, also remembers the festival of “Ktima” (the feast of Prophet Elijah), held on the boundary of Chlorakas and Ktima. They would build a festival shelter, and Vlokkos would play, with the laouto player Christakis of Armou (known as “Roussis” or “Diplosheilos”), with poet-bards such as Charalambos Azinas, one of the best known in Cyprus at the time, and the one they called “Kleiomenos” also present. As was the custom, whoever built the shelter at the festival would engage them."}, {"type": "p", "text": "Another laouto player who performed with Vlokkos was Andreas Neofytou (“Koutsos”) of Kato Paphos. Mr. Andreas also described to me a charming incident at a wedding his father played, with Koutsos:"}, {"type": "verse", "lines": ["“A certain Michalakis Omirou was getting married in our village, around 1945. We were small, my brother and I, and we always used to go and sit in front of our father while he played the wedding. This man [Michalakis] married a girl called Eirenoulla from Chios. They had made a stop in Cyprus on their way to Greece, and Michalakis fell in love with Eirenoulla. But the laouto player Andreas fell in love, at that same wedding, with a cousin of Eirenoulla's called Konstantia, and taunted her while she danced, saying:”", "“A basin full of rose-water, brimming to the top — / let me wash you so you may bathe, you body of pure gold.”"]}, {"type": "heading", "text": "Xenis Pieretti (Patsalos)"}, {"type": "p", "text": "The fourth verse is by Xenis Pieretti (Patsalos). Patsalos (1901–84) was a poet and singer from Paralimni who never went to school. From childhood he worked the land and also herded animals. “Patsalos” was a nickname inherited from his father Andreas, who had blotches (“patsalia”) on his face; the name stuck to him too: Xenis tou Patsalou. He began singing love songs and improvising verse at a young age, at feasts, village fairs and festivities, and also in the poetic contests of the Kataklysmos (the Flood Festival) in Varosi and Larnaca. In 1978 he published his only poetry collection, titled Poems."}, {"type": "p", "text": "Kyriakos Chatziandreou (Patsalos's great-grandson) told me a very moving story about his ancestor, which he heard from the 93-year-old Despina Sardalou (“Tsiakkou”) of Paralimni, who was herself an eyewitness. Patsalos lost his eldest daughter, Myrofora, at a young age, and in a chance encounter with Christos Tsissios (another Paralimni singer), the two of them ‘challenged’ each other in couplets shaped like a lament, prompted by her death. Tsiakkou recounts: it happened during a wake, right in front of her house on the way to the church, some nine days after the burial, when Patsalos and his wife Malamatou were on their way to the grave to commemorate their daughter. Tsissios, arriving from the opposite road and unaware of the news, saw Patsalos coming down dressed in black mourning, carrying a basket, held by the arm by his weeping wife, and asked what had happened to him. On learning that Patsalos's eldest daughter had died the previous Sunday and that this was her memorial, Tsissios was stunned, and, comforting Patsalos, the two men exchanged couplets of grief and consolation on the spot. Tsiakkou, recalling it decades later, says she was so overcome by the scene that she shut herself indoors for two days and could barely eat."}, {"type": "heading", "text": "Pavlos Pittatzis"}, {"type": "p", "text": "The third verse is by the also Paralimni-born Pavlos Pittatzis. Pittatzis was born in Paralimni on 28 March 1926, into a very poor family of seven siblings. His father, Michalis Pittatzis, died young, and his mother, Maria Strati (“Pittakou”), made and sold sun-dried tomato paste in Varosi's grocery shops to raise the children. Pittatzis went to school only as far as the third grade, taken out because the family was poor and needed him to work. At nine he became an orchard-hand; at twenty-two he became a customs porter (“tourkopoullos”), and in 1961 took a job as a dock-worker in the port of Varosi. According to his daughter Eleni, with whom I spoke about her father, Pittatzis was influenced as a singer by his own father, who also used to sing. Pittatzis took part in poetic contests, at Varosi and at the Kataklysmos, distinguishing himself both in tsattisma and in love verse. He was also a fine dancer. His daughter Eleni describes him as a bon vivant, cheerful, and “a man of the world.” She recalls childhood scenes of village singers gathering at the local coffee-houses of Paralimni — among them Pieretis, Ttakkas, Kouvaros and Prigkopoullos, well-known singers of the Kokkinochoria villages — and remembers her father once, in high spirits at a festival dance, lifting an entire table laden with brandy and food with his teeth and dancing with it balanced, still moving to the syrtos rhythm."}, {"type": "p", "text": "Pittatzis met the poet George Seferis when Seferis visited Cyprus in 1954, at a gathering held at the family club of Kyriakos Paralimnitis, where Pittatzis danced and sang with his harp — his “Kassiani.” The violinist was Antonis Kikas and the laouto player Michail Chamalis. Seferis wrote in his notes about Pittatzis: ‘Love songs. Eh, eh!... (prelude). The young poet-bard and dancer (a young Turkish-Cypriot) [meaning Pittatzis]. An impression. Poetry with musical accompaniment... This is how I imagine Erotokritos...’"}], "sources": ["Interview with Andreas Chatziachilleos, 25 May 2026", "Nikoletta Dimitriou, The Cypriot Violinist: An Oral History of a Professional Class in the Twentieth Century (2022)", ""]}, {"title": "Yiannis's Karpasitou (Komitissa Voice)", "credits": ["Lyrics & Music: Traditional", "Voice: Simon Mercouris", "Second voices: Stelios Papamichael, Charalambos Panteli", "Tambouras: Charalambos Panteli"], "body": [{"type": "p", "text": "Michalis Tterlikkas, on his album Cypriot Voice – On the Threshold of Time (2002), recorded this Voice as “Komitissa Voice.” We spoke with Antonis Poullis of Agia Marina Skyllouras, son of Yiannis Poullis (more on Yiannis on p. [39]), at his home. Once our conversation was done, he started to sing. After singing me the “Marina Voice” (see p. [●]), he asked if I'd like him to give me a “Karpasitou” too. It struck me as odd, because the Voice he then sang was not the well-known “Karpasitissa Voice” I knew, but the “Komitissa,” as Tterlikkas had written it on his album. Discussing this with Mr. Michalis, he told me he had encountered the same confusion when he himself interviewed Yiannis: the old man had sung it to him the same way, and Tterlikkas, being from the Kapoutin area near Morphou, assumed it came from the village of Karpasia, near Agia Marina. By chance, one day rehearsing with Michalakis Ilia — son of Nikos Ilias, a violinist from Koma tou Yialou — Tterlikkas played him a melody that pointed him to the “Karpasitissa” Yiannis had actually sung, and he found it in Sozos Tombolis's book under “Komitissa Voice,” very close to Yiannis's version. So, in a way, Yiannis had been right — it is indeed a Voice from the Karpas."}, {"type": "p", "text": "I also asked Yiorgos Poullis, Yiannis's son, why the people of Agia Marina call the “Komitissa” the “Karpasitissa,” and he said Yiannis used to be called to play weddings in the Karpas area, and probably brought the melody back with him. His brother Michalis Poullis remembers that many people in Agia Marina had economic ties with the Karpas, carrying sand and manure by truck to Karpas orchards, and one of them may well have heard the “Komitissa,” liked it, and brought it back to Agia Marina, where it became well known, according to Mr. Yiorgos, and many used to sing it. My reference for this recording is Yiannis Poullis's own performance, as recorded by his son Yiorgos on tape in London, in 1968."}], "sources": ["Interview with Michalis Tterlikkas, 1 April 2026", "Interview with Yiorgos Poullis, 18 May 2026", "Interview with Michalis Poullis, 1 August 2026"]}, {"title": "Lenou", "credits": ["Music: Traditional; arranged by Simon Mercouris", "Instrumental section: Composed by Stelios Papamichael", "Lyrics: Traditional", "Voice, lyra: Stelios Papamichael", "Laoutos: Simon Mercouris, Stelios Papamichael"], "body": [{"type": "p", "text": "“Lenou,” or “Lenoukkou,” is a traditional song that Theodoulos Kallinikos recorded, both music and lyrics, from Trikomo in 1940, and published in his collection Cypriot Folk Muse (1951). He recorded it with a Byzantine choir on Cyprus Radio (RIK) in the early 1960s, as part of a recording series titled “Cypriot Dances and Songs.”"}, {"type": "p", "text": "Theodoulos Kallinikos was born on 5 May 1904 in Trikomo, Mesaoria, and died at the age of 100. In 1921 he moved to Nicosia and studied for four years under the celebrated teacher of Byzantine music Stylianos Chourmouzios. In 1925 he founded a school of Byzantine music in Prastio, Mesaoria. In December 1929 he was appointed second chanter at Ayios Savvas in Nicosia. In 1933 he went to Athens, where he attended the National Conservatory. There he recorded five 78 rpm discs, ten Cypriot traditional songs in total, for His Master's Voice (HMV); they were released in 1934 and, by his own account, sold 75,000 copies by 1939. Beyond his recordings, Kallinikos gathered a treasury of around 150 traditional songs on his travels through Cypriot villages, some of which he published in Cypriot Folk Muse in 1951, in both Byzantine and Western notation. In 1935 he succeeded his own teacher, Stylianos Chourmouzios, as head chanter at the Cathedral of Ayios Ioannis in Nicosia, a post he held until his death in 2004. In 1977 the Church of Cyprus honoured him with the title “Archon Protopsaltis of the Church of Cyprus,” for his contribution to Byzantine music and to Cypriot folk song; he was also honoured by the Academy of Athens in 1978."}, {"type": "p", "text": "I arranged this piece in 9/8 time (instead of the composite 7/8 and 11/8 rhythm Kallinikos notated for RIK), placing emphasis on a rhythmic drive I felt was latent in it when I sang it. I used lyra instead of violin, and two laoutos. The melody on the lyra and the lead laouto is also slightly varied from Kallinikos's transcription. In a rehearsal with Stelios, once I'd shown him the song and we'd played it through a little, he carried on past the lyrics into an instrumental theme of his own composition. I was thrilled when I heard it — it was as if that theme had been written to order for “Lenou.” So Stelios's instrumental became part of our arrangement. As with “The Slave,” although we used Kallinikos's performance as our initial reference, our arrangement carries an air of other traditions close to our own, and I would not call it strictly Cypriot."}], "sources": ["Radio programme “Radioskopio” with Kleitos Ioannidis, RIK, 23 November 1979"]}, {"title": "The Merchant and His Thieving Brother", "credits": ["Music: Traditional (arranged by Simon Mercouris)", "Lyrics: Traditional", "Voices: Simon Mercouris, Stelios Papamichael", "Lyra: Stelios Papamichael", "Double bass: Dimitris Pichas"], "body": [{"type": "p", "text": "A classic example of a long narrative song, sung (among other occasions) during the harvest to give rhythm to the work (more on narrative songs on p. [6●]). There are many variants, in both words and melody, of the Merchant's story. My reference is the performance of Andreas Christou Pittyris, as recorded by James Notopoulos in 1953 in Paralimni (more on Notopoulos's folklore expedition on p. [4])."}, {"type": "p", "text": "Pittyris was born in Ayia Napa on 11 November 1916 and died at 105. He later moved to Paralimni, where he married Ifigeneia Meze and had eight children. He worked the land as an orchard-hand. From the age of thirteen he took lessons in Byzantine music and, once in Paralimni, chanted in the church of Ayios Georgios for eighty years. He learned the laouto from a master, a Michalis in Varosi, and played weddings professionally. In a conversation we had, his daughters, Margarita Dimitroudiou and Eleni Sialouta, told me: ‘He loved chanting and the laouto so much. We remember him picking up the laouto to play and to chant. If there was a wedding, he had to go. And because he played laouto, and his eldest son [Christakis Pittyris] was a violinist, they used to go together and play weddings professionally.’"}, {"type": "p", "text": "Besides his son Christakis, Pittyris also played laouto with the village violinists Konstantis Nikolatzis and Yiorgos Kosti Poyiatzis."}, {"type": "p", "text": "Andreas Pittyris sings for Notopoulos's recording without instruments. In our arrangement, the vocal melody is framed by bowed instruments (lyra and double bass). This means we chose to depart from the strictly Cypriot way these narrative songs were traditionally performed, i.e. unaccompanied. We also chose not to cut the lyrics to shorten the piece, because we wanted, firstly, to convey the story in full, and secondly, to emphasise the monotonous rhythmic repetition of the same melody. We wanted to point the listener toward the practical function of this kind of song: to give rhythm to the harvest and make the work go better, but also to help the harvesters get through a highly repetitive and demanding task, carried out under the summer heat, for many consecutive days or weeks."}], "sources": ["Interview with Margarita Dimitroudiou and Eleni Sialouta, 25 September 2025"]}, {"title": "Manes Balos, Second", "credits": ["Lyrics & Music: Traditional", "Voice: Simon Mercouris", "Violin: Pavlos Michaelides", "Laouto: Stelios Papamichael"], "body": [{"type": "p", "text": "“Manes Balos, Second” is the second balos of Cyprus (more on the balos's role in Cypriot traditional music on p. [●]). My reference is the performance of Christoforos Mavris of Prastio, Mesaoria, as recorded by James Notopoulos in June 1953 in Lefkoniko. On that particular recording, Christoforos Mavris sings the “second balos,” accompanied by Yeorgios Psyllos (violin) and Prokopis P. Laoutaris (laouto)."}, {"type": "p", "text": "Christoforos Mavris was born in 1905 in Prastio, Mesaoria, the youngest child in his family, with two brothers, Yiorkos and Solomis, and four sisters, Anastasia, Eleni, Antzelou and Kyriakou. When he was forty days old, his father, also named Christoforos, died, and the boy took his name. He married at 37 and had eleven children. He never went to school and worked the land from childhood. He rented fields to sow and also had an orchard outside Kontea; around 1942 he moved with his family to live in the orchard. In a conversation we had, his youngest son, Theodoros (“Theoris”), remembers his father as especially hard-working and inventive. This was confirmed to me by Antonis Tsiakkiros, the village elder of Prastio, older than Theoris and a fellow-villager of Mavris, who told me: ‘He was a farmer, but he also got things done. He was resourceful. They put down cotton at Chavouza, a dam for Mesaoria which had no water, and because he couldn't find anyone to plant it for him, he built the first cotton-seeder of the area himself. People came from Athienou to copy him, to make the seeders that exist today. That was just his nature — a man of many crafts. His mind worked fast.’"}, {"type": "p", "text": "Tsiakkiros remembers Mavris as a central figure at weddings and festivities in Prastio: ‘I remember him well at weddings. He was a great mane singer, a fine improviser, and he could tsattize too. I remember at one wedding the groom, Prodromas, was dancing — he had married a girl from Lapathos. The bride's father they called Antonas.’"}, {"type": "p", "text": "The groom, Prodromas, said: ‘I chose and I loved a woman from Lapathos, and to hell with the Prastio girls, good riddance.’ And my uncle answered him at once: ‘Forgive Antonas, for he was under pressure — otherwise you'd have stayed a determined bachelor, Prodromas.’ He went on teasing the groom afterward: ‘Of all of us, Prodromas ate the most, and went to the millstone, and came out with a strong bird, feathers and all on top.’"}, {"type": "p", "text": "Although Prastio was a fairly large village, Tsiakkiros does not remember it having its own musicians; violinists came from other villages for weddings, for Easter, and for the festival of Ayios Georgios, the village's own feast day. He does, however, remember Panayis Yiorki Patsis, an outstanding virtuoso of the pithkiavli (Cypriot flute), whom Notopoulos recorded extensively in 1953."}], "sources": ["Interview with Theodoros Mavris, 22 December 2025", "Interview with Antonis Tsiakkiros, 12 January 2026"]}, {"title": "I'll Buy You a Motorbike", "credits": ["Music & Lyrics: Traditional", "Voices: Simon Mercouris, Stelios Papamichael", "Lyra: Stelios Papamichael", "Laouto: Simon Mercouris"], "body": [{"type": "p", "text": "One of the best-known Cypriot songs in 9/8 time. It was recorded by Yiorgos Spanos, a chanter and performer of traditional songs, at the studio of Kyriakos Keravnos (Keravnophone) in the early 1960s. He is accompanied by the orchestra of the Turkish-Cypriot violinist Mehmet Ali Vasfi Tatlıyay. The introduction and the musical responses between verses that we used are variations of the first melody of the first women's kartzilamas."}], "sources": []}, {"title": "Kotrofisimi Voice", "credits": ["Music: Traditional", "Lyrics: 1st & 2nd verse: Nikolas Kouvaros; 3rd, 4th & 5th verse: Dimitris Ttakkas; 6th & 7th verse: Christos Prigkopoullos", "Voices: Simon Mercouris (1st, 3rd, 5th & 7th verse), Stelios Papamichael (2nd, 4th & 6th verse)", "Violin: Evros Voskaridis", "Laouto: Stelios Papamichael", "Double bass: Dimitris Pichas"], "body": [{"type": "p", "text": "This Voice belongs to the Famagusta district (more on the term “Voice” in Cypriot music on p. [●]). Christos Sikkis recorded it as “The Liopetri Woman’s Voice” on his album Cyprus – Paradise on Earth (1993)."}, {"type": "p", "text": "According to Petros Raftis's book Kotrofisimi – Liopetri Voice, this is the Voice that Georgios Kotrofos of Liopetri used to lament his daughters Vasiloú and Kyriakoú, who drowned in the 1919 drowning tragedy at the Liopetri River. The story was told to Mr. Petros by Andreas Gristakkos, a folk poet and musician (pithkiavli) of the area, as he had heard it from his grandmother Theognosia Paraskeva Lefteri (“Kasapou” or “Fonitsou”), born in 1898. On 9 June 1919, people from Liopetri, Xylofagou and Avgorou gathered at the Liopetri River for the traditional Kataklysmos festivities. As part of the celebrations they took a boat ride, which proved fatal. Thirty people boarded the boat of Paraskevas Savva-Kkeletzis; at the mouth of the river, where the water is deep, the boat capsized — probably owing to a sudden shift of weight from one side to the other. Since very few people could swim at the time, 25 of the 30 passengers drowned, mostly women and children. Two of the victims were Kotrofos's daughters. When they were pulled ashore, dead, Kotrofos sat down among them and said, to this Voice's melody:"}, {"type": "verse", "lines": ["“I shall beg the priest not to bury them under earth, / for I will not surrender my daughters to the dark soil. / Had Death been fair and shown some mercy, / our parents would never have drunk such bitter cups.”"]}, {"type": "p", "text": "It should be noted that the same Voice is called “Paralimnitissa Voice” in Paralimni, and was recorded as such in 1976 on RIK by Konstantis Artymatas (with Yiorgos Poyiatzis on violin and Dimosthenis Zanettou on laouto). Later recordings of the “Paralimnitissa” were made by Kyriakou Pelayia with the ensemble “Mesoyeios” (1995) and by Kyriakou Mouaimi (2009). There is some naming confusion here, since “Paralimnitissa” is also used for a Voice fairly similar to the “Straight Voice.” Tefkros Anthias writes that the “Paralimnitissa” is ‘the most widespread Cypriot “Voice” [...] one of these variants is known as “the Voice of the straight”’, but distinguishes the “Liopetritissa” from the “Paralimnitissa”, explaining that although the former emerged from Liopetri, which neighbours Paralimni, ‘it has nothing in common with the Paralimnitissa.’"}, {"type": "p", "text": "Leaving the naming question aside, the melody of this Voice is especially mournful and elegiac. Although Stelios and I mostly sang love couplets and short verses to it, I chose ones that I felt carried a more sorrowful, almost existential meaning. The first couplet and second short verse are by Nikolas Kouvaros (Liopetri); the third, fourth and fifth are by Dimitris Ttakkas (Liopetri); the sixth and seventh are by Christos Prigkopoullos (Avgorou). Orchestrally, we tried to avoid the heavily accented rhythmic patterns found in other recordings of this Voice: the rhythm in the laouto and double bass is implied but not stressed, so as not to detract from the Voice's mournful character. My reference here was the laouto playing of Mimis Petros Laoutaris in the field recording of this Voice as “Kotrofisimi,” made by the Peloponnesian Folklore Foundation (1978–85). On that recording, the singers are Christos Prigkopoullos and Pieris Pierettis, a well-known violinist and singer of the Kokkinochoria from Frenaros, who also plays violin on that recording."}, {"type": "heading", "text": "Nikolas Kouvaros"}, {"type": "p", "text": "The 1st verse and 2nd short verse are by Nikolas Kouvaros. Kouvaros was born in Liopetri on 2 May 1899, one of eight siblings, son of Lambrinos Psyllos and brother of the folk poet Paraskevas Psyllos, or “Ttapakkos”. He himself had nine children, three sons and six daughters. His son Lambros Kouvaros was also a folk poet who specialised in tsattisma and love verse. “Kouvaros” was a nickname he took on in childhood: his grandson Petros Raftis, also a folk poet, told me that as a boy Kouvaros worked as a hired hand watching over sheep pens at Trachonas, and one spring, as the young shoots were coming up, he couldn't be seen above the growth — people would see the flock moving but not the shepherd, only a little ball (“kouarouin”) bobbing along, and would call out, ‘Hey, was that little ball you?’ The nickname ‘Kouvaros’ stuck, and he adopted it as a surname."}, {"type": "p", "text": "He never went to school, but picked up a few letters at the coffee-house. He did many jobs — hired hand, shepherd, well-digger, trader (buying and selling eggs and poultry, or bartering them for other goods), butcher, and baker. For financial reasons he also volunteered as a muleteer in both World Wars, handling army pack-mules — something many Cypriots did in the World Wars, owing to their familiarity with these animals. As a bard he also published three verse pamphlets, which he sold to make a living."}, {"type": "p", "text": "Kouvaros both sparred and sang love songs, but he particularly excelled at tsattisma — poetic 'combat' against another singer. He took part in poetry contests at the Kataklysmos in Varosi, and from 1949 was regularly awarded first prize or an honourable mention. His chief rival, though much younger — born in 1918 — was Dimitris Ttakkas, also his fellow-villager. Mr. Petros told me: ‘And Ttakkas certainly acknowledged him — he was his chief rival. My grandfather was first in tsattisma, with Ttakkas second; Ttakkas was first in love verse, with my grandfather second or third. They admired each other.’"}, {"type": "p", "text": "Their famous clash at the 1969 Varosi Kataklysmos went down in local memory; Mr. Petros described it to me as ‘a heavyweight boxing match, with clever, well-aimed songs.’ Kouvaros eventually won first prize in that particular contest."}, {"type": "p", "text": "Mr. Petros learned many stories about Kouvaros from Ttakkas himself, who had witnessed many of Kouvaros's contests: singers, especially from Avgorou, would come at mid-August and sleep in Kouvaros's yard; then, at the village festival, they'd have a shelter and sing. He was known throughout Cyprus. They would also go down to the feast of Ayios Anastasios at Peristeronopigi, near Varosi, which was a livestock fair, and Mr. Petros's grandfather would go too. Singers would come and challenge him, one after another; according to Ttakkas, ‘one would come, get “struck down” by him, and leave; another would come, get “struck down”, and leave’ — meaning Kouvaros always had a crushing reply ready. When Mr. Petros asked Ttakkas if he himself had ever feared old Kouvaros, Ttakkas replied: ‘Who didn't fear the old man's grandeur?’"}, {"type": "heading", "text": "Dimitris Ttakkas"}, {"type": "p", "text": "The 3rd, 4th and 5th short verses are by Dimitris Ttakkas. He was born in Liopetri on 20 July 1918. He lost his father at three months old and his mother at nine years old, and was raised from then on by his grandmother in Ayia Napa. Before pensions existed, the old woman used to go out begging, and she would take the boy along with her; his daughter, Maria Ttakka, in a conversation about her father, told me: ‘The old man was ashamed [of the begging], and his grandmother would cover for him with her cloak.’ After finishing two years of primary school, he became a hired hand for Christos Ttakkas of Liopetri, tending sheep pens; Christos Ttakkas, who had no children of his own, felt affection for the boy. Mrs. Maria recalls: ‘In the old days shepherds, in the summer heat, would leave the pens open at night. He was nine years old, sleeping up there in the rocky pastures, homesick. Imagine a small boy alone in the dark...’"}, {"type": "p", "text": "In 1937 Christos Ttakkas married Dimitris off to Annezou of Vasilas from Gypsou, and gave him thirty sheep as a gift so he could continue as a shepherd — a trade he kept for the rest of his life. They had seven children, five daughters and two sons."}, {"type": "p", "text": "Ttakkas excelled at both tsattisma and love verse. He ‘sparred’ and sang love songs with the leading singers of his day, at coffee-houses, village festivals and contests. His daughter recalls the festivities at the small church of Panayia Eleousa in Liopetri, where all the singers had their spot and would gather, villagers and outsiders alike, with old Straochambis playing them the violin for days on end, usually on Sundays, and the coffee-house of Kettiros as another gathering place."}, {"type": "p", "text": "Ttakkas outlived and knew the oldest of the Kokkinochoria singers, born around the turn of the twentieth century — Chambis Kolokasis (“Straochambis”), Minas Sheftalis, Nikolas Kouvaros, Christos Prigkopoullos, Petros Peskesis (“Kantziaras”), Xenis Patsalos — and earned their respect (see above Kouvaros's own opinion of Ttakkas)."}, {"type": "p", "text": "Ttakkas also competed successfully at the poetry contests held at the Kataklysmos in Varosi, in Ayia Napa and in Larnaca, winning first prizes and honourable mentions more than thirty times. His daughter recalled a love couplet with which he won at the 1969 Kataklysmos: ‘In her own neighbourhood there stands a great rock, hollow at its base like her own fate; I went there at night and sat, and with my tears I wrote her dark parting; it caught fire and blazed, and how could any heart bear such grief?’ The rock, she said, was a real one in the village — as children they used to run and play on it; it was their spot."}, {"type": "p", "text": "As a folk poet, with the help of Konstantinos Yiangkoullis, Ttakkas published six poetry collections: To Xifotin (1978), Stylloman tou Mesomerkou (1978), Tsakkisman tis Imerous (1981), The Sea of Ayia Napa (1994), Running Water (1998), and The Pool of Siloam (1999)."}, {"type": "p", "text": "Dimitris Ttakkas died at the age of 87, on 17 March 2005. To me, his love songs are unsurpassed in their lyricism. Beyond the weight of meaning in his verse, his manner of singing was distinctive: slow, clear and commanding, seizing his audience's attention and lending meaning and emphasis to every syllable."}, {"type": "heading", "text": "Christos Prigkopoullos"}, {"type": "p", "text": "The 6th and 7th short verses are by Christos Prigkopoullos (“Ppoufis”). He was born in Avgorou on 22 December 1903, into a poor, large family. His grandson, Yiorgos Prigkopoullos, with whom I spoke about his grandfather, told me that as a young man he decided to go and live alone on Stavrovouni; he stayed five or six months, didn't like it, and came back down, where he started his family — eleven children in all. His first wife, Eleni, died giving birth to their first child; as she was carried from the church to the cemetery, along a road that (Mr. Yiorgos says) took half an hour to walk, they sang for her the whole way, and as they lowered her into the grave, he sang her this final couplet: ‘Rise, Eleni, for I shall enter your grave in your place — go home instead and hear your baby cry.’"}, {"type": "p", "text": "He was a man of many trades. He never went to school; he learned a few letters from the village priest — very few. He watched the fields, since he had a great many flocks; he owned a horse and served as the village's customs official (“tourkopoullos”) of Avgorou, and chanted in the church for forty years. He hunted with snares, decorated gourds, carving designs into them with an awl, and did heavy field labour at harvest time. He disliked being a hired hand, working for one employer after another, so he became a customs official instead, taking on jobs of his own to support his family. He lived close to bee-eaters, golden orioles, turtle-doves."}, {"type": "p", "text": "He came from a family of poets. He himself wrote to Konstantinos Yiangkoullis: ‘Song was in our blood [...] my grandfather sang, my uncle Minas Sheftalis, an undefeated contest singer, sang, my mother, Minas's sister, sang [...]’. Mr. Yiorgos puts it more simply: ‘It was in his line, in his blood.’"}, {"type": "p", "text": "Prigkopoullos also excelled at tsattisma and love songs, distinguishing himself several times at poetry contests in Kyrenia, Larnaca and Varosi. But he also sang in the village — at the coffee-houses, at the feast of the Apostles Peter and Paul at the village church, and on Easter Monday."}, {"type": "p", "text": "Mr. Yiorgos told me about his grandfather's singing companions: ‘His best company were Pierettis and Petros Mimis [well-known musicians of the Kokkinochoria area]. Pierettis used to seek him out, because he had no car, and would come and pick him up. His company was select. But he sang with many others too — with Patsalos, with Ttakkas, with Straochambis, with Yiarros [Dimitris Yiallouris], with Prosfyga [Kyriakos Moularis]. When they sang in the coffee-houses, us kids would run to climb onto some rock, any vantage point, to watch them.’"}, {"type": "p", "text": "Mr. Yiorgos remembers his grandfather vividly as a lover of merrymaking and festivity: ‘His one true love was having a good time. When he settled in with his company, drinking and celebrating, he might take two whole days to go home. Each of them kept their own jug of brandy or wine close at hand. They celebrated round the clock. One day he came home [from one such celebration], had his bath, shaved, and collapsed. He got up two or three days later. He said to his wife, “Ra Despinou, I didn't shave and then fall down, I've stayed unshaved [i.e. I never had the chance].” She replied, “Re Ttofi, you've been asleep for three days.” Imagine how much drink was in him, and how much lost sleep. Another time, he slaughtered a young pig and sat with his friends and they ate and drank. The next morning my grandmother woke up and said, “Ttofi, we're out of food.” He answered, “Despinou, you ate the pig.” She said, “Then what's that rooster doing wandering the yard? Slaughter it too!” They would sit round the clock, I tell you!’"}], "sources": ["Petros Raftis, Kotrofisimi – Liopetri Voice – 100 Years of Intangible Cultural Heritage (2019)", "Michalis Chatzimichael, The Voice of the People, the Voice of God: The Voices of Cypriot Musical Tradition (2024)", "Tefkros Anthias, “Folk Themes: Cypriot Folklore: The Cypriot Voices”, Neos Dimokratis, 20 November 1949", "Interview with Petros Raftis, 24 September 2025", "Petros Michael Raftis, My Grandfather's Songs. Nikolas L. Kouvaros – Episodes from his Life and Work (2019)", "Konstantinos G. Yiangkoullis, The Bards of Cyprus. Introduction – A Bio-Bibliography (1878–present) (2005)", "Interview with Maria Ttakka, 25 September 2025", "Dimitris Ttakkas, The Pool of Siloam (1999)", "Konstantinos G. Yiangkoullis, The Bards of Cyprus. Introduction – A Bio-Bibliography (1878–present) (2005)", "Interview with Yiorgos Prigkopoullos, 24 September 2025 and 22 May 2026", "Konstantinos G. Yiangkoullis, The Bards of Cyprus. Introduction – A Bio-Bibliography (1878–present) (2005)"]}, {"title": "Down at Rodon", "credits": ["Music: Recomposition of traditional melodies; arranged by Simon Mercouris", "Instrumental section: Composed by Simon Mercouris", "Lyrics: Traditional", "Voice: Nikoletta Dimitriou", "Second voices: Simon Mercouris, Stelios Papamichael", "Lyra: Christina Polykarpou", "Laouto: Simon Mercouris", "Tambouras: Charalambos Panteli"], "body": [{"type": "p", "text": "This song, with different melodies and lyrics, is widely known across mainland Greece. It made its way to Cyprus too, though, and became embedded in the island's traditional music. I first heard it in an unpublished recording that Theodoros Mavris played me, of his father Christoforos Mavris of Prastio, Mesaoria, singing it, as he himself had recorded it on tape (more on Christoforos Mavris on p. [●]). I loved Mavris's performance, and my curiosity about the song grew. I phoned Michalis Tterlikkas and, humming him the melody, asked if he recognised this song. He told me that, with a varied melody, Charalambos Dimosthenous of Kontea had sung it to him as the refrain of a mane sapayi (sabah) he played him on the pithkiavli. Searching further, I found a field recording made by Spyridakis and Karakasis on their 1960 folklore expedition to Cyprus, titled “Over There by the Sand, by the Little Rose Island.” The singer is Antigoni Charalambous, then 64 years old, from Tsada in Paphos, and her melody differs again from Mavris's performance. In a conversation with Michalis Tterlikkas, I asked whether we could really call this piece Cypriot. He answered: ‘We can say that [...] from the moment it took root and spread from Prastio to Tsada — with its variants, of course — it became integrated into Cyprus's traditional music. Many songs came to Cyprus this way, and the musicians of the time did not simply copy them, but each absorbed them into the Cypriot idiom, often with their own words. For it to be recorded both in Prastio, and in Kontea, and in Paphos, means that at some point it spread quite widely.’"}, {"type": "p", "text": "When I asked him how such songs travelled from Greece to Cyprus, he said: ‘Even before the Asia Minor catastrophe [and the refugee waves that followed], there were close ties between Cyprus and Asia Minor [...] Just as today a band comes from Greece and doesn't bring all its musicians — it brings, say, three key players and finds the rest in Cyprus — bands used to come from Asia Minor, playing then in the cabarets [the fashionable urban venues of the day]. They'd bring their key musicians and pick up some Cypriots too. One example is the late Averof, who played with them [...] So the Cypriot musicians would play too, and would pick up pieces from the Anatolians. Then, when they played these in summer at weddings and festivals, they'd play these Asia Minor pieces too, in altered form, in both words and music, so that they'd sound pleasing to the Cypriot ear. They absorbed the pieces, they didn't just copy them. That's how they gradually passed them on to the people.’ The other route was the gramophone — most coffee-houses had one. The late Michalis Poullos, a laouto player from Agkastina, put it plainly: ‘I'd go to the coffee-house to hear pieces, so I could go home and work them out on the laouto.’ Poullos, and Yiannis, and Kostis, who played at weddings, learned pieces this way too, and so, again through weddings, they reached the wider public. This is how certain melodies travelled and often took on other words along the way."}, {"type": "p", "text": "So I imagine that, by one or both of the routes Mr. Michalis described, “Down at Rodon” reached Cyprus and was absorbed into Cypriot music. My reference for this recomposition is the three performances I found and listened to. At the end of the verses I added an instrumental theme of my own that I feel suits the piece's tone."}, {"type": "p", "text": "It should be noted here that Charalambos Panteli, who plays tambouras on this song, pointed me (after we'd already recorded it in the studio) to a recording by Savvakis Lambrou called “Take Him, Girl, the Old Man” — in 9/8, with three couplets similar to those in Christoforos Mavris's variant, except that instead of “Turk”, Lambrou uses the word “old man.” Kyriakos Mappouras sings on Lambrou's recording."}], "sources": ["Interview with Michalis Tterlikkas, 1 April 2026", "Michalis Tterlikkas, “Traditional Songs of Cyprus of Asia Minor Origin”, mousalyra.com.cy"]}, {"title": "Marinioutou Voice", "credits": ["Lyrics & Music: Traditional", "Voices: Michalis (Mishiellis) Poullis (1st & 3rd verse), Simon Mercouris (2nd & 4th verse)", "Tambouras: Charalambos Panteli"], "body": [{"type": "p", "text": "“Marinioutou” is a Voice originating in the village of Agia Marina Skyllouras. One of its best-known performers was Yiannis Poullis. He was born in September 1914 in Agia Marina, the second of seven children. He went to school as far as the second grade, and was then sent to work in the fields; he was a farmer and stock-breeder by trade. He taught himself, however, to sing and to play the laouto, and played weddings in his own village and neighbouring ones. His usual partner at weddings was his fellow-villager, the blind violinist Vrachimis Sitzianis. His son Antonis Poullis, 83, told me: ‘On Sundays he'd take the laouto to the coffee-house, they'd roast meat and have a feast. My father danced a great deal. And at home we'd have feasts too. He'd play the laouto alone, sing, and everyone would enjoy themselves. His brother Pissas sang too — he knew a great many songs. The old man also sang manedes, and sang the “Karpasitou” too. When Yiannis, Antonis's father, sang, the women would go wild for him. He was quite the charmer. He'd come out onto the balcony and call out to summon his intended — that was their signal.’"}, {"type": "p", "text": "My reference for this interpretation is an unpublished 1968 recording of Yiannis made in London. His performance is particularly sweet, with elaborate vocal ornamentation. When I asked about this recording, his son Yiorgos Poullis, 80, told me his father had been in London for treatment on an eye injured during farm work. Staying at his son's home there, he picked up a bouzouki and sang “Marinioutou,” and Mr. Yiorgos recorded him on a tape recorder. Yiannis, after the Turkish invasion of 1974, was settled as a refugee in Kotziatis, where he lived until his death in 1997."}, {"type": "p", "text": "One day, when Stelios and I went to visit Mr. Antonis, his brother Mishiellis Poullis happened to be there too. He sang us “Marinioutou,” and Stelios and I looked at each other without a word — we'd had the same thought: Mishiellis's voice needed to be recorded. So he sings the first and third verses."}], "sources": ["Interview with Antonis Poullis, 11 November 2025", "Interview with Yiorgos Poullis, 18 May 2026"]}, {"title": "The Rear-Reaper's Song", "credits": ["Music & Lyrics: Traditional", "Voices: Simon Mercouris, Stelios Papamichael"], "body": [{"type": "p", "text": "A narrative song. Narrative songs were once an inseparable part of Cypriot daily life, accompanying various manual tasks (in the fields, at harvest, etc.) both to give rhythm to the work and to pass the time. This particular piece was also recorded under the title “Harvest Song.”"}, {"type": "p", "text": "My reference is the performance of two singers from Yiolou: Neofytos Chatzinikiforou (“Shishis”) and Kostas Efthimiou (“Karafkias”). They were recorded by Spyridakis and Karakasis during their 1960 folklore expedition to Cyprus, in a field recording at Yiolou. At the start of the recording, Spyridakis, after announcing the title and performers, explains that the “Rear-Reaper's Song” was sung during the harvest. On the ranking of reapers in the work, Nikoletta Dimitriou writes: ‘The finest reaper — the master of the task — was the lead reaper. He went first in the line of harvesters and opened the row, that is, he marked out the strip each worker was to cut. Beside the lead reaper stood the kkiayias, the second-ranked worker. The rest of the workers followed, and last of all came the raaris or laaris — the “rear man”, who brought up the tail. If anyone left a strip uncut, they were mocked and accused of leaving a “courin” or “vaklan” [an uncut clump]. But most of the jokes fell on the rear reaper, since, being last, he had to make sure everything ahead of him had been properly cut.’"}, {"type": "heading", "text": "Neofytos Chatzinikiforou (“Shishis”)"}, {"type": "p", "text": "Born in Theletra around 1902. He married Panayiotou Chatzigianni, a girl from Yiolou, with whom he had two children. He had a fine voice and was a well-known singer in the area, and also played the tambourine. He worked the land and also hired himself out for pay to reap and plough. According to Christakis Papanikolaou, village elder of Yiolou, and according to testimony from older residents, Shishis was much loved in the community and was a central figure at its various festivities. According to Father Kleopas Stylianou, Shishis's grandson, he loved merrymaking, and sang at home, out in the fields when he went to reap, at weddings and at village fairs. Father Kleopas remembers his grandfather singing at the festival held at the church of Ayia Eirini in Yiolou on Easter day, where they would build shelters with violinists. He also remembers him at the feast of the Holy Unmercenaries at the monastery near the village of Milia, later moved to the Krommyda area. His usual musical companions were the two violin-playing families of Yiolou: Savvas Savva (“Saglamis”) and his sons Argyris and Kyriakos (“Vakanos”; laouto), and Lazaros Ioakim and his son Chambis Lazarou (later of Nio Chorko)."}, {"type": "heading", "text": "Kostas Efthimiou (“Karafkias”)"}, {"type": "p", "text": "Born in Yiolou on 20 April 1906, son of Efthymios Yiannis and Varvara Nikola. He was the eldest of five siblings: Kyriakou, Dimitris, Prodromos and Ioannis. He married Theopisti Chatzieustathiou of Stroumbi and had three daughters: Myrofora, Stavroulla and Kyriakou. While in Yiolou, he worked the land. According to his sister-in-law, Neofyta Efthimiou, around 1965 Karafkias moved to Zakaki, Limassol, where he worked as a night watchman and builder's assistant. Karafkias had a fine voice and was also a capable dancer."}, {"type": "p", "text": "The performance of Chatzinikiforou and Efthimiou, as recorded by Spyridakis and Karakasis in 1960, is incomplete, as the recording cuts off midway through the song. I completed the verses using the transcriptions made by Athanasios Sakellarios and G. Ch. Papacharalambous. The 1960 recording is also musically fascinating in its own right: Chatzinikiforou and Efthimiou sing a duet without instruments. Karafkias sings the fifteen-syllable verse line first, steady, with his own set pauses and vocal turns; Chatzinikiforou then repeats the same line, but to a different melody, with a more plaintive character, playing with the timing and adding elaborate ornaments. Two voices singing the same line in a repeated pattern, each in a different manner, is quite an unusual and forward-looking device given what we know about how Cypriot songs were generally performed with more than one singer. Why Chatzinikiforou did this is harder to answer — perhaps he wanted his interpretation to stand out, perhaps he simply had the skill his partner lacked, perhaps that was just how he had learned it. Whatever we say is speculation. What matters is that neither singer is bound by the other's approach, and together they create a living musical dialogue. It is worth stressing that, in this case, since the rhythm is not dictated by instruments, each singer is free to take the melody and perform it in his own way."}], "sources": ["Interview with Christakis Papanikolaou, 28 December 2025", "Interview with Father Kleopas Stylianou, 25 May 2026", "Interview with Neofyta Efthimiou, 25 May 2026", "Nikoletta Dimitriou, “Songs and Stories of the Harvest”, concert notes, Chambis Engraving Municipal Museum, 4 July 2026"]}, {"title": "Paphian Voice", "credits": ["Music: Traditional", "Lyrics: Traditional", "Voice: Simon Mercouris", "Violin: Pavlos Michaelides", "Laouto: Stelios Papamichael"], "body": [{"type": "p", "text": "One of the best-known Voices of Cyprus, originating in the Paphos district (more on the term “Voice” in Cypriot music on p. [●]). My reference here is the performance of Panayiotis (“Panais”) Panayiotou of Empa, now 94. Panayiotou was born at Petrithkia, Empa, in Paphos, on 5 February 1932. He went to school as far as the third grade, then was taken out to help support the family, as he had lost his father at the age of two. His first job was at the water-wheel and in the fields. He later apprenticed to a master and learned saddle-making — fitting and repairing pack-saddles for animals. As he told me in our conversation: ‘[...] I would go and fetch the animal's saddle-pad from Chani and stitch it. The saddler's master would pay us a couple of coins for it. For me, back then, that was a lot of money.’"}, {"type": "p", "text": "As machines gradually replaced animals in field work, he learned from the same master to lay reed matting on rooftops. He was also a well-digger, and chanted for 55 years at the church of Panayia Theoskepasti in Kato Paphos. Between these trades and the farm work he never abandoned, he ‘got by’, as he told me: ‘I never had much book learning, but in life, I knew everything I needed to.’"}, {"type": "p", "text": "When I asked how he came to sing, he told me: ‘My passion was to sleep, wake, and sing. That was my passion. I'd go to the coffee-house in the evening and let my voice carry over the village from the top step. “Listen to crazy Panais,” they'd say. That was my violin.’ On the “Paphian Voice” specifically: ‘I heard the Voices from my mother. And I loved listening to them. We had no one to help us. I was small, whatever age I was, and they were holding the Kataklysmos festival down by the sea [Kato Paphos harbour], down there, and I heard a certain Filippos from Galataria singing the “Paphitissa”. I'd walk about, I'd sleep, all I cared about was learning that Voice.’"}, {"type": "p", "text": "Panayiotou was also a central figure at the feasts held ‘at Petrithkiotis the violinist's coffee-house in Ktima’: ‘Every night. Brandy, songs. I'd go to Petrithkiotis the violinist's coffee-house. We had our fun. He played and I sang. A blessed life. We'd take turns, one bringing the other, and we'd make a feast of it. We had everything back then.’"}, {"type": "p", "text": "Among other appearances, in 1973 Panayiotou featured on the RIK programme Music and Dances of Cyprus, presented by Andreas Stylianou, singing the “Paphitissa” with musicians Georgios Averof (violin) and Christodoulos Pipis (laouto). He also appeared as a singer in the OTHAK production Loves and Whims (1967), directed by Yiorgos Filis."}, {"type": "p", "text": "Panayiotou's performance of the “Paphitissa”, the length of his breath and his vocal turns, are particularly distinctive and set it apart from other performances of this Voice. This was our reference, and we tried, as much as we could, to preserve these features. Notably, while searching for archival material on Panayiotou, I found the 1973 broadcast Music and Dances of Cyprus in which he appears singing, in the “Paphitissa Voice”, the couplet ‘The springs dried up and the birds grew thirsty, and drank from my eyes' tears and quenched their thirst.’ When Panayiotou finishes his moving performance, my own father, with his dance group “SOUSTA”, takes over for the men's kartzilamas dances."}], "sources": ["Interview with Panayiotis Panayiotou, 13 July 2025"]}, {"title": "Three Cretan Monks", "credits": ["Lyrics & Music: Traditional", "Voice: Simon Mercouris", "Lyra: Stelios Papamichael"], "body": [{"type": "p", "text": "A traditional narrative song that travelled across almost the whole of Greece, with numerous variations in both words and melody. Variants exist in Asia Minor, Crete, Karpathos, Kalymnos, Tilos and Cyprus, as well as in several regions of mainland Greece such as the Peloponnese and Thrace."}, {"type": "p", "text": "My reference for the voice is the performance of Theodoulos Kallinikos (more on Kallinikos on p. [●]), as recorded by Cyprus Radio (RIK) in the early 1960s, as part of a recording series titled “Cypriot Dances and Songs.”"}], "sources": []}]}, "footnotes": {"el": {"1": "Δαμαί εννοώ τζ̆αι τον καλοφωνάρη τραγουδιστή με την κλασσική έννοια αλλά τζ̆αι κάποιον όι απαραίτητα καλλίφωνον: (α) που τσ̆αττίζει, δηλ. λέει αυτοσχέδιους στίχους «του καφκά» τζ̆αι «παλιώννει» με άλλον τραουδιστήν ή/τζ̆αι (β) συνθέτει τζ̆αι λέει ερωτικά δίστιχα ή ολιγόστιχα.", "2": "Ο Δαυίδ (γεν. 1864) εκατάγετουν που την Άσ̆σ̆ιαν τζ̆αι αργότερα εγκαταστάθηκεν στην Κισσόνεργαν της Πάφου.", "3": "Εννοεί σε ωδείον. Συγκεκριμένα, σύμφωνα με την έρευναν της Νικολέττας Δημητρίου, στον Γιάννην Μιχαηλίδην στην Λεμεσόν (1949-53).", "4": "Η χόβολη που εκάμναν τους καφέδες.", "7": "Χρυσόν νόμισμαν δηλαδή (μάλλον) κορμίν σφυρήλατον, καλοσχηματισμένον, όπως έναν κωνσταντινάτον.", "8": "Με τον όρον «τραουδιστής» δαμαί εν εννοούμεν τον καλοφωνάρη ναλλά κάποιον: (α) που τσ̆αττίζει, δηλ. λέει αυτοσχέδιους στίχους «του καφκά» τζ̆αι «παλιώννει» με άλλον τραουδιστήν ή/τζ̆αι (β) συνθέτει τζ̆αι λέει ερωτικά δίστιχα ή ολιγόστιχα.", "9": "Περιοχή στο Βαρώσι, όπου είχαν περβόλια πολλοί Παραλιμνίτες.", "10": "Απευθυνόμενος προς την νεκρήν κόρην του Πάτσαλου.", "11": "Όταν ένας νέος/μία νέα επεθάνισκεν ανύπαντρος/η, με την λέξην «γάμος» εννοούσαν την κηδείαν.", "12": "Τυχερόν, μοιραίον.", "13": "Εννοώντας την πίττα  που εδιούσαν στην μακαρκάν.", "14": "Αγροφύλακας.", "15": "Γιώργος Σεφέρης, Μέρες (Τόμος ΣΤ) 20 Απρίλη 1951- 4 Αυγούστου 1956 (Εκδόσεις Ίκαρος, 1986)", "16": "Κυπριακοί ρυθμοί και μελωδίες (1966).", "17": "Kemal Deveci, Τουρκοκύπριος μουσικός από τη Γαληνόπωρνη Καρπασίας, που παίζει ζουρνά.", "19": "Αντρέας Πιττυρής, συνέντευξη στην Νικολέττα Δημητρίου, 27 Δεκεμβρίου 2013", "21": "Να σημειωθεί ότι ο Καλλίνικος, που εκφωνεί τους συμμετέχοντες στες ηχογραφήσεις στο Λευκόνοικον, εκφωνεί λανθασμένα τον Μαυρήν ως «Χριστόδουλον» αντί «Χριστόφορον».", "22": "Δαμαί: το αποχωρητήριον.", "23": "Ως τέθκοιαν την ηχογραφήσαν τζ̆αι οι Γιώργος Κκιάμηλος (φκιολίν) τζ̆αι Ξενής Λιονταρής (λαούτο), στες επιτόπιες ηχογραφήσεις του Νοτόπουλου το 1953 στην Τζ̆ερύνειαν.", "24": "Τεύκρος Ανθίας, «Λαϊκά θέματα: Kυπριακή λαογραφία: Oι κυπριακές φωνές», Εφημερίδα Νέος Δημοκράτης, Τεύχος 20, Νοέμβριος 1949.", "25": "Τζ̆είνος που έφκαλλεν λάκκους του νερού.", "26": "Ο μέγας ευρωπαικός πόλεμος (γύρω στο 1920), Το τραγικόν δυστύχημα των δύο αποθρακωθέντων, Ελένης και Χρυσταλλούς, θυγατέρων του παπά-Παντελή Παπαχαραλάμπους εκ του χωρίου Σωτήρας, γενόμενον την 5 Δεκεμβρίου (1926), Ποίημα Τσ̆αττίσματος (Κούβαρος – Πεσκέσ̆ης, 1934).", "27": "Βλ. υποσημείωση 7, για το πώς χρησιμοποιείται δαμαί ο όρος «τραουδιστής».", "30": "Μπαστούνι.", "31": "Βοσκός.", "32": "Περιοχή με πετρώδες τζ̆αι σκληρόν έδαφος.", "33": "Εφοάτουν.", "35": "Ένα ρεφρέν που τραουθκιέται ρυθμικά στο τέλος ενός αμανέ.", "36": "Γιώργος Αβέρωφ, γνωστός φκιολάρης από το Καϊμακλίν (1913-90).", "37": "Δαμαί ο κύριος Αντώνης εννοεί την «Κωμήτισσαν Φωνήν» τζ̆αι όι την γνωστήν «Καρπασίτισσαν» ή «Καρπασίτιτζ̆ην» (βλ. σ. [●] για περισσότερες πληροφορίες σχετικά με τούντην ονοματολογικήν σύγχυσην).", "38": "Μενέλαος Ν. Χριστοδούλου και Κ. Δ. Ιωαννίδης (επιμ.), Κυπριακά δημώδη άσματα (1987).", "40": "Αθανάσιος Σακελλάριος, Τα Κυπριακά, ήτοι γεωγραφία, ιστορία και γλώσσα της νήσου Κύπρου από των αρχαιοτάτων χρόνων μέχρι σήμερον (1891).", "41": "Γ. Χ. Παπαχαραλάμπους, Κυπριακά ήθη και έθιμα (1965).", "42": "Μηχανισμός άντλησης νερού για το πότισμαν των περιβολιών. Το γαούριν ή η μούλα ήταν τα ζώα που εχρησιμοποιούνταν κατεξοχήν για την περιστροφικήν κίνησην του μηχανισμού, που ανέβαζεν το νερόν που το πηγάδιν. Για να δουλεύκει ο μηχανισμός, το ζώον έπρεπε να κινείται. Δουλειά πολλών μιτσ̆ιών τότε ήταν να γλέπουν το ζώον να μεν ιστέκει στο αλακάτιν.", "43": "Το μαλακόν μέρος του σαμαρκού, που εβάλλαν στην πλάτην του ζώου για να μεν το πληγώννει το ξύλενον σαμάριν.", "45": "Γιάννης Πετριθκιώτης (1913-;).", "46": "Οργανισμός Θεατρικής Αναπτύξεως Κύπρου, πρόδρομος του Θεατρικού Οργανισμού Κύπρου (ΘΟΚ)"}, "en": {"1": "Here I mean both the fine-voiced singer in the classical sense, and also someone who: (a) tsattizes, i.e. recites improvised verses “out of the blue” and ‘spars’ with another singer, and/or (b) composes and recites improvised love couplets or short verses.", "2": "David (b. 1864) came from Assia and later settled in Kissonerga, Paphos.", "3": "Meaning at a conservatory. Specifically, according to Nikoletta Dimitriou's research, under Yiannis Michaelides in Limassol (1949–53).", "4": "The embers they used to make coffee.", "7": "That is, a gold coin — or rather, a beaten, well-shaped body, like a coin (“constantinato”).", "8": "By the term “singer” here we mean not only the fine-voiced performer, but also someone who: (a) tsattizes, i.e. recites improvised verses “out of the blue” and ‘spars’ with another singer, and/or (b) composes and recites improvised love couplets or short verses.", "9": "An area in Varosi where many people from Paralimni had orchards.", "10": "Addressed to Patsalos's dead daughter.", "11": "When a young unmarried man or woman died, the word “gamos” (“wedding”) was used to mean the funeral.", "12": "Fated, fortunate.", "13": "Meaning the pie given out at the funeral meal.", "14": "A field guard.", "15": "George Seferis, Days (Volume VI), 20 April 1951 – 4 August 1956 (Ikaros Publications, 1986).", "16": "Cypriot Rhythms and Melodies (1966).", "17": "Kemal Deveci, a Turkish-Cypriot musician from Galinoporni, Karpasia, who plays the zourna.", "19": "Andreas Pittyris, interview with Nikoletta Dimitriou, 27 December 2013.", "21": "It should be noted that Kallinikos, who announces the participants on the Lefkoniko recordings, mistakenly announces Mavris as “Christodoulos” instead of “Christoforos.”", "22": "Here: the outhouse/toilet.", "23": "Also recorded as such by Yiorgos Kkiamilos (violin) and Xenis Liontaris (laouto), in Notopoulos's 1953 field recordings in Kyrenia.", "24": "Tefkros Anthias, “Folk Themes: Cypriot Folklore: The Cypriot Voices”, Neos Dimokratis newspaper, Issue 20, November 1949.", "25": "The man who dug water wells.", "26": "The Great European War (around 1920); The Tragic Misfortune of the Two Girls Burned to Death, Eleni and Chrystallou, Daughters of Father Panteli Papacharalambous of the Village of Sotira, Which Occurred on 5 December (1926): A Tsattisma Poem (Kouvaros – Peskesis, 1934).", "27": "See footnote 7, on how the term “singer” is used here.", "30": "A walking stick.", "31": "A shepherd.", "32": "An area with rocky, hard ground.", "33": "They were homesick.", "35": "A refrain sung rhythmically at the end of a mane.", "36": "Georgios Averof, a well-known violinist from Kaimakli (1913–90).", "37": "Here Mr. Antonis means the “Komitissa Voice,” not the well-known “Karpasitissa” (see p. [●] for more on this naming confusion).", "38": "Menelaos N. Christodoulou and K. D. Ioannidis (eds.), Cypriot Folk Songs (1987).", "40": "Athanasios Sakellarios, Ta Kypriaka: The Geography, History and Language of the Island of Cyprus from Ancient Times to the Present (1891).", "41": "G. Ch. Papacharalambous, Cypriot Customs and Traditions (1965).", "42": "A water-lifting mechanism used to irrigate orchards. The donkey or mule was the animal typically used to turn the mechanism, which raised water from the well. For it to work, the animal had to keep moving; it was often a child's job to watch that the animal did not stop at the wheel.", "43": "The soft part of the pack-saddle, placed on the animal's back so the wooden saddle-frame would not injure it.", "45": "Yiannis Petrithkiotis (1913–?).", "46": "The Cyprus Theatrical Development Organisation, forerunner of the Cyprus Theatre Organisation (THOC)."}}, "meta": [{"id": "song-1", "n": 1, "title_el": "Της Σούσας (Αγία Μαρίνα Σκυλλούρας)", "title_en": "Sousa's Song (Agia Marina Skyllouras)"}, {"id": "song-2", "n": 2, "title_el": "Ο Σκλάβος", "title_en": "The Slave"}, {"id": "song-3", "n": 3, "title_el": "Ο Διενής ψυχομασ̆εί", "title_en": "Digenis Breathes His Last"}, {"id": "song-4", "n": 4, "title_el": "Φωνή Καταραμένη", "title_en": "Cursed Voice"}, {"id": "song-5", "n": 5, "title_el": "Μανές Μπάλος Πρώτος", "title_en": "Manes Balos, First"}, {"id": "song-6", "n": 6, "title_el": "Τα στεφανώματα (Συρτός Παφίτικος)", "title_en": "The Wedding Crowning (Paphian Syrtos)"}, {"id": "song-7", "n": 7, "title_el": "Καρπασιτού του Τζ̆ιαννή (Φωνή Κωμήτισσα)", "title_en": "Yiannis's Karpasitou (Komitissa Voice)"}, {"id": "song-8", "n": 8, "title_el": "Η Λενού", "title_en": "Lenou"}, {"id": "song-9", "n": 9, "title_el": "Ο Πραματευτής και ο κλέφτης αδελφός", "title_en": "The Merchant and His Thieving Brother"}, {"id": "song-10", "n": 10, "title_el": "Μανές Μπάλος Δεύτερος", "title_en": "Manes Balos, Second"}, {"id": "song-11", "n": 11, "title_el": "Να σου γοράσω μηχανήν", "title_en": "I'll Buy You a Motorbike"}, {"id": "song-12", "n": 12, "title_el": "Φωνή Κοτροφίσιμη", "title_en": "Kotrofisimi Voice"}, {"id": "song-13", "n": 13, "title_el": "Κάτω στη Ρόδον", "title_en": "Down at Rodon"}, {"id": "song-14", "n": 14, "title_el": "Φωνή Μαρινιωτού", "title_en": "Marinioutou Voice"}, {"id": "song-15", "n": 15, "title_el": "Τραούδιν του Ραάρη", "title_en": "The Rear-Reaper's Song"}, {"id": "song-16", "n": 16, "title_el": "Φωνή Παφίτισσα", "title_en": "Paphian Voice"}, {"id": "song-17", "n": 17, "title_el": "Τρεις καλοήροι κρητικοί", "title_en": "Three Cretan Monks"}]}</script>
